name: Salesforce
tags:
- AI
- Analytics
- Cloud
- Commerce
- CRM
- Customer Service
- Enterprise
- Marketing
- Platform
- Sales
type: Index
image: https://www.salesforce.com/content/dam/sfdc-docs/www/logos/logo-salesforce.svg
access: 3rd-Party
created: '2025-06-05'
modified: '2026-05-19'
position: Consumer
description: Salesforce is a cloud-based customer relationship management (CRM) platform that provides a comprehensive suite
  of enterprise applications for sales, service, marketing, and more.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
specificationVersion: '0.19'
common:
- type: ArazzoWorkflows
  url: arazzo/
  workflows:
  - url: arazzo/salesforce-bulk-delete-records-workflow.yml
    name: Bulk Delete Records
    summary: Run the full Bulk API 2.0 delete lifecycle — create a delete ingest job, upload a CSV of Ids, close, poll, and read successful results.
  - url: arazzo/salesforce-bulk-insert-records-workflow.yml
    name: Bulk Insert Records
    summary: Run the full Bulk API 2.0 insert lifecycle — create an ingest job, upload CSV, close, poll, and read successful results.
  - url: arazzo/salesforce-bulk-query-workflow.yml
    name: Bulk Query
    summary: Run the Bulk API 2.0 query lifecycle — create a query job, poll until JobComplete, and download the result CSV.
  - url: arazzo/salesforce-bulk-upsert-records-workflow.yml
    name: Bulk Upsert Records
    summary: Run the full Bulk API 2.0 upsert lifecycle — create an upsert ingest job keyed on an external Id field, upload CSV, close, poll, and read successful results.
  - url: arazzo/salesforce-create-account-with-contacts-workflow.yml
    name: Create Account with Contact
    summary: Create an Account and then create a Contact that belongs to it.
  - url: arazzo/salesforce-create-case-for-contact-workflow.yml
    name: Create Case for Contact
    summary: Create a support Case associated with an existing Contact and Account.
  - url: arazzo/salesforce-create-lead-and-convert-workflow.yml
    name: Create Lead and Follow-up Records
    summary: Create a Lead, then create the related Task and Campaign Member records that move it through the sales process.
  - url: arazzo/salesforce-create-opportunity-with-contact-role-workflow.yml
    name: Create Opportunity with Contact Role
    summary: Create an Opportunity and then attach an OpportunityContactRole linking a Contact to the deal.
  - url: arazzo/salesforce-create-record-workflow.yml
    name: Create Record
    summary: Create an SObject record then retrieve it by its newly assigned record id.
  - url: arazzo/salesforce-delete-record-workflow.yml
    name: Delete Record
    summary: Delete an SObject record by id after confirming it exists.
  - url: arazzo/salesforce-describe-sobject-workflow.yml
    name: Describe SObject
    summary: List all SObjects in the org then fully describe one object's metadata.
  - url: arazzo/salesforce-get-list-view-records-workflow.yml
    name: Get Records for a List View
    summary: Discover an object's list views, then load the records for a chosen list view.
  - url: arazzo/salesforce-get-org-limits-workflow.yml
    name: Get Org Limits
    summary: Read the current org governor limits and remaining quotas.
  - url: arazzo/salesforce-get-picklist-values-workflow.yml
    name: Get Picklist Values for a Record Type
    summary: Resolve an object's record type, then fetch its picklist field values.
  - url: arazzo/salesforce-get-record-ui-workflow.yml
    name: Get a Record UI Representation
    summary: Fetch a record's UI API representation with its object metadata and layout fields.
  - url: arazzo/salesforce-mc-manage-contacts-workflow.yml
    name: Look Up and Remove a Contact
    summary: Authenticate, read a specific contact by its contact key, then delete it.
  - url: arazzo/salesforce-mc-manage-data-extension-workflow.yml
    name: Upsert and Read Data Extension Rows
    summary: Authenticate, upsert rows into a Data Extension, then read the rows back.
  - url: arazzo/salesforce-mc-manage-journey-workflow.yml
    name: Enter a Contact into a Journey
    summary: Authenticate, find a published journey, inspect it, then fire an entry event.
  - url: arazzo/salesforce-mc-send-triggered-email-workflow.yml
    name: Send a Triggered Email
    summary: Authenticate, fire a triggered email send, then poll the recipient's send status.
  - url: arazzo/salesforce-soql-query-workflow.yml
    name: SOQL Query
    summary: Run a SOQL query then page additional results via the queryMore token.
  - url: arazzo/salesforce-sosl-search-workflow.yml
    name: SOSL Search
    summary: Run a SOSL full-text search across multiple SObjects in a single call.
  - url: arazzo/salesforce-update-record-workflow.yml
    name: Update Record
    summary: Update fields on an existing SObject record then read it back to confirm.
  - url: arazzo/salesforce-upsert-by-external-id-workflow.yml
    name: Upsert by External Id
    summary: Create or update an SObject record keyed on an external id field value.
