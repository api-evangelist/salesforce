  description: The Salesforce REST API provides a simple and powerful web service interface to interact with Salesforce org
    data. It supports creating, reading, updating, deleting, and querying records using SOQL and SOSL, and is the primary
    API for building connected applications against Salesforce.
- aid: salesforce:salesforce-soap-api
  name: Salesforce SOAP API
  tags:
  - CRM
  - Enterprise
  - Objects
  - Records
  - SOAP
  image: https://www.salesforce.com/content/dam/sfdc-docs/www/logos/logo-salesforce.svg
