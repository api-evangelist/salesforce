generated: '2026-06-20'
method: searched
source: developer.salesforce.com component + design-system documentation
notes: >-
  Salesforce ships several client-side / embeddable UI component surfaces distinct from the
  server-side SDKs in packages/. These are the front-end building blocks for Lightning Experience,
  Experience Cloud, and embedded/headless surfaces.
families:
  - name: Lightning Web Components (LWC)
    kind: web-components
    description: >-
      Standards-based custom-element framework and base component library (lightning-* elements)
      for building UI on the Salesforce platform; open-sourced as the LWC engine.
    docs: https://developer.salesforce.com/docs/platform/lwc/overview
    loader: "@lwc/engine-dom (open source) / native on-platform runtime"
    repo: https://github.com/salesforce/lwc
  - name: Base Lightning Components
    kind: component-library
    description: >-
      Prebuilt lightning-* base components (data tables, forms, inputs, cards, buttons) available
      in the Lightning runtime, reusable in LWC and Aura.
    docs: https://developer.salesforce.com/docs/component-library/overview/components
  - name: Aura Components
    kind: component-library
    description: Legacy Lightning component framework; still supported, coexists with LWC.
    docs: https://developer.salesforce.com/docs/atlas.en-us.lightning.meta/lightning/intro_framework.htm
  - name: Salesforce Lightning Design System (SLDS)
    kind: css-design-system
    description: HTML/CSS blueprints, design tokens, and utility classes for Salesforce-consistent UI.
    docs: https://www.lightningdesignsystem.com/
    loader: "@salesforce-ux/design-system"
  - name: Embedded Service / Messaging for Web
    kind: embedded-widget
    description: Embeddable chat/messaging and Agentforce web-agent snippet for websites.
    docs: https://developer.salesforce.com/docs/service/messaging-web/overview
  - name: CRM Analytics Embedded Dashboards
    kind: embedded-analytics
    description: Embed CRM Analytics (Tableau CRM/Wave) dashboards via the analytics SDK/components.
    docs: https://developer.salesforce.com/docs/atlas.en-us.bi_dev_guide_sdk.meta/bi_dev_guide_sdk/
