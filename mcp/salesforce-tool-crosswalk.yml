notes: >-
  Binds each Salesforce DX MCP Server tool to the REST operation(s) that back it, so an agent can
  see the real parameters behind a tool name. IMPORTANT SHAPE FINDING: the Salesforce MCP server
  is a DEVELOPER-TOOLCHAIN server, not a data-plane wrapper. Only three of its named tools map
  onto the public REST surface at all (run_soql_query, run_apex_test, assign_permission_set);
  everything else is either local CLI/filesystem state (org auth, scratch orgs, code analysis,
  LWC scaffolding) or the SOAP Metadata API, which has no REST operation in the 257 harvested
  OpenAPI documents. The consequence is a very large rest_only set: 385 distinct operationIds
  are reachable over REST with no MCP tool in front of them. An agent that wants Salesforce CRM
  data still has to call the REST API directly — the MCP server will not get it there.
  The live MCP schemas were NOT introspected: the server is stdio-only and requires a
  locally-authenticated org, so inputSchema could not be read. Bindings below are by
  name/semantics against the documented tool list; confidence is set accordingly.
surfaces:
  openapi:
    path: openapi/
    document_count: 257
    operation_count: 385
    note: One refined document per tag; _original/salesforce-openapi.yml is the harvested source.
  graphql:
    endpoint: https://{instance}.salesforce.com/services/data/v{version}/graphql
    artifact: graphql/salesforce-graphql.md
    gated: true
    note: >-
      Requires an authenticated org session; the schema is org-specific (generated from that
      org's sObjects), so there is no single public SDL to introspect.
  mcp:
    url: null
    transport: stdio
    package: '@salesforce/mcp'
    gated: true
    note: Local stdio only; no hosted endpoint. See mcp/salesforce-mcp.yml deployment block.
crosswalk:
  - tool: run_soql_query
    category: data
    rest: [executeQuery, QueryAll]
    binding: GET /services/data/v{version}/query?q={soql} (and /queryAll for deleted/archived)
    confidence: high
    note: >-
      Inherits the `q` SOQL query parameter and the QueryResult envelope
      (totalSize/done/nextRecordsUrl/records). Pagination is the REST cursor, not an MCP concern.
  - tool: run_apex_test
    category: testing
    rest: [ToolingRunTestsAsync, ToolingRunTestsSync]
    binding: POST /services/data/v{version}/tooling/runTestsAsynchronous (or runTestsSynchronous)
    confidence: high
  - tool: run_agent_test
    category: testing
    rest: [Runagenttest, Getteststatus, Gettestresults]
    binding: Agent API test-run start plus status/result polling operations
    confidence: medium
    note: Composite — one tool call spans three REST operations (start, poll status, fetch results).
  - tool: assign_permission_set
    category: users
    rest: [SObjectCreate]
    binding: POST /services/data/v{version}/sobjects/PermissionSetAssignment
    confidence: medium
    note: >-
      Generic sObject create against the PermissionSetAssignment standard object; the operation
      is not permission-set-specific, so the binding is semantic rather than 1:1.
