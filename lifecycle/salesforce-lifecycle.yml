method: searched
source: developer.salesforce.com API version + release documentation
notes: >-
  Salesforce versions its platform APIs with a monotonically increasing integer version in the
  URI path (vNN.0), incremented once per seasonal platform release (Winter/Spring/Summer). Older
  API versions are supported for a long window; Salesforce has announced retirement of legacy
  versions (v7.0-v20.0 and v21.0-v30.0 in past cycles), so very old versions eventually return
  errors. There is no per-endpoint Sunset/Deprecation header contract on data APIs; deprecation
  is communicated via Release Notes and the API version-retirement notices.
