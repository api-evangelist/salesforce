description: Salesforce Sales Cloud editions, re-read from the published Sales Cloud pricing page on 2026-10-12 (HTTP 200).
  Prices are per user per month in USD.
notes: 'RE-READ 2026-10-12: the ladder on the page is now Free Suite, Starter Suite, Pro Suite, Core, Advanced and Max (Max
  ends "Contact us"); the Enterprise / Unlimited / Agentforce 1 names recorded on 2026-08-13 no longer appear. The comparison
  grid still lists "Web Services API" at "Additional $25 USD/user/month" on a lower tier, and the FAQ ties APIs to the edition
  above Pro Suite. No metered per-call API price is published; API consumption is governed by the org daily allocation in
  rate-limits/. Earlier note: CORRECTION 2026-08-13: this file previously carried method: generated from the 2026-05-04 bulk
  sweep and priced Pro Suite at $65. The live page prices Pro Suite at $100 USD/user/month. The Free Suite tier was also missing
  entirely. Both are fixed here from the live page. API-RELEVANT FINDING: API access is NOT included at every tier. The pricing
  page describes Enterprise as "the CRM for sales with more flexibility and web API", and the feature comparison grid lists
  "Web Services API" as an add-on at "Additional $25 USD/user/month" on the lower suites. In other words, on Starter and Pro
  the API is a paid upsell on top of the seat, and it is bundled from Enterprise upward. Salesforce does not publish a metered
  per-call API price; API consumption is governed by the org''s daily request allocation, which is itself a function of edition
  and licensed-user count — see rate-limits/salesforce-rate-limits.yml. Salesforce sells many other clouds (Service, Marketing,
  Commerce, Data Cloud, Platform, Agentforce add-ons, Tableau, MuleSoft, Slack) on separate pricing pages with their own tiers;
  this artifact covers the Sales Cloud ladder, which is the one the platform APIs key off.'
