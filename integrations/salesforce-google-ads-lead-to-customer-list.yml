  template: https://zapier.com/apps/google-ads/integrations/salesforce/78016/add-new-salesforce-leads-to-google-ads-customer-lists-with-emails
  edge_evidence: https://zapier.com/apps/google-ads/integrations/salesforce/78016/add-new-salesforce-leads-to-google-ads-customer-lists-with-emails
