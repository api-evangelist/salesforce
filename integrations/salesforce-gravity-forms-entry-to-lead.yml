arazzo: 1.0.1
info:
  title: Create Salesforce Leads from new Gravity Forms entries
  summary: Read a Gravity Forms entry and create a Salesforce Lead from its fields.
  description: Read a Gravity Forms entry and create a Salesforce Lead from its fields. Recreated from the Zapier template "Create Salesforce leads with new Gravity Forms submissions".
  version: 1.0.0
sourceDescriptions:
- name: salesforceCreate
  url: https://raw.githubusercontent.com/api-evangelist/salesforce/refs/heads/main/openapi/salesforce-create-api-openapi.yml
  type: openapi
- name: gravityFormsEntries
  url: https://raw.githubusercontent.com/api-evangelist/gravity-forms/refs/heads/main/openapi/gravity-forms-entries-api-openapi.yml
  type: openapi
workflows:
- workflowId: gravity-forms-entry-to-lead
  summary: Create Salesforce Leads from new Gravity Forms entries
  description: Read a Gravity Forms entry and create a Salesforce Lead from its fields.
  inputs:
    type: object
    properties:
      entryId:
        type: string
      lastName:
        type: string
      company:
        type: string
      email:
        type: string
      salesforceAuthorization:
        type: string
  steps:
  - stepId: get-entry
    description: Fetch the submitted Gravity Forms entry.
    operationId: $sourceDescriptions.gravityFormsEntries.getEntry
    parameters:
    - name: id
      in: path
      value: $inputs.entryId
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      entry: $response.body
  - stepId: create-lead
    description: Create the Lead in Salesforce.
    operationId: $sourceDescriptions.salesforceCreate.SObjectCreate
    parameters:
    - name: SOBJECT_API_NAME
      in: path
      value: Lead
    - name: Authorization
      in: header
      value: $inputs.salesforceAuthorization
    requestBody:
      contentType: application/json
      payload:
        LastName: $inputs.lastName
        Company: $inputs.company
        Email: $inputs.email
        LeadSource: Web
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      recordId: $response.body#/id
  outputs:
    recordId: $steps.create-lead.outputs.recordId
