naftiko: 1.0.0-alpha2
info:
  label: Sync Pardot prospects with Salesforce Leads and Campaigns
  description: Sync Account Engagement (Pardot) prospect scoring and grade back onto Salesforce Lead records, and attribute Campaign membership.
  tags:
  - Salesforce
  - Integration
  - Marketing automation
  - pardot
  created: '2026-05-20'
  modified: '2026-05-20'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
    PARDOT_API_KEY: PARDOT_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce
    baseUri: https://yourinstance.my.salesforce.com
    description: Salesforce API operations consumed by this integration.
    resources:
    - name: services-data-v60-0-sobjects-lead-id
      path: /services/data/v60.0/sobjects/Lead/{id}
      operations:
      - name: updatelead
        method: PATCH
        description: Update a Salesforce Lead with Pardot score and grade.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Path parameter id.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: services-data-v60-0-sobjects-campaignmember
      path: /services/data/v60.0/sobjects/CampaignMember
      operations:
      - name: addcampaignmember
        method: POST
        description: Add a Lead or Contact to a Salesforce Campaign.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  - type: http
    namespace: pardot
    baseUri: https://pi.pardot.com
    description: Pardot API operations consumed by this integration.
    resources:
    - name: api-prospect-version-4-do-read-email-email
      path: /api/prospect/version/4/do/read/email/{email}
      operations:
      - name: readprospect
        method: GET
        description: 'Pardot API: readProspect'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: email
          in: path
          type: string
          description: Path parameter email.
          required: true
  exposes:
  - type: mcp
    namespace: salesforce-pardot-mcp
    description: MCP adapter for the salesforce-pardot integration.
    tools:
    - name: salesforce_pardot
      description: Execute the salesforce pardot integration end-to-end.
      inputSchema:
        type: object
        properties:
          trigger_event:
            type: object
            description: Triggering event payload.
        required:
        - trigger_event
  - type: rest
    namespace: salesforce-pardot-rest
    port: 8080
    description: REST adapter for the salesforce-pardot integration.
    resources:
    - path: /salesforce-pardot
      name: salesforce-pardot
      description: REST surface for the salesforce-pardot integration.
      operations:
      - method: POST
        name: trigger
        description: Trigger the salesforce-pardot integration.
        call: salesforce_pardot
        with:
          trigger_event: rest.body
        outputParameters:
        - type: object
          mapping: $.
