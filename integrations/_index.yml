# Salesforce integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in salesforce-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: salesforce-stripe
  label: Mirror Stripe billing into Salesforce Opportunities
  partner: stripe
  category: Billing
  use_case: When a Stripe payment succeeds or a subscription is created, find or create the matching Salesforce
    Account + Contact and open a Closed Won Opportunity with the payment amount.
  source: curated
  status: pending-generation
  arazzo: null
- slug: salesforce-hubspot
  label: Two-way sync Salesforce Contacts with HubSpot Contacts
  partner: hubspot
  category: Marketing automation
  use_case: Bidirectionally sync Salesforce Contacts with HubSpot Contacts on email, keeping marketing-owned fields
    in HubSpot and sales-owned fields in Salesforce.
  source: curated
  status: pending-generation
  evidence: https://zapier.com/apps/salesforce/integrations/hubspot
  type: marketplace
  arazzo: null
- slug: salesforce-marketo
  label: Promote Marketo MQLs to Salesforce Leads
  partner: marketo
  category: Marketing automation
  use_case: When Marketo scores a lead as MQL, create or update the matching Salesforce Lead with lead source, score,
    and campaign attribution, then assign to a sales queue.
  source: curated
  status: pending-generation
  arazzo: null
- slug: salesforce-pardot
  label: Sync Pardot prospects with Salesforce Leads and Campaigns
  partner: pardot
  category: Marketing automation
  use_case: Sync Account Engagement (Pardot) prospect scoring and grade back onto Salesforce Lead records, and attribute
    Campaign membership.
  source: curated
  status: pending-generation
  arazzo: null
- slug: salesforce-slack
  label: Push Salesforce Opportunity stage changes into Slack
  partner: slack
  category: Collaboration
  use_case: When a Salesforce Opportunity changes stage (especially Closed Won / Lost), post a notification to the
    deal team Slack channel with amount, owner, and next steps.
  source: curated
  status: arazzo
  evidence: https://zapier.com/apps/salesforce/integrations/slack
  type: marketplace
  arazzo: salesforce-slack-record-update-message.yml
- slug: salesforce-gmail
  label: Log Gmail threads to Salesforce Contacts and Opportunities
  partner: gmail
  category: Email
  use_case: For each Gmail thread with a Contact's email, create a Salesforce Task / EmailMessage record on the
    matching Contact and any open Opportunity.
  source: curated
  status: pending-partner-spec
  evidence: https://zapier.com/apps/salesforce/integrations/gmail
  type: marketplace
  arazzo: null
- slug: salesforce-outlook
  label: Sync Outlook calendar meetings to Salesforce Events
  partner: outlook
  category: Email
  use_case: For each Outlook calendar meeting with external attendees that match Salesforce Contacts, create a Salesforce
    Event record linked to the right Account or Opportunity.
  source: curated
  status: pending-partner-spec
  arazzo: null
- slug: salesforce-mulesoft
  label: Front Salesforce with MuleSoft API-led integration
  partner: mulesoft
  category: Integration
  use_case: Use MuleSoft as the system API in front of Salesforce so external systems hit a stable, governed integration
    layer instead of raw Salesforce REST.
  source: curated
  status: pending-generation
  arazzo: null
- slug: salesforce-snowflake
  label: Stream Salesforce data into Snowflake CDP
  partner: snowflake
  category: Data warehouse
  use_case: Bulk-export Salesforce Accounts, Contacts, Opportunities, and Cases into Snowflake (or Snowflake's customer
    data cloud) for unified analytics and reverse ETL.
  source: curated
  status: pending-generation
  arazzo: null
- slug: salesforce-tableau
  label: Power Tableau dashboards from Salesforce CRM data
  partner: tableau
  category: BI
  use_case: Materialize Salesforce Opportunity pipeline and Account hierarchy as a Tableau data source for embedded
    executive dashboards.
  source: curated
  status: pending-generation
  arazzo: null
- slug: salesforce-docusign
  label: Generate DocuSign envelopes from Salesforce Opportunities
  partner: docusign
  category: Documents
  use_case: When a Salesforce Opportunity reaches the Proposal stage, generate a DocuSign envelope from a contract
    template populated with Opportunity, Account, and Contact data.
  source: curated
  status: pending-generation
  arazzo: null
- slug: salesforce-zoom
  label: Log Zoom meetings to Salesforce Accounts and Opportunities
  partner: zoom
  category: Meetings
  use_case: For each Zoom meeting with external invitees, create a Salesforce Event + Task on the matching Contact
    and any open Opportunity, including the meeting recording link.
  source: curated
  status: pending-generation
  evidence: https://zapier.com/apps/salesforce/integrations/zoom
