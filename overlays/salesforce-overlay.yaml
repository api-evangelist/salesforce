overlay: 1.0.0
info:
  title: API Evangelist enhancements for Salesforce (aggregate)
  version: 1.0.0
extends: openapi/salesforce-openapi.yml
actions:
- target: $.info
  update:
    x-apievangelist-provider: salesforce
    x-apievangelist-rating: 4
    x-apievangelist-enrichment: '2026-06-20'
    x-apievangelist-artifacts:
      authentication: authentication/salesforce-authentication.yml
      scopes: scopes/salesforce-scopes.yml
      errors: errors/salesforce-error-codes.yml
      conventions: conventions/salesforce-conventions.yml
      lifecycle: lifecycle/salesforce-lifecycle.yml
      agentic-access: agentic-access/salesforce-agentic-access.yml
- target: $.info
  update:
    x-apievangelist-conformance:
    - oauth2
    - oidc
    - graphql
    - grpc
    - asyncapi
