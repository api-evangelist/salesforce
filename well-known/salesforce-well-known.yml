generated: '2026-08-13'
method: probed
source: live probes of Salesforce identity, API and developer hosts
notes: >-
  Salesforce serves real /.well-known/ discovery documents from two hosts. The identity host
  (login.salesforce.com) publishes the OpenID Connect Discovery 1.0 document. The Agentforce /
  platform API host (api.salesforce.com) publishes BOTH RFC 8414 OAuth 2.0 Authorization Server
  Metadata and RFC 9728 OAuth 2.0 Protected Resource Metadata — the pair an MCP client needs to
  discover authorization for a remote tool surface. Both api.salesforce.com documents were newly
  discovered on 2026-08-13 and are saved verbatim here. developer.salesforce.com and
  www.salesforce.com serve no /.well-known/ documents at all; developer.salesforce.com returns a
  404 HTML SPA shell for every path, which is a miss, not a document. Instance / My Domain hosts
  ({instance}.salesforce.com) mirror the login-host OIDC configuration with instance-specific
  issuer and endpoints. No security.txt is served on any Salesforce host — the responsible
  disclosure program lives at security.salesforce.com/responsible-disclosure-policy instead
  (see security/salesforce-vulnerability-disclosure.yml).
checked: '2026-08-13'
