notes: >-
  Salesforce publishes first-party tooling packages (CLI, MCP server, Agents SDK, LWC engine,
  SLDS, Mobile SDKs, Java SOAP stubs) but does not ship a single official general-purpose
  server-side REST SDK for Node/Python/Ruby; the ecosystem standard clients for those languages
  are community-maintained (jsforce, simple-salesforce) and are recorded here as official:false.
  `version` and `published` are read from each registry's metadata endpoint on the date above.
  DECAY SIGNAL: the JavaScript and Java toolchains are current (npm packages published within the
  last 45 days), but com.force.api:force-wsc and com.force.api:force-partner-api last shipped
  64.0.3 on 2025-05-14 — pinned to API v64.0 while the platform is on v67.0 (Summer '26), i.e.
  the first-party Java SOAP stubs are three seasonal releases behind the API they wrap.
