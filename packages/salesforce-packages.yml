generated: '2026-06-20'
method: searched
source: developer.salesforce.com/tools + npm + PyPI + Maven Central + GitHub (forcedotcom/salesforcecli/salesforce orgs)
notes: >-
  Salesforce publishes first-party tooling packages (CLI, MCP server, LWC engine, Mobile SDKs) but
  does not ship a single official general-purpose server-side REST SDK for Node/Python/Ruby; the
  ecosystem standard clients for those languages are community-maintained (jsforce, simple-salesforce)
  and are recorded here as official:false. Java SOAP stubs (force-wsc, partner/enterprise WSDL jars)
  are first-party via Maven Central.
packages:
  # --- First-party tooling / developer platform ---
  - language: javascript
    registry: npm
    name: "@salesforce/cli"
    url: https://www.npmjs.com/package/@salesforce/cli
    install: npm install -g @salesforce/cli
    binary: sf
    official: true
    description: Official Salesforce CLI (sf) for org, project, metadata, Apex, and data operations.
  - language: javascript
    registry: npm
    name: "@salesforce/mcp"
    url: https://www.npmjs.com/package/@salesforce/mcp
    install: npx -y @salesforce/mcp
    official: true
    description: Official Salesforce DX MCP Server exposing org operations to MCP-capable assistants.
    source_repo: https://github.com/salesforcecli/mcp
  - language: javascript
    registry: npm
    name: "@salesforce/core"
    url: https://www.npmjs.com/package/@salesforce/core
    install: npm install @salesforce/core
    official: true
    description: Core library for building Salesforce CLI plugins and Node tooling (auth, connection, org).
  - language: javascript
    registry: npm
    name: "@lwc/engine-dom"
    url: https://www.npmjs.com/package/@lwc/engine-dom
    install: npm install @lwc/engine-dom
    official: true
    description: Lightning Web Components engine (open-source LWC framework runtime).
    source_repo: https://github.com/salesforce/lwc
  - language: javascript
    registry: npm
    name: "@salesforce/design-system-react"
    url: https://www.npmjs.com/package/@salesforce-ux/design-system
    install: npm install @salesforce-ux/design-system
    official: true
    description: Salesforce Lightning Design System (SLDS) CSS framework and design tokens.
    source_repo: https://github.com/salesforce-ux/design-system
  # --- First-party mobile ---
  - language: swift
    registry: cocoapods
    name: SalesforceSDKCore
    url: https://github.com/forcedotcom/SalesforceMobileSDK-iOS
    install: pod 'SalesforceSDKCore'
    official: true
    description: Salesforce Mobile SDK for iOS (Swift/Objective-C).
  - language: java
    registry: maven
    name: com.salesforce.mobilesdk
    url: https://github.com/forcedotcom/SalesforceMobileSDK-Android
    install: implementation 'com.salesforce.mobilesdk:SalesforceSDK'
    official: true
    description: Salesforce Mobile SDK for Android (Java/Kotlin).
  # --- First-party Java SOAP stubs ---
  - language: java
    registry: maven
    name: com.force.api:force-wsc
    url: https://mvnrepository.com/artifact/com.force.api/force-wsc
    install: <dependency><groupId>com.force.api</groupId><artifactId>force-wsc</artifactId></dependency>
    official: true
    description: Web Service Connector (WSC) — Salesforce SOAP/Bulk API Java client generator.
  - language: java
    registry: maven
    name: com.force.api:force-partner-api
    url: https://mvnrepository.com/artifact/com.force.api/force-partner-api
    install: <dependency><groupId>com.force.api</groupId><artifactId>force-partner-api</artifactId></dependency>
    official: true
    description: Generated Java stubs for the Salesforce Partner (SOAP) API.
  # --- Community de-facto standard clients (not first-party) ---
  - language: javascript
    registry: npm
    name: jsforce
    url: https://www.npmjs.com/package/jsforce
    install: npm install jsforce
    official: false
    description: Community Salesforce API library for Node.js and the browser (REST/SOAP/Bulk/Streaming).
    source_repo: https://github.com/jsforce/jsforce
  - language: python
    registry: pypi
    name: simple-salesforce
    url: https://pypi.org/project/simple-salesforce/
    install: pip install simple-salesforce
    official: false
    description: Community low-level Salesforce REST/Bulk/Apex client for Python.
    source_repo: https://github.com/simple-salesforce/simple-salesforce
