      - Credential
      summary: Salesforce Delete Credential
      description: Delete a credential.
      operationId: DeleteCredential
      parameters: []
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/DeleteCredentialRequest'
              - examples:
                - externalCredential: SampleExternalCredential
