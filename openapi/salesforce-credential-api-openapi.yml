openapi: 3.2.0
info:
  title: Salesforce Credential API
  description: 'Find the resources you need to start building. '
  contact: {}
  version: '1.0'
servers:
- url: https://login.salesforce.com
  variables: {}
- url: https://id
  variables: {}
- url: https://services
  variables: {}
- url: '{{url}}{{site}}/services/oauth2'
  variables:
    url:
      default: DefaultParameterValue
    site:
      default: DefaultParameterValue
security:
- oauth2:
  - api
tags:
- name: Credential
paths:
  /data/v64.0/named-credentials/credential:
    parameters: []
    get:
      tags:
      - Credential
      summary: Salesforce Get Credential
      description: Get a credential.
      operationId: GetCredential
      parameters:
      - name: externalCredential
        in: query
        description: Fully qualified developer name of the external credential.
        required: true
        style: form
        explode: true
        schema:
          type: string
        example: example_value
      - name: principalName
        in: query
        description: Name of the external credential named principal.
        required: true
        style: form
        explode: true
        schema:
          type: string
        example: example_value
      - name: principalType
        in: query
        description: 'Type of credential principal. Values are:

          * AwsStsPrincipal

          * NamedPrincipal

          * PerUserPrincipal'
        required: true
        style: form
        explode: true
        schema:
          type: string
        example: example_value
      responses:
        '200':
          description: OK
          headers:
            Date:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: Wed, 22 Nov 2023 12:01:04 GMT
            Strict-Transport-Security:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: max-age=63072000; includeSubDomains
            X-Content-Type-Options:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: nosniff
            X-XSS-Protection:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: 1; mode=block
            X-Robots-Tag:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: none
            Cache-Control:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: no-cache,must-revalidate,max-age=0,no-store,private
            Vary:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: Accept-Encoding
            Content-Encoding:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: gzip
            Transfer-Encoding:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: chunked
          content:
            application/json;charset=UTF-8:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessfulGetCredential'
                - examples:
                  - authenticationProtocol: Custom
                    authenticationProtocolVariant: NoAuthentication
                    authenticationStatus: Configured
                    credentials: {}
                    externalCredential: Test
                    principalName: Test
                    principalType: NamedPrincipal
                contentMediaType: application/json;charset=UTF-8
              example:
                authenticationProtocol: Custom
                authenticationProtocolVariant: NoAuthentication
                authenticationStatus: Configured
                credentials: {}
                externalCredential: Test
                principalName: Test
                principalType: NamedPrincipal
      deprecated: false
      servers:
      - url: https://services
        variables: {}
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
        ChooseTags: true
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    put:
      tags:
      - Credential
      summary: Salesforce Update Credential
      description: Update a credential.
      operationId: UpdateCredential
      parameters: []
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/UpdateCredentialRequest'
              - examples:
                - externalCredential: test
                  authenticationProtocol: Custom
                  principalName: test
                  principalType: NamedPrincipal
                  credentials:
                    testCredential:
                      value: '000000'
                      encrypted: true
              contentMediaType: application/json
            example:
              externalCredential: test
              authenticationProtocol: Custom
              principalName: test
              principalType: NamedPrincipal
              credentials:
                testCredential:
                  value: '000000'
                  encrypted: true
        required: true
