components:
  schemas:
    CustomHeader:
      title: CustomHeader
      required:
      - headerName
      - headerValue
      - sequenceNumber
      type: object
      properties:
        headerName:
          type: string
          example: example_value
        headerValue:
          type: string
          example: example_value
        sequenceNumber:
          type: integer
          contentEncoding: int32
          example: 10
      examples:
      - headerName: SampleHeader
        headerValue: SampleHeaderValue
        sequenceNumber: 1
    TestCredential:
      title: TestCredential
      required:
      - value
      - encrypted
      type: object
      properties:
        value:
          type: string
          example: example_value
        encrypted:
          type: boolean
          example: true
      examples:
      - value: '000000'
        encrypted: true
    UpdateCredentialRequest:
      title: UpdateCredentialRequest
      required:
      - externalCredential
      - authenticationProtocol
      - principalName
      - principalType
      - credentials
      type: object
      properties:
        externalCredential:
          type: string
          example: example_value
        authenticationProtocol:
          type: string
          example: example_value
        principalName:
          type: string
          example: example_value
        principalType:
          type: string
          example: example_value
        credentials:
          $ref: '#/components/schemas/Credentials'
      examples:
      - externalCredential: test
        authenticationProtocol: Custom
        principalName: test
        principalType: NamedPrincipal
        credentials:
          testCredential:
            value: '000000'
            encrypted: true
    UpdateExternalCredentialRequest:
      title: UpdateExternalCredentialRequest
      required:
      - masterLabel
      - authenticationProtocol
      - principals
      - customHeaders
      type: object
      properties:
        masterLabel:
          type: string
          example: example_value
        authenticationProtocol:
          type: string
          example: example_value
        principals:
