          content:
            application/json;charset=UTF-8:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessfulFileShares'
                - examples:
                  - currentPageUrl: /services/data/v58.0/connect/files/069.../file-shares
                    linkShare: null
                    nextPageUrl: null
                    previousPageUrl: null
