        success: true
        errors:
        - statusCode: OPERATION_ENQUEUED
          message: 234995b6-53b6-4887-93fc-ecd0fac8b36c
          fields: []
    create:
      title: create
      required:
      - sObjects
      type: object
      properties:
        sObjects:
          type: array
          items:
            $ref: '#/components/schemas/sObjects'
          description: ''
          xml:
            namespace: urn:partner.soap.sforce.com
            prefix: ns2
            attribute: false
            wrapped: false
          example: []
