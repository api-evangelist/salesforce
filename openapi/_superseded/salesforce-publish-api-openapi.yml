          allOf:
          - $ref: '#/components/schemas/SessionHeader'
          - xml:
              name: SessionHeader
              namespace: urn:partner.soap.sforce.com
              prefix: ns2
              attribute: false
              wrapped: false
          example: example_value
      xml:
        name: Header
        namespace: http://schemas.xmlsoap.org/soap/envelope/
        prefix: SOAP-ENV
