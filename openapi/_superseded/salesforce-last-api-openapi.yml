  /data/v64.0/ui-api/apps/selected:
    parameters: []
    get:
      tags:
      - Last
      summary: Salesforce Get Last Selected App
      description: Retrieves the app the current user last selected or the app the user sees by default.
      operationId: GetLastSelectedApp
      parameters:
      - name: formFactor
        in: query
        description: The form factor for each app that the user has access to (`Large`, `Medium` or `Small`)
        required: true
        style: form
        explode: true
        schema:
          type: string
          examples:
          - Large
        example: example_value
      responses:
        '200':
          description: OK
          headers:
            Date:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: Fri, 06 Oct 2023 09:37:32 GMT
            Strict-Transport-Security:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: max-age=63072000; includeSubDomains
            X-Content-Type-Options:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: nosniff
            X-Robots-Tag:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: none
