          example: https://www.example.com
        updatesToken:
          type: string
          example: CAUQAA
        updatesUrl:
          type: string
          example: https://www.example.com
      examples:
      - currentPageToken: null
        currentPageUrl: /services/data/v58.0/chatter/feeds/news/005.../feed-elements
