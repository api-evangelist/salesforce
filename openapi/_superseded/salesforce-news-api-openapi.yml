openapi: 3.2.0
info:
  title: Salesforce Bulk API 2.0 Abort News API
  description: 'Salesforce Bulk API 2.0 is a simplified, REST-based interface for bulk data operations that improves on the original Bulk API. It uses a straightforward job model and supports CSV format for ingest and query jobs, enabling processing of millions of records asynchronously.

    '
  version: v63.0
  contact:
    name: Salesforce Developers
    url: https://developer.salesforce.com/
  license:
    name: Salesforce Developer Terms
    url: https://www.salesforce.com/company/legal/agreements/
servers:
- url: https://{instance}.salesforce.com/services/data/v{version}/jobs
  description: Salesforce Bulk API 2.0 jobs endpoint
  variables:
    instance:
      default: yourInstance
      description: 'The Salesforce instance identifier (e.g., na1, eu3, or a My Domain subdomain like mycompany).

        '
    version:
      default: '63.0'
      description: 'The Salesforce API version number (e.g., 63.0). Use the latest supported version for new integrations.

        '
security:
- BearerAuth: []
tags:
- name: News
paths:
  /data/v64.0/chatter/feeds/news/me/feed-elements:
    parameters: []
    get:
      tags:
      - News
      summary: Salesforce News Feed Elements
      description: 'All feed elements from all groups the context user either owns or is a member of, as well as all files, records, and users the context user follows. Use this resource to get information about feed elements and to post feed elements.


        For information about posting a feed element, see Feed Elements, Post and Search.


        https://developer.salesforce.com/docs/atlas.en-us.chatterapi.meta/chatterapi/connect_resource_feeds_news.htm#cc_news_feed_elements'
      operationId: NewsFeedElements
      parameters: []
      responses:
        '200':
          description: OK
          headers:
            Date:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: Wed, 22 Nov 2023 11:04:02 GMT
            Strict-Transport-Security:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: max-age=63072000; includeSubDomains
            X-Content-Type-Options:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: nosniff
            X-XSS-Protection:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: 1; mode=block
            X-Robots-Tag:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: none
            Cache-Control:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: no-cache,must-revalidate,max-age=0,no-store,private
            Vary:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: Accept-Encoding
            Content-Encoding:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: gzip
            Transfer-Encoding:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: chunked
          content:
            application/json;charset=UTF-8:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessfulNewsFeedElements'
                - examples:
                  - currentPageToken: null
                    currentPageUrl: /services/data/v58.0/chatter/feeds/news/005.../feed-elements
                    elements: []
                    isModifiedToken: null
                    isModifiedUrl: null
                    nextPageToken: null
                    nextPageUrl: null
                    updatesToken: 2:1700651042000
                    updatesUrl: /services/data/v58.0/chatter/feeds/news/005.../feed-elements?updatedSince=2%3A1700651042000
                contentMediaType: application/json;charset=UTF-8
              example:
                currentPageToken: null
                currentPageUrl: /services/data/v58.0/chatter/feeds/news/005.../feed-elements
                elements: []
                isModifiedToken: null
                isModifiedUrl: null
                nextPageToken: null
                nextPageUrl: null
                updatesToken: 2:1700651042000
                updatesUrl: /services/data/v58.0/chatter/feeds/news/005.../feed-elements?updatedSince=2%3A1700651042000
      deprecated: false
      servers:
      - url: https://services
        variables: {}
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
        ChooseTags: true
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
