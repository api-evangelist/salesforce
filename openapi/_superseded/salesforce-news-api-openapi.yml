        updatesToken: 2:1700651042000
        updatesUrl: /services/data/v58.0/chatter/feeds/news/005.../feed-elements?updatedSince=2%3A1700651042000
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'OAuth 2.0 Bearer token obtained from the Salesforce OAuth 2.0 token endpoint. Include this token in the Authorization header as "Bearer {access_token}".

        '
