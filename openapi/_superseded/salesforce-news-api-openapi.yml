      - currentPageUrl
      - elements
      - isModifiedToken
      - isModifiedUrl
      - nextPageToken
      - nextPageUrl
      - updatesToken
      - updatesUrl
      type: object
      properties:
        currentPageToken:
          type:
          - string
          - 'null'
          example: CAUQAA
        currentPageUrl:
          type: string
          example: https://www.example.com
        elements:
          type: array
          items:
            type: string
          description: ''
          example: []
        isModifiedToken:
          type:
          - string
          - 'null'
          example: CAUQAA
        isModifiedUrl:
          type:
          - string
          - 'null'
          example: https://www.example.com
        nextPageToken:
