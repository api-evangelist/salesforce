    patch:
      tags:
      - Applications
      summary: Salesforce Update Last Selected App
      description: Returns metadata for an app, and saves an app as the last selected for a user.
      operationId: UpdateLastSelectedApp
      parameters:
      - name: formFactor
        in: query
        description: The form factor for each app that the user has access to (`Large`, `Medium` or `Small`)
        required: true
        style: form
        explode: true
        schema:
          type: string
          examples:
          - Large
        example: example_value
      - name: APP_ID
        in: path
        description: Application ID
        required: true
        schema:
          type: string
        example: '500123'
      responses:
        '200':
          description: OK
          headers:
            Date:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: Fri, 06 Oct 2023 09:37:59 GMT
            Strict-Transport-Security:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: max-age=63072000; includeSubDomains
            X-Content-Type-Options:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: nosniff
            X-Robots-Tag:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: none
            Cache-Control:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: no-cache,must-revalidate,max-age=0,no-store,private
            ETag:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: '"e288a1d753c535d52fd11b047cd74482"'
            Transfer-Encoding:
