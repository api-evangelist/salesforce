                    contentMediaType: text/plain
                  example: chunked
          content:
            application/json;charset=UTF-8:
              schema:
                allOf:
                - $ref: '#/components/schemas/AbortaJobQuery'
                - examples:
                  - id: 750...
                    operation: query
                    object: Account
                    createdById: 005...
                    createdDate: <datetime>
                    systemModstamp: <datetime>
                    state: Aborted
                    concurrencyMode: Parallel
                    contentType: CSV
                    apiVersion: 58
