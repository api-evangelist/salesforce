openapi: 3.1.0
info:
  title: Salesforce Bulk API 2.0 Abort Layout API
  description: 'Salesforce Bulk API 2.0 is a simplified, REST-based interface for bulk data operations that improves on the original Bulk API. It uses a straightforward job model and supports CSV format for ingest and query jobs, enabling processing of millions of records asynchronously.

    '
  version: v63.0
  contact:
    name: Salesforce Developers
    url: https://developer.salesforce.com/
  license:
    name: Salesforce Developer Terms
    url: https://www.salesforce.com/company/legal/agreements/
servers:
- url: https://{instance}.salesforce.com/services/data/v{version}/jobs
  description: Salesforce Bulk API 2.0 jobs endpoint
  variables:
    instance:
      default: yourInstance
      description: 'The Salesforce instance identifier (e.g., na1, eu3, or a My Domain subdomain like mycompany).

        '
    version:
      default: '63.0'
      description: 'The Salesforce API version number (e.g., 63.0). Use the latest supported version for new integrations.

        '
security:
- BearerAuth: []
tags:
- name: Layout
paths:
  /data/v64.0/ui-api/layout/{SOBJECT_API_NAME}:
    parameters: []
    get:
      tags:
      - Layout
      summary: Salesforce Get Record Layout Metadata
      description: Get metadata about page layouts for the specified object type.
      operationId: GetRecordLayoutMetadata
      parameters:
      - name: SOBJECT_API_NAME
        in: path
        description: ''
        required: true
        schema:
          type: string
        example: example_value
      responses:
        '200':
          description: OK
          headers:
            Date:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: Wed, 27 Sep 2023 15:54:02 GMT
            Strict-Transport-Security:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: max-age=63072000; includeSubDomains
            X-Content-Type-Options:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: nosniff
            X-XSS-Protection:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: 1; mode=block
            X-Robots-Tag:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: none
            Cache-Control:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: no-cache,must-revalidate,max-age=0,no-store,private
            ETag:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: '"07ce091fdbe7461d6b2a8813c63d3124--gzip"'
            Vary:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: Accept-Encoding
            Content-Encoding:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: gzip
            Transfer-Encoding:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: chunked
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/GetRecordLayoutMetadata'
              examples:
                Getrecordlayoutmetadata200Example:
                  summary: Default GetRecordLayoutMetadata 200 response
                  x-microcks-default: true
                  value:
                    eTag: example_value
                    id: abc123
                    layoutType: example_value
                    mode: example_value
                    objectApiName: example_value
                    recordTypeId: '500123'
                    saveOptions:
                    - example_value
                    sections:
                    - collapsible: true
                      columns: 10
                      heading: example_value
                      id: abc123
                      layoutRows: {}
                      rows: 10
                      useHeading: true
      deprecated: false
      servers:
      - url: https://services
        variables: {}
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
        ChooseTags: true
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    LayoutRow1:
      title: LayoutRow1
      required:
      - layoutItems
      type: object
      properties:
        layoutItems:
          type: array
          items:
            $ref: '#/components/schemas/LayoutItem1'
          description: ''
          example: []
      examples:
      - layoutItems:
        - editableForNew: false
          editableForUpdate: false
          label: Account Owner
          layoutComponents:
          - apiName: OwnerId
            componentType: Field
            label: Owner ID
          lookupIdApiName: OwnerId
          required: false
          sortable: false
        - editableForNew: true
          editableForUpdate: true
          label: Rating
          layoutComponents:
          - apiName: Rating
            componentType: Field
            label: Account Rating
          lookupIdApiName: null
          required: false
          sortable: false
    LayoutItem1:
