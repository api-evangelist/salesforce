  /:
    get:
      operationId: listApiVersions
      summary: Salesforce List Available Api Versions
      description: 'Returns a list of all Salesforce REST API versions available on this instance. Each entry includes the version number, label, and URL. Use this to discover the latest supported version before building integrations.

        '
      tags:
      - Versions
      responses:
        '200':
          description: A list of available API versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiVersion'
              examples:
                Listapiversions200Example:
                  summary: Default listApiVersions 200 response
                  x-microcks-default: true
                  value:
                  - version: example_value
                    label: Example Title
                    url: https://www.example.com
        '401':
          description: Unauthorized. Invalid or expired OAuth token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Listapiversions401Example:
                  summary: Default listApiVersions 401 response
                  x-microcks-default: true
                  value:
                    message: example_value
                    errorCode: example_value
                    fields:
                    - example_value
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
