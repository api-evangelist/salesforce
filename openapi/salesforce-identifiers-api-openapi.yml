openapi: 3.2.0
info:
  title: Salesforce Identifiers API
  description: 'Find the resources you need to start building. '
  contact: {}
  version: '1.0'
servers:
- url: https://login.salesforce.com
  variables: {}
- url: https://id
  variables: {}
- url: https://services
  variables: {}
- url: '{{url}}{{site}}/services/oauth2'
  variables:
    url:
      default: DefaultParameterValue
    site:
      default: DefaultParameterValue
security:
- oauth2:
  - api
tags:
- name: Identifiers
paths:
  //:
    parameters: []
    get:
      tags:
      - Identifiers
      summary: Salesforce Id Token
      operationId: IDToken
      parameters:
      - name: Content-Type
        in: header
        description: ''
        required: true
        schema:
          const: application/json
          type: string
          examples:
          - application/json
        example: example_value
      responses:
        '200':
          description: OK
          headers:
            Date:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: Thu, 16 Nov 2023 15:56:09 GMT
            Strict-Transport-Security:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: max-age=63072000; includeSubDomains
            X-Content-Type-Options:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: nosniff
            X-XSS-Protection:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: 1; mode=block
            X-Robots-Tag:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: none
            Cache-Control:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: no-cache,must-revalidate,max-age=0,no-store,private
            Vary:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: Accept-Encoding
            Content-Encoding:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: gzip
            Transfer-Encoding:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: chunked
          content:
            application/json;charset=UTF-8:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessfulIDToken'
                - examples:
                  - id: https://login.salesforce.com/id/00D.../005...
                    asserted_user: true
                    user_id: 005...
                    organization_id: 00D...
                    username: <username>
                    nick_name: <nickname>
                    display_name: <display_name>
                    email: <email>
                    email_verified: true
                    first_name: <firstname>
                    last_name: <lastname>
                    timezone: Europe/Paris
                    photos:
                      picture: https://<my_domain>/profilephoto/005/F
                      thumbnail: https://<my_domain>/profilephoto/005/T
                    addr_street: null
                    addr_city: null
                    addr_state: null
                    addr_country: FR
                    addr_zip: null
                    mobile_phone: null
                    mobile_phone_verified: false
                    is_lightning_login_user: false
                    status:
                      created_date: null
                      body: null
                    urls:
                      enterprise: https://<my_domain>/services/Soap/c/{version}/00D...
                      metadata: https://<my_domain>/services/Soap/m/{version}/00D...
                      partner: https://<my_domain>/services/Soap/u/{version}/00D...
                      rest: https://<my_domain>/services/data/v{version}/
                      sobjects: https://<my_domain>/services/data/v{version}/sobjects/
                      search: https://<my_domain>/services/data/v{version}/search/
                      query: https://<my_domain>/services/data/v{version}/query/
                      recent: https://<my_domain>/services/data/v{version}/recent/
                      tooling_soap: https://<my_domain>/services/Soap/T/{version}/00D...
                      tooling_rest: https://<my_domain>/services/data/v{version}/tooling/
                      profile: https://<my_domain>/0052o00000DOJ1PAAX
                      feeds: https://<my_domain>/services/data/v{version}/chatter/feeds
                      groups: https://<my_domain>/services/data/v{version}/chatter/groups
                      users: https://<my_domain>/services/data/v{version}/chatter/users
                      feed_items: https://<my_domain>/services/data/v{version}/chatter/feed-items
                      feed_elements: https://<my_domain>/services/data/v{version}/chatter/feed-elements
                      custom_domain: https://<my_domain>
                    active: true
                    user_type: STANDARD
                    language: en_US
                    locale: fr_FR_EURO
                    utcOffset: 3600000
                    last_modified_date: <date_time>
                    is_app_installed: true
                contentMediaType: application/json;charset=UTF-8
              example:
                id: https://login.salesforce.com/id/00D.../005...
                asserted_user: true
                user_id: 005...
                organization_id: 00D...
                username: <username>
                nick_name: <nickname>
                display_name: <display_name>
                email: <email>
                email_verified: true
                first_name: <firstname>
                last_name: <lastname>
                timezone: Europe/Paris
                photos:
                  picture: https://<my_domain>/profilephoto/005/F
                  thumbnail: https://<my_domain>/profilephoto/005/T
                addr_street: null
                addr_city: null
                addr_state: null
                addr_country: FR
                addr_zip: null
                mobile_phone: null
                mobile_phone_verified: false
                is_lightning_login_user: false
                status:
                  created_date: null
                  body: null
                urls:
                  enterprise: https://<my_domain>/services/Soap/c/{version}/00D...
                  metadata: https://<my_domain>/services/Soap/m/{version}/00D...
                  partner: https://<my_domain>/services/Soap/u/{version}/00D...
                  rest: https://<my_domain>/services/data/v{version}/
                  sobjects: https://<my_domain>/services/data/v{version}/sobjects/
                  search: https://<my_domain>/services/data/v{version}/search/
                  query: https://<my_domain>/services/data/v{version}/query/
                  recent: https://<my_domain>/services/data/v{version}/recent/
                  tooling_soap: https://<my_domain>/services/Soap/T/{version}/00D...
                  tooling_rest: https://<my_domain>/services/data/v{version}/tooling/
                  profile: https://<my_domain>/0052o00000DOJ1PAAX
                  feeds: https://<my_domain>/services/data/v{version}/chatter/feeds
                  groups: https://<my_domain>/services/data/v{version}/chatter/groups
                  users: https://<my_domain>/services/data/v{version}/chatter/users
                  feed_items: https://<my_domain>/services/data/v{version}/chatter/feed-items
                  feed_elements: https://<my_domain>/services/data/v{version}/chatter/feed-elements
                  custom_domain: https://<my_domain>
                active: true
                user_type: STANDARD
                language: en_US
                locale: fr_FR_EURO
                utcOffset: 3600000
                last_modified_date: <date_time>
                is_app_installed: true
      deprecated: false
      servers:
      - url: https://id
        variables: {}
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
        ChooseTags: true
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
