  /search:
    get:
      operationId: executeSearch
      summary: Salesforce Execute a Sosl Search
      description: 'Executes a SOSL (Salesforce Object Search Language) search query across multiple objects simultaneously. The SOSL query is passed as a query parameter. Returns matching records from all specified objects, supporting full-text search capabilities.

        '
      tags:
      - Search
      parameters:
      - name: q
        in: query
        required: true
        description: 'The SOSL search string to execute. Must include a FIND clause and optionally IN, RETURNING, and WITH clauses.

          '
        schema:
          type: string
        example: FIND {Jane Smith} IN ALL FIELDS RETURNING Contact(Id, Name, Email), Account(Id, Name)
      responses:
        '200':
          description: Search results grouped by object type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
              examples:
                Executesearch200Example:
                  summary: Default executeSearch 200 response
                  x-microcks-default: true
                  value:
                    searchRecords:
                    - attributes: {}
                      Id: abc123
        '400':
          description: Bad request. Invalid SOSL syntax or search validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Executesearch400Example:
                  summary: Default executeSearch 400 response
                  x-microcks-default: true
                  value:
                    message: example_value
                    errorCode: example_value
                    fields:
                    - example_value
        '401':
          description: Unauthorized. Invalid or expired OAuth token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Executesearch401Example:
                  summary: Default executeSearch 401 response
                  x-microcks-default: true
                  value:
                    message: example_value
                    errorCode: example_value
                    fields:
                    - example_value
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
