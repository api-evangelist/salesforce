        Current_Vehicle__c:
          type: string
          xml:
            name: Current_Vehicle__c
            namespace: ''
            attribute: false
            wrapped: false
          example: example_value
        Model_Year__c:
          type: integer
          contentEncoding: int32
          xml:
            name: Model_Year__c
            namespace: ''
            attribute: false
            wrapped: false
          example: 10
      xml:
        name: sObjects
        namespace: urn:partner.soap.sforce.com
        prefix: ns2
        attribute: false
        wrapped: false
    create:
      title: create
      required:
      - sObjects
      type: object
      properties:
        sObjects:
