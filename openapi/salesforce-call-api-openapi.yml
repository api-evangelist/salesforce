      properties:
        type:
          type: string
          xml:
            name: type
            namespace: urn:sobject.partner.soap.sforce.com
            prefix: ns1
            attribute: false
            wrapped: false
          example: example_value
        Annual_Mileage__c:
          type: integer
          contentEncoding: int32
          xml:
            name: Annual_Mileage__c
            namespace: ''
            attribute: false
            wrapped: false
