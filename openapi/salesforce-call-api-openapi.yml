          description: ''
          xml:
            namespace: urn:partner.soap.sforce.com
            prefix: ns2
            attribute: false
            wrapped: false
          example: []
      xml:
        name: create
        namespace: urn:partner.soap.sforce.com
        prefix: ns2
        attribute: false
        wrapped: false
