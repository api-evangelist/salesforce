            namespace: urn:partner.soap.sforce.com
            prefix: ns2
            attribute: false
            wrapped: false
          example: '500123'
      xml:
        name: SessionHeader
        namespace: urn:partner.soap.sforce.com
        prefix: ns2
        attribute: false
        wrapped: false
    Envelope:
      title: Envelope
      required:
      - Header
      - Body
      type: object
      properties:
        Header:
          allOf:
          - $ref: '#/components/schemas/Header4'
