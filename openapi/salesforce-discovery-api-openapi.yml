openapi: 3.1.0
info:
  title: Salesforce Bulk API 2.0 Abort Discovery API
  description: 'Salesforce Bulk API 2.0 is a simplified, REST-based interface for bulk data operations that improves on the original Bulk API. It uses a straightforward job model and supports CSV format for ingest and query jobs, enabling processing of millions of records asynchronously.

    '
  version: v63.0
  contact:
    name: Salesforce Developers
    url: https://developer.salesforce.com/
  license:
    name: Salesforce Developer Terms
    url: https://www.salesforce.com/company/legal/agreements/
servers:
- url: https://{instance}.salesforce.com/services/data/v{version}/jobs
  description: Salesforce Bulk API 2.0 jobs endpoint
  variables:
    instance:
      default: yourInstance
      description: 'The Salesforce instance identifier (e.g., na1, eu3, or a My Domain subdomain like mycompany).

        '
    version:
      default: '63.0'
      description: 'The Salesforce API version number (e.g., 63.0). Use the latest supported version for new integrations.

        '
security:
- BearerAuth: []
tags:
- name: Discovery
paths:
  /.well-known/openid-configuration:
    parameters: []
    get:
      tags:
      - Discovery
      summary: Salesforce Openid Connect Discovery Endpoint
      operationId: OpenIDConnectDiscoveryEndpoint
      parameters: []
      responses:
        '200':
          description: OK
          headers:
            Date:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: Thu, 16 Nov 2023 15:53:35 GMT
            Strict-Transport-Security:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: max-age=63072000; includeSubDomains
            X-Content-Type-Options:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: nosniff
            X-XSS-Protection:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: 1; mode=block
            X-Robots-Tag:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: none
            Cache-Control:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: no-cache,must-revalidate,max-age=0,no-store,private
            Access-Control-Allow-Credentials:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: 'false'
            Access-Control-Allow-Origin:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: '*'
            Vary:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: Accept-Encoding
            Content-Encoding:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: gzip
            Transfer-Encoding:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: chunked
          content:
            application/json;charset=UTF-8:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessfulOpenIDConnectDiscoveryEndpoint'
                - examples:
                  - end_session_endpoint: https://<my_domain>/services/auth/idp/oidc/logout
                    frontchannel_logout_supported: true
                    frontchannel_logout_session_supported: false
                    issuer: https://<my_domain>
                    authorization_endpoint: https://<my_domain>/services/oauth2/authorize
                    token_endpoint: https://<my_domain>/services/oauth2/token
                    revocation_endpoint: https://<my_domain>/services/oauth2/revoke
                    userinfo_endpoint: https://<my_domain>/services/oauth2/userinfo
                    jwks_uri: https://<my_domain>/id/keys
                    registration_endpoint: https://<my_domain>/services/oauth2/register
                    introspection_endpoint: https://<my_domain>/services/oauth2/introspect
                    scopes_supported:
                    - cdp_ingest_api
                    - custom_permissions
                    - cdp_segment_api
                    - content
                    - cdp_api
                    - chatbot_api
                    - cdp_identityresolution_api
                    - interaction_api
                    - wave_api
                    - web
                    - cdp_calculated_insight_api
                    - einstein_gpt_api
                    - offline_access
                    - id
                    - api
                    - eclair_api
                    - email
                    - pardot_api
                    - lightning
                    - visualforce
                    - cdp_query_api
                    - sfap_api
                    - address
                    - openid
                    - profile
                    - cdp_profile_api
                    - refresh_token
                    - phone
                    - user_registration_api
                    - pwdless_login_api
                    - chatter_api
                    - full
                    - forgot_password
                    response_types_supported:
                    - code
                    - token
                    - token id_token
                    subject_types_supported:
                    - public
                    id_token_signing_alg_values_supported:
                    - RS256
                    display_values_supported:
                    - page
                    - popup
                    - touch
                    token_endpoint_auth_methods_supported:
                    - client_secret_post
                    - client_secret_basic
                    - private_key_jwt
                    claims_supported:
                    - active
                    - address
                    - email
                    - email_verified
                    - family_name
                    - given_name
                    - is_app_installed
                    - language
                    - locale
                    - name
                    - nickname
                    - organization_id
                    - phone_number
                    - phone_number_verified
                    - photos
                    - picture
                    - preferred_username
                    - profile
                    - sub
                    - updated_at
                    - urls
                    - user_id
                    - user_type
                    - zoneinfo
                contentMediaType: application/json;charset=UTF-8
              example:
                end_session_endpoint: https://<my_domain>/services/auth/idp/oidc/logout
                frontchannel_logout_supported: true
                frontchannel_logout_session_supported: false
                issuer: https://<my_domain>
                authorization_endpoint: https://<my_domain>/services/oauth2/authorize
                token_endpoint: https://<my_domain>/services/oauth2/token
                revocation_endpoint: https://<my_domain>/services/oauth2/revoke
                userinfo_endpoint: https://<my_domain>/services/oauth2/userinfo
                jwks_uri: https://<my_domain>/id/keys
                registration_endpoint: https://<my_domain>/services/oauth2/register
                introspection_endpoint: https://<my_domain>/services/oauth2/introspect
                scopes_supported:
                - cdp_ingest_api
                - custom_permissions
                - cdp_segment_api
                - content
                - cdp_api
                - chatbot_api
                - cdp_identityresolution_api
                - interaction_api
                - wave_api
                - web
                - cdp_calculated_insight_api
                - einstein_gpt_api
                - offline_access
                - id
                - api
                - eclair_api
                - email
                - pardot_api
                - lightning
                - visualforce
                - cdp_query_api
                - sfap_api
                - address
                - openid
                - profile
                - cdp_profile_api
                - refresh_token
                - phone
                - user_registration_api
                - pwdless_login_api
                - chatter_api
                - full
                - forgot_password
                response_types_supported:
                - code
                - token
                - token id_token
                subject_types_supported:
                - public
                id_token_signing_alg_values_supported:
                - RS256
                display_values_supported:
                - page
                - popup
                - touch
                token_endpoint_auth_methods_supported:
                - client_secret_post
                - client_secret_basic
                - private_key_jwt
                claims_supported:
                - active
                - address
                - email
                - email_verified
                - family_name
                - given_name
                - is_app_installed
                - language
                - locale
                - name
                - nickname
                - organization_id
                - phone_number
                - phone_number_verified
                - photos
                - picture
                - preferred_username
                - profile
                - sub
                - updated_at
                - urls
                - user_id
                - user_type
                - zoneinfo
      deprecated: false
      security: []
      servers:
      - url: https://login.salesforce.com
        variables: {}
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
        ChooseTags: true
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
