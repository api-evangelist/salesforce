components:
  schemas:
    Color:
      title: Color
      required:
      - color
      - context
      - theme
      type: object
      properties:
        color:
          type: string
          example: example_value
        context:
          type: string
          example: example_value
        theme:
          type: string
          example: example_value
      examples:
      - color: 5867E8
        context: primary
        theme: theme4
    Tab:
      title: Tab
      required:
      - colors
      - custom
      - iconUrl
      - icons
      - label
      - miniIconUrl
      - name
      - sobjectName
      - url
      type: object
      properties:
        colors:
          type: array
          items:
            $ref: '#/components/schemas/Color'
          description: ''
          example: []
        custom:
          type: boolean
          example: true
        iconUrl:
          type: string
          example: https://www.example.com
        icons:
          type: array
          items:
            $ref: '#/components/schemas/Icon'
          description: ''
          example: []
        label:
          type: string
          example: Example Title
        miniIconUrl:
          type: string
          example: https://www.example.com
        name:
          type: string
          example: Example Title
        sobjectName:
          type: string
          example: example_value
        url:
          type: string
          example: https://www.example.com
      examples:
      - colors:
        - color: 5867E8
          context: primary
          theme: theme4
        - color: 236FBD
          context: primary
          theme: theme3
        custom: false
        iconUrl: https://nto-df17-demo-dev-ed.my.salesforce.com/img/icon/accounts32.png
        icons:
        - contentType: image/png
          height: 32
          theme: theme3
          url: https://nto-df17-demo-dev-ed.my.salesforce.com/img/icon/accounts32.png
          width: 32
        - contentType: image/png
          height: 16
          theme: theme3
          url: https://nto-df17-demo-dev-ed.my.salesforce.com/img/icon/accounts16.png
          width: 16
        - contentType: image/svg+xml
          height: 0
          theme: theme4
          url: https://nto-df17-demo-dev-ed.my.salesforce.com/img/icon/t4v35/standard/account.svg
          width: 0
        - contentType: image/png
          height: 60
          theme: theme4
          url: https://nto-df17-demo-dev-ed.my.salesforce.com/img/icon/t4v35/standard/account_60.png
          width: 60
        - contentType: image/png
          height: 120
          theme: theme4
          url: https://nto-df17-demo-dev-ed.my.salesforce.com/img/icon/t4v35/standard/account_120.png
          width: 120
        label: Accounts
        miniIconUrl: https://nto-df17-demo-dev-ed.my.salesforce.com/img/icon/accounts16.png
        name: standard-Account
        sobjectName: Account
        url: https://nto-df17-demo-dev-ed.my.salesforce.com/001/o
    Icon:
      title: Icon
      required:
      - contentType
      - height
      - theme
      - url
      - width
      type: object
      properties:
        contentType:
          type: string
          example: example_value
        height:
          type: integer
          contentEncoding: int32
          example: 10
        theme:
          type: string
          example: example_value
        url:
          type: string
          example: https://www.example.com
        width:
          type: integer
          contentEncoding: int32
          example: 10
      examples:
      - contentType: image/png
        height: 32
        theme: theme3
        url: https://nto-df17-demo-dev-ed.my.salesforce.com/img/icon/accounts32.png
        width: 32
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: '{DefaultParameterValue}{DefaultParameterValue}/services/oauth2/authorize'
          scopes:
            api: ''
