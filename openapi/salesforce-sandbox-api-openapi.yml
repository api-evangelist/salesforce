              - examples:
                - SandboxName: devSandbox
                  LicenseType: DEVELOPER
                  TemplateId: null
                  HistoryDays: 0
                  CopyChatter: false
                  AutoActivate: false
                  ApexClassId: null
                  Description: My new fresh sandbox
                  SourceId: null
              contentMediaType: application/json
            example:
              SandboxName: devSandbox
              LicenseType: DEVELOPER
              TemplateId: null
              HistoryDays: 0
              CopyChatter: false
              AutoActivate: false
              ApexClassId: null
              Description: My new fresh sandbox
              SourceId: null
