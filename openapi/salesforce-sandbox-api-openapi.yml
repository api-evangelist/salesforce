                    type: string
                    contentMediaType: text/plain
                  example: chunked
          content:
            application/json;charset=UTF-8:
              schema:
                allOf:
                - $ref: '#/components/schemas/CreateSandbox'
                - examples:
                  - id: 0GQ4H000000CxSzWAK
                    success: true
                    errors: []
                    warnings: []
                    infos: []
