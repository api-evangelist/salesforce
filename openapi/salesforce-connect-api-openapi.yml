        variables: {}
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
        ChooseTags: true
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /services/oauth2/introspect:
    parameters: []
    post:
      tags:
      - Connect
      summary: Salesforce Openid Connect Token Introspection Endpoint
      operationId: OpenIDConnectTokenIntrospectionEndpoint
      parameters:
      - name: Content-Type
        in: header
        description: ''
        required: true
        schema:
          const: application/x-www-form-urlencoded
          type: string
          examples:
          - application/x-www-form-urlencoded
        example: example_value
      - name: Accept
        in: header
        description: ''
        required: true
        schema:
          type: string
          examples:
          - application/json
        example: example_value
      requestBody:
        content:
          application/x-www-form-urlencoded:
            encoding: {}
            schema:
              required:
              - token
              - token_type_hint
              - client_id
              - client_secret
              type: object
              properties:
                token:
                  type: string
                token_type_hint:
                  type: string
                  examples:
                  - access_token
                client_id:
                  type: string
                  examples:
                  - '{{vault:salesforce-consumer-key}}'
                client_secret:
                  type: string
              contentMediaType: application/x-www-form-urlencoded
            examples:
              OpenidconnecttokenintrospectionendpointRequestExample:
                summary: Default OpenIDConnectTokenIntrospectionEndpoint request
                x-microcks-default: true
                value:
                  token: CAUQAA
                  token_type_hint: CAUQAA
                  client_id: '500123'
                  client_secret: example_value
        required: false
      responses:
        '200':
          description: OK
          headers:
            Date:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: Thu, 16 Nov 2023 15:54:42 GMT
            Strict-Transport-Security:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
