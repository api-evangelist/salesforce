                - lightning
                - visualforce
                - cdp_query_api
                - sfap_api
                - address
                - openid
                - profile
                - cdp_profile_api
                - refresh_token
                - phone
                - user_registration_api
                - pwdless_login_api
                - chatter_api
                - full
