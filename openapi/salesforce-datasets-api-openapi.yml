openapi: 3.2.0
info:
  title: Salesforce Analytics (CRM Analytics) REST Datasets API
  description: REST API for accessing and managing CRM Analytics (formerly Tableau CRM / Einstein Analytics) resources including datasets, lenses, dashboards, and dataflows. Enables programmatic access to analytics metadata, query execution, and dashboard management. Uses the Wave API resource at /services/data/vXX.0/wave.
  version: '63.0'
  contact:
    name: Salesforce Developer Support
    url: https://developer.salesforce.com/support
    email: developer@salesforce.com
  license:
    name: Salesforce API Terms of Use
    url: https://www.salesforce.com/company/legal/agreements/
servers:
- url: https://{instance}.salesforce.com/services/data/v63.0/wave
  description: Salesforce production or developer instance
  variables:
    instance:
      default: yourInstance
      description: Your Salesforce instance identifier
security:
- oauth2: []
- bearerAuth: []
tags:
- name: Datasets
  description: CRM Analytics datasets
paths:
  /datasets:
    get:
      operationId: getDatasets
      summary: List datasets
      description: Returns a paginated list of CRM Analytics datasets accessible to the current user. Supports filtering by folder, search term, and sort order.
      tags:
      - Datasets
      parameters:
      - name: q
        in: query
        description: Search term to filter datasets by name
        schema:
          type: string
      - name: folderId
        in: query
        description: Filter datasets by analytics app (folder) ID
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: string
      - name: pageSize
        in: query
        schema:
          type: integer
          default: 25
          maximum: 200
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - Name
          - CreatedDate
          - LastModifiedDate
          - Mru
      - name: order
        in: query
        schema:
          type: string
          enum:
          - Ascending
          - Descending
      responses:
        '200':
          description: List of datasets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetList'
  /datasets/{datasetIdOrApiName}:
    get:
      operationId: getDataset
      summary: Get a dataset
      description: Returns metadata for a specific CRM Analytics dataset.
      tags:
      - Datasets
      parameters:
      - name: datasetIdOrApiName
        in: path
        required: true
        description: The dataset ID or developer name
        schema:
          type: string
      responses:
        '200':
          description: Dataset metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
components:
  schemas:
    FolderRef:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        name:
          type: string
        url:
          type: string
    Dataset:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: The developer name
        label:
          type: string
          description: The display label
        description:
          type:
          - string
          - 'null'
        createdDate:
          type: string
          format: date-time
        lastModifiedDate:
          type: string
          format: date-time
        datasetType:
          type: string
          description: The type of dataset (default, live, trended)
        currentVersionId:
          type: string
        folder:
          $ref: '#/components/schemas/FolderRef'
        url:
          type: string
    DatasetList:
      type: object
      properties:
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/Dataset'
        nextPageUrl:
          type:
          - string
          - 'null'
        totalSize:
          type: integer
        url:
          type: string
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.salesforce.com/services/oauth2/authorize
          tokenUrl: https://login.salesforce.com/services/oauth2/token
          scopes:
            api: Access and manage your Salesforce data
            wave_api: Access CRM Analytics REST API resources
    bearerAuth:
      type: http
      scheme: bearer
