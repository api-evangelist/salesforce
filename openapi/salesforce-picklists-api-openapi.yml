openapi: 3.2.0
info:
  title: Salesforce UI Picklists API
  description: The Salesforce UI API provides a comprehensive REST interface for building user interfaces that work with Salesforce metadata and data. It returns layout information, picklist values, list views, record data, and object metadata that Lightning components rely on. Unlike the general REST API, the UI API returns UI-ready data including display labels, field types, formatting hints, and page layout assignments.
  version: '59.0'
  contact:
    name: Salesforce Developer Support
    url: https://developer.salesforce.com/docs/atlas.en-us.uiapi.meta/uiapi/
  termsOfService: https://www.salesforce.com/company/legal/agreements/
servers:
- url: https://{instanceName}.salesforce.com/services/data/v{version}/ui-api
  description: Salesforce org UI API base
  variables:
    instanceName:
      description: Salesforce org instance name or custom domain
      default: myorg
    version:
      description: Salesforce API version
      default: '59.0'
security:
- oauthBearerToken: []
tags:
- name: Picklists
  description: Dependent and independent picklist value endpoints
paths:
  /object-info/{objectApiName}/picklist-values/{recordTypeId}:
    get:
      operationId: getPicklistValues
      summary: Salesforce Get Picklist Values for a Record Type
      description: Returns picklist values for all picklist fields on an object for a given record type. Values include labels, valid values, and dependencies between picklist fields.
      tags:
      - Picklists
      parameters:
      - $ref: '#/components/parameters/ObjectApiName'
      - name: recordTypeId
        in: path
        required: true
        description: The record type ID or the string '012000000000000AAA' for the master record type
        schema:
          type: string
        example: '500123'
      responses:
        '200':
          description: Picklist values retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PicklistValuesCollection'
              examples:
                Getpicklistvalues200Example:
                  summary: Default getPicklistValues 200 response
                  x-microcks-default: true
                  value:
                    picklistFieldValues: example_value
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    PicklistValuesCollection:
      type: object
      description: Collection of picklist values for all picklist fields on an object
      properties:
        picklistFieldValues:
          type: object
          additionalProperties:
            type: object
            properties:
              controllerValues:
                type: object
                additionalProperties:
                  type: integer
              defaultValue:
                nullable: true
              url:
                type: string
              values:
                type: array
                items:
                  $ref: '#/components/schemas/PicklistValue'
          example: example_value
    ErrorResponse:
      type: object
      description: API error response
      properties:
        errorCode:
          type: string
          description: Machine-readable error code
          example: example_value
        message:
          type: string
          description: Human-readable error message
          example: example_value
    PicklistValue:
      type: object
      description: A single picklist option
      properties:
        attributes:
          nullable: true
          example: example_value
        label:
          type: string
          example: Example Title
        validFor:
          type: array
          items:
            type: integer
          example: []
        value:
          type: string
          example: example_value
  responses:
    NotFound:
      description: Not found. The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    ObjectApiName:
      name: objectApiName
      in: path
      required: true
      description: The API name of the Salesforce object (e.g., Account, Contact, MyObject__c)
      schema:
        type: string
  securitySchemes:
    oauthBearerToken:
      type: http
      scheme: bearer
      description: Salesforce OAuth 2.0 Bearer Token
externalDocs:
  description: Salesforce UI API Documentation
  url: https://developer.salesforce.com/docs/atlas.en-us.uiapi.meta/uiapi/
