openapi: 3.1.0
info:
  title: Salesforce Bulk API 2.0 Abort History API
  description: 'Salesforce Bulk API 2.0 is a simplified, REST-based interface for bulk data operations that improves on the original Bulk API. It uses a straightforward job model and supports CSV format for ingest and query jobs, enabling processing of millions of records asynchronously.

    '
  version: v63.0
  contact:
    name: Salesforce Developers
    url: https://developer.salesforce.com/
  license:
    name: Salesforce Developer Terms
    url: https://www.salesforce.com/company/legal/agreements/
servers:
- url: https://{instance}.salesforce.com/services/data/v{version}/jobs
  description: Salesforce Bulk API 2.0 jobs endpoint
  variables:
    instance:
      default: yourInstance
      description: 'The Salesforce instance identifier (e.g., na1, eu3, or a My Domain subdomain like mycompany).

        '
    version:
      default: '63.0'
      description: 'The Salesforce API version number (e.g., 63.0). Use the latest supported version for new integrations.

        '
security:
- BearerAuth: []
tags:
- name: History
paths:
  /data/v64.0/connect/loyalty/programs/{loyaltyProgramName}/transaction-history:
    parameters: []
    post:
      tags:
      - History
      summary: Salesforce Transaction History
      description: 'Standard Documentation:


        [https://developer.salesforce.com/docs/atlas.en-us.loyalty.meta/loyalty/connect_resources_transaction_history.htm](https://developer.salesforce.com/docs/atlas.en-us.loyalty.meta/loyalty/connect_resources_transaction_history.htm)'
      operationId: TransactionHistory
      parameters:
      - name: page
        in: query
        description: ''
        required: true
        style: form
        explode: true
        schema:
          type: string
        example: example_value
      - name: loyaltyProgramName
        in: path
        description: ''
        required: true
        schema:
          type: string
        example: example_value
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TransactionHistoryRequest'
              - examples:
                - membershipNumber: Member1
                  journalType: Accrual
                  journalSubType: Social
                  periodStartDate: '2022-01-27T00:00:00.000Z'
                  periodEndDate: '2022-11-27T00:00:00.000Z'
              contentMediaType: application/json
            example:
              membershipNumber: Member1
              journalType: Accrual
              journalSubType: Social
              periodStartDate: '2022-01-27T00:00:00.000Z'
              periodEndDate: '2022-11-27T00:00:00.000Z'
        required: true
      responses:
        '201':
          description: Created
          headers:
            Date:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: Wed, 22 May 2024 16:22:05 GMT
            Strict-Transport-Security:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: max-age=63072000; includeSubDomains
            X-Content-Type-Options:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: nosniff
            X-Robots-Tag:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: none
            Cache-Control:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: no-cache,must-revalidate,max-age=0,no-store,private
            Vary:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: Accept-Encoding
            Content-Encoding:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: gzip
            Transfer-Encoding:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: chunked
          content:
            application/json;charset=UTF-8:
              schema:
                allOf:
                - $ref: '#/components/schemas/TransactionHistory'
                - examples:
                  - message: null
                    status: true
                    totalCount: 0
                    transactionJournals: []
                contentMediaType: application/json;charset=UTF-8
              example:
                message: null
                status: true
                totalCount: 0
                transactionJournals: []
      deprecated: false
      servers:
      - url: https://services
        variables: {}
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
        ChooseTags: true
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    TransactionHistory:
      title: TransactionHistory
      required:
      - message
      - status
      - totalCount
      - transactionJournals
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
          example: example_value
        status:
          type: boolean
          example: true
        totalCount:
          type: integer
          contentEncoding: int32
          example: 42
        transactionJournals:
          type: array
          items:
            type: string
          description: ''
          example: []
      examples:
      - message: null
        status: true
        totalCount: 0
        transactionJournals: []
    TransactionHistoryRequest:
      title: TransactionHistoryRequest
      required:
      - membershipNumber
      - journalType
      - journalSubType
      - periodStartDate
      - periodEndDate
      type: object
      properties:
        membershipNumber:
          type: string
          example: example_value
        journalType:
          type: string
          example: example_value
        journalSubType:
          type: string
          example: example_value
        periodStartDate:
          type: string
          example: example_value
        periodEndDate:
          type: string
          example: example_value
      examples:
      - membershipNumber: Member1
        journalType: Accrual
        journalSubType: Social
        periodStartDate: '2022-01-27T00:00:00.000Z'
        periodEndDate: '2022-11-27T00:00:00.000Z'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'OAuth 2.0 Bearer token obtained from the Salesforce OAuth 2.0 token endpoint. Include this token in the Authorization header as "Bearer {access_token}".

        '
