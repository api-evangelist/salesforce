      operationId: SObjectCollectionsUpdate
      parameters: []
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/SObjectCollectionsUpdateRequest'
              - examples:
                - allOrNone: false
                  records:
                  - attributes:
                      type: Account
                    id: <account-id>
                    NumberOfEmployees: 27000
              contentMediaType: application/json
            example:
              allOrNone: false
              records:
              - attributes:
