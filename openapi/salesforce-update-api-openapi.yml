        campaign:
          id: <CAMPAIGN_ID>
        outreachSourceCode:
          id: <SOURCE_CODE_ID>
          sourceCode: AnimalEmailCampaign2023
        donor:
          donorType: individual
          organizationName: mini cat town
          firstName: David
          lastName: Taylor
          phone: 510-434-8920
          email: davidtaylor@salesforce.com
          address:
          - addressType: mailing
            street: 123 Main Street
            city: Oakland
            state: CA
            postalCode: '94610'
            country: US
          accountCustomFields:
          - fieldName: string
