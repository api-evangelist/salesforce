components:
  schemas:
    ChangeeventrelaystateRequest:
      title: ChangeeventrelaystateRequest
      required:
      - Metadata
      type: object
      properties:
        Metadata:
          $ref: '#/components/schemas/Metadata13'
      examples:
      - Metadata:
          state: RUN
    Metadata13:
      title: Metadata13
      required:
      - state
      type: object
      properties:
        state:
          type: string
          example: example_value
      examples:
      - state: RUN
    CreateeventrelayRequest:
      title: CreateeventrelayRequest
      required:
      - FullName
      - Metadata
      type: object
      properties:
        FullName:
          type: string
          example: example_value
        Metadata:
          $ref: '#/components/schemas/Metadata12'
      examples:
      - FullName: MyEventRelay
        Metadata:
          eventChannel: Carbon_Comparison_Channel__chn
          destinationResourceName: callout:MyNamedCredential
          label: My Event Relay
          relayOption: '{"ReplayRecovery":"LATEST"}'
    Metadata12:
      title: Metadata12
      required:
      - eventChannel
      - destinationResourceName
      - label
      - relayOption
      type: object
      properties:
        eventChannel:
          type: string
          example: example_value
        destinationResourceName:
          type: string
          example: example_value
        label:
          type: string
          example: Example Title
        relayOption:
          type: string
          example: example_value
      examples:
      - eventChannel: Carbon_Comparison_Channel__chn
        destinationResourceName: callout:MyNamedCredential
        label: My Event Relay
        relayOption: '{"ReplayRecovery":"LATEST"}'
  securitySchemes:
