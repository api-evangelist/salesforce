openapi: 3.1.0
info:
  title: Salesforce Bulk API 2.0 Abort Undelete API
  description: 'Salesforce Bulk API 2.0 is a simplified, REST-based interface for bulk data operations that improves on the original Bulk API. It uses a straightforward job model and supports CSV format for ingest and query jobs, enabling processing of millions of records asynchronously.

    '
  version: v63.0
  contact:
    name: Salesforce Developers
    url: https://developer.salesforce.com/
  license:
    name: Salesforce Developer Terms
    url: https://www.salesforce.com/company/legal/agreements/
servers:
- url: https://{instance}.salesforce.com/services/data/v{version}/jobs
  description: Salesforce Bulk API 2.0 jobs endpoint
  variables:
    instance:
      default: yourInstance
      description: 'The Salesforce instance identifier (e.g., na1, eu3, or a My Domain subdomain like mycompany).

        '
    version:
      default: '63.0'
      description: 'The Salesforce API version number (e.g., 63.0). Use the latest supported version for new integrations.

        '
security:
- BearerAuth: []
tags:
- name: Undelete
paths:
  /services/Soap/c/64.0:
    parameters: []
    post:
      tags:
      - Undelete
      summary: Salesforce Soap Undelete
      description: Undeletes records from the Recycle Bin.
      operationId: SOAPundelete
      parameters:
      - name: Content-Type
        in: header
        description: ''
        required: true
        schema:
          const: text/xml; charset=UTF-8
          type: string
          examples:
          - text/xml; charset=UTF-8
        example: example_value
      - name: Accept
        in: header
        description: ''
        required: true
        schema:
          type: string
          examples:
          - text/xml
        example: example_value
      - name: SOAPAction
        in: header
        description: ''
        required: true
        schema:
          type: string
          examples:
          - undelete
        example: example_value
      requestBody:
        description: ''
        content:
          application/xml:
            schema:
              allOf:
              - $ref: '#/components/schemas/Envelope7'
              - xml:
                  name: Envelope
                  attribute: false
                  wrapped: false
                examples:
                - "<Envelope>\n\n  <soapenv:Header xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\">\n\n    <urn:SessionHeader xmlns:urn=\"urn:enterprise.soap.sforce.com\">\n\n      <urn:sessionId></urn:sessionId>\n\n    </urn:SessionHeader>\n\n  </soapenv:Header>\n\n  <soapenv:Body xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\">\n\n    <urn:undelete xmlns:urn=\"urn:enterprise.soap.sforce.com\">\n\n      <urn:ids></urn:ids>\n\n    </urn:undelete>\n\n  </soapenv:Body>\n\n</Envelope>"
              contentMediaType: application/xml
            example: "<Envelope>\n\n  <soapenv:Header xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\">\n\n    <urn:SessionHeader xmlns:urn=\"urn:enterprise.soap.sforce.com\">\n\n      <urn:sessionId></urn:sessionId>\n\n    </urn:SessionHeader>\n\n  </soapenv:Header>\n\n  <soapenv:Body xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\">\n\n    <urn:undelete xmlns:urn=\"urn:enterprise.soap.sforce.com\">\n\n      <urn:ids></urn:ids>\n\n    </urn:undelete>\n\n  </soapenv:Body>\n\n</Envelope>"
        required: true
      responses:
        '200':
          description: ''
          headers: {}
      deprecated: false
      servers:
      - url: https://login.salesforce.com
        variables: {}
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
        ChooseTags: true
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    SessionHeader4:
      title: SessionHeader4
      required:
      - sessionId
      type: object
      properties:
        sessionId:
          type: string
          xml:
            name: sessionId
            namespace: urn:enterprise.soap.sforce.com
            prefix: urn
            attribute: false
            wrapped: false
          example: '500123'
      xml:
        name: SessionHeader
        namespace: urn:enterprise.soap.sforce.com
        prefix: urn
        attribute: false
        wrapped: false
    undelete:
      title: undelete
      required:
      - ids
      type: object
      properties:
        ids:
          type: string
          xml:
            name: ids
            namespace: urn:enterprise.soap.sforce.com
            prefix: urn
            attribute: false
            wrapped: false
          example: example_value
      xml:
        name: undelete
        namespace: urn:enterprise.soap.sforce.com
        prefix: urn
        attribute: false
        wrapped: false
    Envelope7:
      title: Envelope7
      required:
      - Header
      - Body
      type: object
      properties:
        Header:
          allOf:
          - $ref: '#/components/schemas/Header8'
          - xml:
              name: Header
              namespace: http://schemas.xmlsoap.org/soap/envelope/
              prefix: soapenv
              attribute: false
              wrapped: false
          example: example_value
        Body:
          allOf:
          - $ref: '#/components/schemas/Body23'
          - xml:
              name: Body
              namespace: http://schemas.xmlsoap.org/soap/envelope/
              prefix: soapenv
              attribute: false
              wrapped: false
          example: example_value
      xml:
        name: Envelope
        namespace: http://schemas.xmlsoap.org/soap/envelope/
        prefix: soapenv
        attribute: false
        wrapped: false
    Body23:
      title: Body23
      required:
      - undelete
      type: object
      properties:
        undelete:
          allOf:
          - $ref: '#/components/schemas/undelete'
          - xml:
              name: undelete
              namespace: urn:enterprise.soap.sforce.com
              prefix: urn
              attribute: false
              wrapped: false
          example: example_value
      xml:
        name: Body
        namespace: http://schemas.xmlsoap.org/soap/envelope/
        prefix: soapenv
        attribute: false
        wrapped: false
    Header8:
      title: Header8
      required:
      - SessionHeader
      type: object
      properties:
        SessionHeader:
          allOf:
          - $ref: '#/components/schemas/SessionHeader4'
          - xml:
              name: SessionHeader
              namespace: urn:enterprise.soap.sforce.com
              prefix: urn
              attribute: false
              wrapped: false
          example: example_value
      xml:
        name: Header
        namespace: http://schemas.xmlsoap.org/soap/envelope/
        prefix: soapenv
        attribute: false
        wrapped: false
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'OAuth 2.0 Bearer token obtained from the Salesforce OAuth 2.0 token endpoint. Include this token in the Authorization header as "Bearer {access_token}".

        '
