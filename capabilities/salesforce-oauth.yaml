naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Oauth
  description: 'Salesforce — Oauth. 6 operations. Lead operation: Salesforce Oauth Usage. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Oauth
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-oauth
    baseUri: https://login.salesforce.com
    description: Salesforce — Oauth business capability. Self-contained, no shared references.
    resources:
    - name: services-data-v64.0-apps-oauth-usage
      path: /services/data/v64.0/apps/oauth/usage
      operations:
      - name: oauthusage
        method: GET
        description: Salesforce Oauth Usage
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
          description: Number of the page you want returned. Starts at 0. If you don’t specify a value or if you specify 0,
            the first page is returned.
          required: true
        - name: pageSize
          in: query
          type: integer
          description: Number of usage entries per page. Defaults to 100.
          required: true
        - name: Authorization
          in: header
          type: string
          description: Replace <token> with your access token
          required: true
    - name: services-data-v64.0-apps-oauth-usage-tokens
      path: /services/data/v64.0/apps/oauth/usage///tokens
      operations:
      - name: oauthappuserstokens
        method: GET
        description: Salesforce Oauth App Users Tokens
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Authorization
          in: header
          type: string
          description: Replace <token> with your access token
          required: true
      - name: oauthusertokensrevoke
        method: DELETE
        description: Salesforce Oauth User Tokens Revoke
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Authorization
          in: header
          type: string
          description: Replace <token> with your access token
          required: true
    - name: services-data-v64.0-apps-oauth-usage-tokens
      path: /services/data/v64.0/apps/oauth/usage//tokens
      operations:
      - name: oauthtokensrevoke
        method: DELETE
        description: Salesforce Oauth Tokens Revoke
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Authorization
          in: header
          type: string
          description: Replace <token> with your access token
          required: true
    - name: services-data-v64.0-apps-oauth-usage-users
      path: /services/data/v64.0/apps/oauth/usage//users
      operations:
      - name: oauthappusers
        method: GET
        description: Salesforce Oauth App Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
          description: Page number for the usage information. Defaults to 0.
          required: true
        - name: pageSize
          in: query
          type: integer
          description: Number of usage entries per page. Defaults to 100.
          required: true
        - name: Authorization
          in: header
          type: string
          description: Replace <token> with your access token
          required: true
    - name: services-data-v64.0-apps-oauth-usage-tokens
      path: /services/data/v64.0/apps/oauth/usage/tokens/
      operations:
      - name: oauthtokenrevoke
        method: DELETE
        description: Salesforce Oauth Token Revoke
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Authorization
          in: header
          type: string
          description: Replace <token> with your access token
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-oauth-rest
    port: 8080
    description: REST adapter for Salesforce — Oauth. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/services/data/v64-0/apps/oauth/usage
      name: services-data-v64-0-apps-oauth-usage
      description: REST surface for services-data-v64.0-apps-oauth-usage.
      operations:
      - method: GET
        name: oauthusage
        description: Salesforce Oauth Usage
        call: salesforce-oauth.oauthusage
        with:
          page: rest.page
          pageSize: rest.pageSize
          Authorization: rest.Authorization
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/services/data/v64-0/apps/oauth/usage/tokens
      name: services-data-v64-0-apps-oauth-usage-tokens
      description: REST surface for services-data-v64.0-apps-oauth-usage-tokens.
      operations:
      - method: GET
        name: oauthappuserstokens
        description: Salesforce Oauth App Users Tokens
        call: salesforce-oauth.oauthappuserstokens
        with:
          Authorization: rest.Authorization
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: oauthusertokensrevoke
        description: Salesforce Oauth User Tokens Revoke
        call: salesforce-oauth.oauthusertokensrevoke
        with:
          Authorization: rest.Authorization
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/services/data/v64-0/apps/oauth/usage/tokens
      name: services-data-v64-0-apps-oauth-usage-tokens
      description: REST surface for services-data-v64.0-apps-oauth-usage-tokens.
      operations:
      - method: DELETE
        name: oauthtokensrevoke
        description: Salesforce Oauth Tokens Revoke
        call: salesforce-oauth.oauthtokensrevoke
        with:
          Authorization: rest.Authorization
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/services/data/v64-0/apps/oauth/usage/users
      name: services-data-v64-0-apps-oauth-usage-users
      description: REST surface for services-data-v64.0-apps-oauth-usage-users.
      operations:
      - method: GET
        name: oauthappusers
        description: Salesforce Oauth App Users
        call: salesforce-oauth.oauthappusers
        with:
          page: rest.page
          pageSize: rest.pageSize
          Authorization: rest.Authorization
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/services/data/v64-0/apps/oauth/usage/tokens
      name: services-data-v64-0-apps-oauth-usage-tokens
      description: REST surface for services-data-v64.0-apps-oauth-usage-tokens.
      operations:
      - method: DELETE
        name: oauthtokenrevoke
        description: Salesforce Oauth Token Revoke
        call: salesforce-oauth.oauthtokenrevoke
        with:
          Authorization: rest.Authorization
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-oauth-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Oauth. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-oauth-usage
      description: Salesforce Oauth Usage
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-oauth.oauthusage
      with:
        page: tools.page
        pageSize: tools.pageSize
        Authorization: tools.Authorization
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-oauth-app-users-tokens
      description: Salesforce Oauth App Users Tokens
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-oauth.oauthappuserstokens
      with:
        Authorization: tools.Authorization
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-oauth-user-tokens-revoke
      description: Salesforce Oauth User Tokens Revoke
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: salesforce-oauth.oauthusertokensrevoke
      with:
        Authorization: tools.Authorization
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-oauth-tokens-revoke
      description: Salesforce Oauth Tokens Revoke
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: salesforce-oauth.oauthtokensrevoke
      with:
        Authorization: tools.Authorization
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-oauth-app-users
      description: Salesforce Oauth App Users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-oauth.oauthappusers
      with:
        page: tools.page
        pageSize: tools.pageSize
        Authorization: tools.Authorization
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-oauth-token-revoke
      description: Salesforce Oauth Token Revoke
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: salesforce-oauth.oauthtokenrevoke
      with:
        Authorization: tools.Authorization
      outputParameters:
      - type: object
        mapping: $.
