naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Element
  description: 'Salesforce — Element. 1 operations. Lead operation: Salesforce Feed Element - Delete. Self-contained Naftiko
    capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Element
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-element
    baseUri: https://login.salesforce.com
    description: Salesforce — Element business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-chatter-feed-elements-FEED_ELEMENT_ID
      path: /data/v64.0/chatter/feed-elements/{FEED_ELEMENT_ID}
      operations:
      - name: feedelementdelete
        method: DELETE
        description: Salesforce Feed Element - Delete
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: FEED_ELEMENT_ID
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-element-rest
    port: 8080
    description: REST adapter for Salesforce — Element. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/chatter/feed-elements/{feed-element-id}
      name: data-v64-0-chatter-feed-elements-feed-element-id
      description: REST surface for data-v64.0-chatter-feed-elements-FEED_ELEMENT_ID.
      operations:
      - method: DELETE
        name: feedelementdelete
        description: Salesforce Feed Element - Delete
        call: salesforce-element.feedelementdelete
        with:
          FEED_ELEMENT_ID: rest.FEED_ELEMENT_ID
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-element-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Element. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-feed-element-delete
      description: Salesforce Feed Element - Delete
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: salesforce-element.feedelementdelete
      with:
        FEED_ELEMENT_ID: tools.FEED_ELEMENT_ID
      outputParameters:
      - type: object
        mapping: $.
