naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Favorite
  description: 'Salesforce — Favorite. 5 operations. Lead operation: Salesforce Create a Favorite. Self-contained Naftiko
    capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Favorite
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-favorite
    baseUri: https://login.salesforce.com
    description: Salesforce — Favorite business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-ui-api-favorites
      path: /data/v64.0/ui-api/favorites
      operations:
      - name: createafavorite
        method: POST
        description: Salesforce Create a Favorite
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: data-v64.0-ui-api-favorites-FAVORITE_ID
      path: /data/v64.0/ui-api/favorites/{FAVORITE_ID}
      operations:
      - name: getafavorite
        method: GET
        description: Salesforce Get a Favorite
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: FAVORITE_ID
          in: path
          type: string
          description: The ID of a favorite
          required: true
      - name: updateafavorite
        method: PATCH
        description: Salesforce Update a Favorite
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: FAVORITE_ID
          in: path
          type: string
          description: The ID of a favorite
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteafavorite
        method: DELETE
        description: Salesforce Delete a Favorite
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: FAVORITE_ID
          in: path
          type: string
          description: The ID of a favorite
          required: true
    - name: data-v64.0-ui-api-favorites-FAVORITE_ID-usage
      path: /data/v64.0/ui-api/favorites/{FAVORITE_ID}/usage
      operations:
      - name: updateusageofafavorite
        method: PATCH
        description: Salesforce Update Usage of a Favorite
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: FAVORITE_ID
          in: path
          type: string
          description: The ID of a favorite
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-favorite-rest
    port: 8080
    description: REST adapter for Salesforce — Favorite. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/data/v64-0/ui-api/favorites
      name: data-v64-0-ui-api-favorites
      description: REST surface for data-v64.0-ui-api-favorites.
      operations:
      - method: POST
        name: createafavorite
        description: Salesforce Create a Favorite
        call: salesforce-favorite.createafavorite
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data/v64-0/ui-api/favorites/{favorite-id}
      name: data-v64-0-ui-api-favorites-favorite-id
      description: REST surface for data-v64.0-ui-api-favorites-FAVORITE_ID.
      operations:
      - method: GET
        name: getafavorite
        description: Salesforce Get a Favorite
        call: salesforce-favorite.getafavorite
        with:
          FAVORITE_ID: rest.FAVORITE_ID
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateafavorite
        description: Salesforce Update a Favorite
        call: salesforce-favorite.updateafavorite
        with:
          FAVORITE_ID: rest.FAVORITE_ID
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteafavorite
        description: Salesforce Delete a Favorite
        call: salesforce-favorite.deleteafavorite
        with:
          FAVORITE_ID: rest.FAVORITE_ID
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data/v64-0/ui-api/favorites/{favorite-id}/usage
      name: data-v64-0-ui-api-favorites-favorite-id-usage
      description: REST surface for data-v64.0-ui-api-favorites-FAVORITE_ID-usage.
      operations:
      - method: PATCH
        name: updateusageofafavorite
        description: Salesforce Update Usage of a Favorite
        call: salesforce-favorite.updateusageofafavorite
        with:
          FAVORITE_ID: rest.FAVORITE_ID
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-favorite-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Favorite. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-create-favorite
      description: Salesforce Create a Favorite
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-favorite.createafavorite
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-get-favorite
      description: Salesforce Get a Favorite
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-favorite.getafavorite
      with:
        FAVORITE_ID: tools.FAVORITE_ID
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-update-favorite
      description: Salesforce Update a Favorite
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: salesforce-favorite.updateafavorite
      with:
        FAVORITE_ID: tools.FAVORITE_ID
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-delete-favorite
      description: Salesforce Delete a Favorite
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: salesforce-favorite.deleteafavorite
      with:
        FAVORITE_ID: tools.FAVORITE_ID
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-update-usage-favorite
      description: Salesforce Update Usage of a Favorite
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: salesforce-favorite.updateusageofafavorite
      with:
        FAVORITE_ID: tools.FAVORITE_ID
      outputParameters:
      - type: object
        mapping: $.
