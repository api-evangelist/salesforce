naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Themes
  description: 'Salesforce — Themes. 1 operations. Lead operation: Salesforce Themes. Self-contained Naftiko capability covering
    one Salesforce business surface.'
  tags:
  - Salesforce
  - Themes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-themes
    baseUri: https://login.salesforce.com
    description: Salesforce — Themes business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-theme
      path: /data/v64.0/theme
      operations:
      - name: themes
        method: GET
        description: Salesforce Themes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Content-Type
          in: header
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-themes-rest
    port: 8080
    description: REST adapter for Salesforce — Themes. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/theme
      name: data-v64-0-theme
      description: REST surface for data-v64.0-theme.
      operations:
      - method: GET
        name: themes
        description: Salesforce Themes
        call: salesforce-themes.themes
        with:
          Content-Type: rest.Content-Type
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-themes-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Themes. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-themes
      description: Salesforce Themes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-themes.themes
      with:
        Content-Type: tools.Content-Type
      outputParameters:
      - type: object
        mapping: $.
