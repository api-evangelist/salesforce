naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Rules
  description: 'Salesforce — Rules. 1 operations. Lead operation: Salesforce Process Rules. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Rules
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-rules
    baseUri: https://login.salesforce.com
    description: Salesforce — Rules business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-process-rules
      path: /data/v64.0/process/rules
      operations:
      - name: processrules
        method: GET
        description: Salesforce Process Rules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Content-Type
          in: header
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-rules-rest
    port: 8080
    description: REST adapter for Salesforce — Rules. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/process/rules
      name: data-v64-0-process-rules
      description: REST surface for data-v64.0-process-rules.
      operations:
      - method: GET
        name: processrules
        description: Salesforce Process Rules
        call: salesforce-rules.processrules
        with:
          Content-Type: rest.Content-Type
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-rules-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Rules. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-process-rules
      description: Salesforce Process Rules
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-rules.processrules
      with:
        Content-Type: tools.Content-Type
      outputParameters:
      - type: object
        mapping: $.
