naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Appointment
  description: 'Salesforce — Appointment. 2 operations. Lead operation: Salesforce Get Appointment Candidates. Self-contained
    Naftiko capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Appointment
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-appointment
    baseUri: https://login.salesforce.com
    description: Salesforce — Appointment business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-scheduling-getAppointmentCandidates
      path: /data/v64.0/scheduling/getAppointmentCandidates
      operations:
      - name: getappointmentcandidates
        method: POST
        description: Salesforce Get Appointment Candidates
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: data-v64.0-scheduling-getAppointmentSlots
      path: /data/v64.0/scheduling/getAppointmentSlots
      operations:
      - name: getappointmentslots
        method: POST
        description: Salesforce Get Appointment Slots
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-appointment-rest
    port: 8080
    description: REST adapter for Salesforce — Appointment. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/data/v64-0/scheduling/getappointmentcandidates
      name: data-v64-0-scheduling-getappointmentcandidates
      description: REST surface for data-v64.0-scheduling-getAppointmentCandidates.
      operations:
      - method: POST
        name: getappointmentcandidates
        description: Salesforce Get Appointment Candidates
        call: salesforce-appointment.getappointmentcandidates
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data/v64-0/scheduling/getappointmentslots
      name: data-v64-0-scheduling-getappointmentslots
      description: REST surface for data-v64.0-scheduling-getAppointmentSlots.
      operations:
      - method: POST
        name: getappointmentslots
        description: Salesforce Get Appointment Slots
        call: salesforce-appointment.getappointmentslots
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-appointment-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Appointment. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-get-appointment-candidates
      description: Salesforce Get Appointment Candidates
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: salesforce-appointment.getappointmentcandidates
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-get-appointment-slots
      description: Salesforce Get Appointment Slots
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: salesforce-appointment.getappointmentslots
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
