naftiko: 1.0.0-alpha2
info:
  label: Salesforce — News
  description: 'Salesforce — News. 1 operations. Lead operation: Salesforce News Feed Elements. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - News
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-news
    baseUri: https://login.salesforce.com
    description: Salesforce — News business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-chatter-feeds-news-me-feed-elements
      path: /data/v64.0/chatter/feeds/news/me/feed-elements
      operations:
      - name: newsfeedelements
        method: GET
        description: Salesforce News Feed Elements
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-news-rest
    port: 8080
    description: REST adapter for Salesforce — News. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/chatter/feeds/news/me/feed-elements
      name: data-v64-0-chatter-feeds-news-me-feed-elements
      description: REST surface for data-v64.0-chatter-feeds-news-me-feed-elements.
      operations:
      - method: GET
        name: newsfeedelements
        description: Salesforce News Feed Elements
        call: salesforce-news.newsfeedelements
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-news-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — News. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-news-feed-elements
      description: Salesforce News Feed Elements
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-news.newsfeedelements
      outputParameters:
      - type: object
        mapping: $.
