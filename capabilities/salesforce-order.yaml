naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Order
  description: 'Salesforce — Order. 2 operations. Lead operation: Salesforce Create Order From Quote. Self-contained Naftiko
    capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Order
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-order
    baseUri: https://login.salesforce.com
    description: Salesforce — Order business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-actions-standard-createOrderFromQuote
      path: /data/v64.0/actions/standard/createOrderFromQuote
      operations:
      - name: createorderfromquote
        method: POST
        description: Salesforce Create Order From Quote
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: data-v64.0-search-scopeOrder
      path: /data/v64.0/search/scopeOrder
      operations:
      - name: searchscopeandorder
        method: GET
        description: Salesforce Search Scope and Order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Content-Type
          in: header
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-order-rest
    port: 8080
    description: REST adapter for Salesforce — Order. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/actions/standard/createorderfromquote
      name: data-v64-0-actions-standard-createorderfromquote
      description: REST surface for data-v64.0-actions-standard-createOrderFromQuote.
      operations:
      - method: POST
        name: createorderfromquote
        description: Salesforce Create Order From Quote
        call: salesforce-order.createorderfromquote
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data/v64-0/search/scopeorder
      name: data-v64-0-search-scopeorder
      description: REST surface for data-v64.0-search-scopeOrder.
      operations:
      - method: GET
        name: searchscopeandorder
        description: Salesforce Search Scope and Order
        call: salesforce-order.searchscopeandorder
        with:
          Content-Type: rest.Content-Type
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-order-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Order. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-create-order-quote
      description: Salesforce Create Order From Quote
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-order.createorderfromquote
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-search-scope-and-order
      description: Salesforce Search Scope and Order
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-order.searchscopeandorder
      with:
        Content-Type: tools.Content-Type
      outputParameters:
      - type: object
        mapping: $.
