naftiko: 1.0.0-alpha2
info:
  label: Salesforce UI API — Lookups
  description: 'Salesforce UI API — Lookups. 1 operations. Lead operation: Salesforce Search Lookup Field Records. Self-contained
    Naftiko capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Lookups
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: ui-lookups
    baseUri: https://{instanceName}.salesforce.com/services/data/v{version}/ui-api
    description: Salesforce UI API — Lookups business capability. Self-contained, no shared references.
    resources:
    - name: lookups-objectApiName-fieldApiName
      path: /lookups/{objectApiName}/{fieldApiName}
      operations:
      - name: getlookuprecords
        method: GET
        description: Salesforce Search Lookup Field Records
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fieldApiName
          in: path
          type: string
          description: The API name of the lookup field
          required: true
        - name: searchTerm
          in: query
          type: string
          description: The search text to match against lookup records
          required: true
        - name: dependentFieldBindings
          in: query
          type: string
          description: JSON-encoded field value pairs for dependent picklist filtering
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: ui-lookups-rest
    port: 8080
    description: REST adapter for Salesforce UI API — Lookups. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/lookups/{objectapiname}/{fieldapiname}
      name: lookups-objectapiname-fieldapiname
      description: REST surface for lookups-objectApiName-fieldApiName.
      operations:
      - method: GET
        name: getlookuprecords
        description: Salesforce Search Lookup Field Records
        call: ui-lookups.getlookuprecords
        with:
          fieldApiName: rest.fieldApiName
          searchTerm: rest.searchTerm
          dependentFieldBindings: rest.dependentFieldBindings
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ui-lookups-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce UI API — Lookups. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: salesforce-search-lookup-field-records
      description: Salesforce Search Lookup Field Records
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ui-lookups.getlookuprecords
      with:
        fieldApiName: tools.fieldApiName
        searchTerm: tools.searchTerm
        dependentFieldBindings: tools.dependentFieldBindings
      outputParameters:
      - type: object
        mapping: $.
