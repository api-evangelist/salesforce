naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Graph
  description: 'Salesforce — Graph. 1 operations. Lead operation: Salesforce Composite Graph. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Graph
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-graph
    baseUri: https://login.salesforce.com
    description: Salesforce — Graph business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-composite-graph
      path: /data/v64.0/composite/graph
      operations:
      - name: compositegraph
        method: POST
        description: Salesforce Composite Graph
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-graph-rest
    port: 8080
    description: REST adapter for Salesforce — Graph. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/composite/graph
      name: data-v64-0-composite-graph
      description: REST surface for data-v64.0-composite-graph.
      operations:
      - method: POST
        name: compositegraph
        description: Salesforce Composite Graph
        call: salesforce-graph.compositegraph
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-graph-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Graph. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-composite-graph
      description: Salesforce Composite Graph
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-graph.compositegraph
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
