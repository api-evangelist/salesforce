naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Schema
  description: 'Salesforce — Schema. 4 operations. Lead operation: Salesforce Request Openapi Schema. Self-contained Naftiko
    capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Schema
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-schema
    baseUri: https://login.salesforce.com
    description: Salesforce — Schema business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-async-specifications-oas3
      path: /data/v64.0/async/specifications/oas3
      operations:
      - name: requestopenapischema
        method: POST
        description: Salesforce Request Openapi Schema
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: data-v64.0-async-specifications-oas3-schemaId
      path: /data/v64.0/async/specifications/oas3/{schemaId}
      operations:
      - name: retrieveopenapischema
        method: GET
        description: Salesforce Retrieve Openapi Schema
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: schemaId
          in: path
          type: string
          description: Identifier that was returned in the original request to generate the Schema.
          required: true
    - name: data-v64.0-event-eventSchema-SCHEMA_ID
      path: /data/v64.0/event/eventSchema/{SCHEMA_ID}
      operations:
      - name: platformeventschemabyschemaid
        method: GET
        description: Salesforce Platform Event Schema by Schema Id
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: SCHEMA_ID
          in: path
          type: string
          required: true
        - name: Content-Type
          in: header
          type: string
          required: true
    - name: data-v64.0-sobjects-EVENT_NAME-eventSchema
      path: /data/v64.0/sobjects/{EVENT_NAME}/eventSchema
      operations:
      - name: platformeventschemabyeventname
        method: GET
        description: Salesforce Platform Event Schema by Event Name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: EVENT_NAME
          in: path
          type: string
          description: API Name of the event
          required: true
        - name: Content-Type
          in: header
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-schema-rest
    port: 8080
    description: REST adapter for Salesforce — Schema. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/async/specifications/oas3
      name: data-v64-0-async-specifications-oas3
      description: REST surface for data-v64.0-async-specifications-oas3.
      operations:
      - method: POST
        name: requestopenapischema
        description: Salesforce Request Openapi Schema
        call: salesforce-schema.requestopenapischema
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data/v64-0/async/specifications/oas3/{schemaid}
      name: data-v64-0-async-specifications-oas3-schemaid
      description: REST surface for data-v64.0-async-specifications-oas3-schemaId.
      operations:
      - method: GET
        name: retrieveopenapischema
        description: Salesforce Retrieve Openapi Schema
        call: salesforce-schema.retrieveopenapischema
        with:
          schemaId: rest.schemaId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data/v64-0/event/eventschema/{schema-id}
      name: data-v64-0-event-eventschema-schema-id
      description: REST surface for data-v64.0-event-eventSchema-SCHEMA_ID.
      operations:
      - method: GET
        name: platformeventschemabyschemaid
        description: Salesforce Platform Event Schema by Schema Id
        call: salesforce-schema.platformeventschemabyschemaid
        with:
          SCHEMA_ID: rest.SCHEMA_ID
          Content-Type: rest.Content-Type
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data/v64-0/sobjects/{event-name}/eventschema
      name: data-v64-0-sobjects-event-name-eventschema
      description: REST surface for data-v64.0-sobjects-EVENT_NAME-eventSchema.
      operations:
      - method: GET
        name: platformeventschemabyeventname
        description: Salesforce Platform Event Schema by Event Name
        call: salesforce-schema.platformeventschemabyeventname
        with:
          EVENT_NAME: rest.EVENT_NAME
          Content-Type: rest.Content-Type
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-schema-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Schema. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-request-openapi-schema
      description: Salesforce Request Openapi Schema
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-schema.requestopenapischema
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-retrieve-openapi-schema
      description: Salesforce Retrieve Openapi Schema
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-schema.retrieveopenapischema
      with:
        schemaId: tools.schemaId
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-platform-event-schema-schema
      description: Salesforce Platform Event Schema by Schema Id
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-schema.platformeventschemabyschemaid
      with:
        SCHEMA_ID: tools.SCHEMA_ID
        Content-Type: tools.Content-Type
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-platform-event-schema-event
      description: Salesforce Platform Event Schema by Event Name
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-schema.platformeventschemabyeventname
      with:
        EVENT_NAME: tools.EVENT_NAME
        Content-Type: tools.Content-Type
      outputParameters:
      - type: object
        mapping: $.
