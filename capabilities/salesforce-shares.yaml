naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Shares
  description: 'Salesforce — Shares. 2 operations. Lead operation: Salesforce File Shares. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Shares
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-shares
    baseUri: https://login.salesforce.com
    description: Salesforce — Shares business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-connect-files-FILE_ID-file-shares
      path: /data/v64.0/connect/files/{FILE_ID}/file-shares
      operations:
      - name: fileshares
        method: GET
        description: Salesforce File Shares
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: FILE_ID
          in: path
          type: string
          required: true
    - name: data-v64.0-connect-files-FILE_ID-file-shares-link
      path: /data/v64.0/connect/files/{FILE_ID}/file-shares/link
      operations:
      - name: filesshareslink
        method: PUT
        description: Salesforce Files Shares Link
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: FILE_ID
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-shares-rest
    port: 8080
    description: REST adapter for Salesforce — Shares. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/connect/files/{file-id}/file-shares
      name: data-v64-0-connect-files-file-id-file-shares
      description: REST surface for data-v64.0-connect-files-FILE_ID-file-shares.
      operations:
      - method: GET
        name: fileshares
        description: Salesforce File Shares
        call: salesforce-shares.fileshares
        with:
          FILE_ID: rest.FILE_ID
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data/v64-0/connect/files/{file-id}/file-shares/link
      name: data-v64-0-connect-files-file-id-file-shares-link
      description: REST surface for data-v64.0-connect-files-FILE_ID-file-shares-link.
      operations:
      - method: PUT
        name: filesshareslink
        description: Salesforce Files Shares Link
        call: salesforce-shares.filesshareslink
        with:
          FILE_ID: rest.FILE_ID
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-shares-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Shares. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-file-shares
      description: Salesforce File Shares
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-shares.fileshares
      with:
        FILE_ID: tools.FILE_ID
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-files-shares-link
      description: Salesforce Files Shares Link
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: salesforce-shares.filesshareslink
      with:
        FILE_ID: tools.FILE_ID
      outputParameters:
      - type: object
        mapping: $.
