naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Connect
  description: 'Salesforce — Connect. 3 operations. Lead operation: Salesforce Openid Connect Discovery Endpoint. Self-contained
    Naftiko capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Connect
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-connect
    baseUri: https://login.salesforce.com
    description: Salesforce — Connect business capability. Self-contained, no shared references.
    resources:
    - name: .well-known-openid-configuration
      path: /.well-known/openid-configuration
      operations:
      - name: openidconnectdiscoveryendpoint
        method: GET
        description: Salesforce Openid Connect Discovery Endpoint
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: services-oauth2-introspect
      path: /services/oauth2/introspect
      operations:
      - name: openidconnecttokenintrospectionendpoint
        method: POST
        description: Salesforce Openid Connect Token Introspection Endpoint
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Content-Type
          in: header
          type: string
          required: true
        - name: Accept
          in: header
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: services-oauth2-register
      path: /services/oauth2/register
      operations:
      - name: openidconnectdynamicclientregistrationendpoint
        method: POST
        description: Salesforce Openid Connect Dynamic Client Registration Endpoint
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Accept
          in: header
          type: string
          required: true
        - name: Authorization
          in: header
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-connect-rest
    port: 8080
    description: REST adapter for Salesforce — Connect. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/well-known/openid-configuration
      name: well-known-openid-configuration
      description: REST surface for .well-known-openid-configuration.
      operations:
      - method: GET
        name: openidconnectdiscoveryendpoint
        description: Salesforce Openid Connect Discovery Endpoint
        call: salesforce-connect.openidconnectdiscoveryendpoint
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/services/oauth2/introspect
      name: services-oauth2-introspect
      description: REST surface for services-oauth2-introspect.
      operations:
      - method: POST
        name: openidconnecttokenintrospectionendpoint
        description: Salesforce Openid Connect Token Introspection Endpoint
        call: salesforce-connect.openidconnecttokenintrospectionendpoint
        with:
          Content-Type: rest.Content-Type
          Accept: rest.Accept
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/services/oauth2/register
      name: services-oauth2-register
      description: REST surface for services-oauth2-register.
      operations:
      - method: POST
        name: openidconnectdynamicclientregistrationendpoint
        description: Salesforce Openid Connect Dynamic Client Registration Endpoint
        call: salesforce-connect.openidconnectdynamicclientregistrationendpoint
        with:
          Accept: rest.Accept
          Authorization: rest.Authorization
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-connect-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Connect. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-openid-connect-discovery-endpoint
      description: Salesforce Openid Connect Discovery Endpoint
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-connect.openidconnectdiscoveryendpoint
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-openid-connect-token-introspection
      description: Salesforce Openid Connect Token Introspection Endpoint
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-connect.openidconnecttokenintrospectionendpoint
      with:
        Content-Type: tools.Content-Type
        Accept: tools.Accept
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-openid-connect-dynamic-client
      description: Salesforce Openid Connect Dynamic Client Registration Endpoint
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-connect.openidconnectdynamicclientregistrationendpoint
      with:
        Accept: tools.Accept
        Authorization: tools.Authorization
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
