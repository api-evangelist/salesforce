naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Summaries
  description: 'Salesforce — Summaries. 1 operations. Lead operation: Salesforce Transaction Ledger Summary. Self-contained
    Naftiko capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Summaries
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-summaries
    baseUri: https://login.salesforce.com
    description: Salesforce — Summaries business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-loyalty-programs-loyaltyProgramName-members-membershipNumber-transact
      path: /data/v64.0/loyalty/programs/{loyaltyProgramName}/members/{membershipNumber}/transaction-ledger-summary
      operations:
      - name: transactionledgersummary
        method: GET
        description: Salesforce Transaction Ledger Summary
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: loyaltyProgramName
          in: path
          type: string
          required: true
        - name: membershipNumber
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-summaries-rest
    port: 8080
    description: REST adapter for Salesforce — Summaries. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/data/v64-0/loyalty/programs/{loyaltyprogramname}/members/{membershipnumber}/transaction-ledger-summary
      name: data-v64-0-loyalty-programs-loyaltyprogramname-members-membershipnumber-transact
      description: REST surface for data-v64.0-loyalty-programs-loyaltyProgramName-members-membershipNumber-transact.
      operations:
      - method: GET
        name: transactionledgersummary
        description: Salesforce Transaction Ledger Summary
        call: salesforce-summaries.transactionledgersummary
        with:
          loyaltyProgramName: rest.loyaltyProgramName
          membershipNumber: rest.membershipNumber
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-summaries-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Summaries. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-transaction-ledger-summary
      description: Salesforce Transaction Ledger Summary
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-summaries.transactionledgersummary
      with:
        loyaltyProgramName: tools.loyaltyProgramName
        membershipNumber: tools.membershipNumber
      outputParameters:
      - type: object
        mapping: $.
