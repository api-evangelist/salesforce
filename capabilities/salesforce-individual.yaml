naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Individual
  description: 'Salesforce — Individual. 1 operations. Lead operation: Salesforce Individual Member Enrollments. Self-contained
    Naftiko capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Individual
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-individual
    baseUri: https://login.salesforce.com
    description: Salesforce — Individual business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-loyalty-programs-loyaltyProgramName-individual-member-enrollments
      path: /data/v64.0/loyalty-programs/{loyaltyProgramName}/individual-member-enrollments
      operations:
      - name: individualmemberenrollments
        method: POST
        description: Salesforce Individual Member Enrollments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: loyaltyProgramName
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-individual-rest
    port: 8080
    description: REST adapter for Salesforce — Individual. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/data/v64-0/loyalty-programs/{loyaltyprogramname}/individual-member-enrollments
      name: data-v64-0-loyalty-programs-loyaltyprogramname-individual-member-enrollments
      description: REST surface for data-v64.0-loyalty-programs-loyaltyProgramName-individual-member-enrollments.
      operations:
      - method: POST
        name: individualmemberenrollments
        description: Salesforce Individual Member Enrollments
        call: salesforce-individual.individualmemberenrollments
        with:
          loyaltyProgramName: rest.loyaltyProgramName
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-individual-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Individual. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-individual-member-enrollments
      description: Salesforce Individual Member Enrollments
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-individual.individualmemberenrollments
      with:
        loyaltyProgramName: tools.loyaltyProgramName
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
