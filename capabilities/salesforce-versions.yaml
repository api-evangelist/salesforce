    resources:
    - path: /v1/data
      name: data
      description: REST surface for data.
      operations:
      - method: GET
        name: versions
        description: Salesforce Versions
        call: salesforce-versions.versions
        with:
          Content-Type: rest.Content-Type
          Sforce-Call-Options: rest.Sforce-Call-Options
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data/v64-0
