naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Suggested
  description: 'Salesforce — Suggested. 3 operations. Lead operation: Salesforce Search Suggested Queries. Self-contained
    Naftiko capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Suggested
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-suggested
    baseUri: https://login.salesforce.com
    description: Salesforce — Suggested business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-search-suggestSearchQueries
      path: /data/v64.0/search/suggestSearchQueries
      operations:
      - name: searchsuggestedqueries
        method: GET
        description: Salesforce Search Suggested Queries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: q
          in: query
          type: string
          required: true
        - name: language
          in: query
          type: string
          required: true
        - name: Content-Type
          in: header
          type: string
          required: true
    - name: data-v64.0-search-suggestions
      path: /data/v64.0/search/suggestions
      operations:
      - name: searchforrecordssuggestedbyautocompleteandinstantresults
        method: GET
        description: Salesforce Search for Records Suggested by Autocomplete and Instant Results
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: q
          in: query
          type: string
          required: true
        - name: sobject
          in: query
          type: string
          required: true
        - name: Content-Type
          in: header
          type: string
          required: true
    - name: data-v64.0-sobjects-SOBJECT_API_NAME-suggestedArticles
      path: /data/v64.0/sobjects/{SOBJECT_API_NAME}/suggestedArticles
      operations:
      - name: sobjectsuggestedarticles
        method: GET
        description: Salesforce Sobject Suggested Articles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: description
          in: query
          type: string
          required: true
        - name: language
          in: query
          type: string
          required: true
        - name: subject
          in: query
          type: string
          required: true
        - name: SOBJECT_API_NAME
          in: path
          type: string
          required: true
        - name: Content-Type
          in: header
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-suggested-rest
    port: 8080
    description: REST adapter for Salesforce — Suggested. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/data/v64-0/search/suggestsearchqueries
      name: data-v64-0-search-suggestsearchqueries
      description: REST surface for data-v64.0-search-suggestSearchQueries.
      operations:
      - method: GET
        name: searchsuggestedqueries
        description: Salesforce Search Suggested Queries
        call: salesforce-suggested.searchsuggestedqueries
        with:
          q: rest.q
          language: rest.language
          Content-Type: rest.Content-Type
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data/v64-0/search/suggestions
      name: data-v64-0-search-suggestions
      description: REST surface for data-v64.0-search-suggestions.
      operations:
      - method: GET
        name: searchforrecordssuggestedbyautocompleteandinstantresults
        description: Salesforce Search for Records Suggested by Autocomplete and Instant Results
        call: salesforce-suggested.searchforrecordssuggestedbyautocompleteandinstantresults
        with:
          q: rest.q
          sobject: rest.sobject
          Content-Type: rest.Content-Type
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data/v64-0/sobjects/{sobject-api-name}/suggestedarticles
      name: data-v64-0-sobjects-sobject-api-name-suggestedarticles
      description: REST surface for data-v64.0-sobjects-SOBJECT_API_NAME-suggestedArticles.
      operations:
      - method: GET
        name: sobjectsuggestedarticles
        description: Salesforce Sobject Suggested Articles
        call: salesforce-suggested.sobjectsuggestedarticles
        with:
          description: rest.description
          language: rest.language
          subject: rest.subject
          SOBJECT_API_NAME: rest.SOBJECT_API_NAME
          Content-Type: rest.Content-Type
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-suggested-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Suggested. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-search-suggested-queries
      description: Salesforce Search Suggested Queries
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-suggested.searchsuggestedqueries
      with:
        q: tools.q
        language: tools.language
        Content-Type: tools.Content-Type
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-search-records-suggested-autocomplete
      description: Salesforce Search for Records Suggested by Autocomplete and Instant Results
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-suggested.searchforrecordssuggestedbyautocompleteandinstantresults
      with:
        q: tools.q
        sobject: tools.sobject
        Content-Type: tools.Content-Type
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-sobject-suggested-articles
      description: Salesforce Sobject Suggested Articles
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-suggested.sobjectsuggestedarticles
      with:
        description: tools.description
        language: tools.language
        subject: tools.subject
        SOBJECT_API_NAME: tools.SOBJECT_API_NAME
        Content-Type: tools.Content-Type
      outputParameters:
      - type: object
        mapping: $.
