naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Scope
  description: 'Salesforce — Scope. 1 operations. Lead operation: Salesforce Search Scope and Order. Self-contained Naftiko
    capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Scope
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-scope
    baseUri: https://login.salesforce.com
    description: Salesforce — Scope business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-search-scopeOrder
      path: /data/v64.0/search/scopeOrder
      operations:
      - name: searchscopeandorder
        method: GET
        description: Salesforce Search Scope and Order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Content-Type
          in: header
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-scope-rest
    port: 8080
    description: REST adapter for Salesforce — Scope. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/search/scopeorder
      name: data-v64-0-search-scopeorder
      description: REST surface for data-v64.0-search-scopeOrder.
      operations:
      - method: GET
        name: searchscopeandorder
        description: Salesforce Search Scope and Order
        call: salesforce-scope.searchscopeandorder
        with:
          Content-Type: rest.Content-Type
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-scope-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Scope. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-search-scope-and-order
      description: Salesforce Search Scope and Order
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-scope.searchscopeandorder
      with:
        Content-Type: tools.Content-Type
      outputParameters:
      - type: object
        mapping: $.
