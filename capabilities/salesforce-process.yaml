naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Process
  description: 'Salesforce — Process. 3 operations. Lead operation: Salesforce Process Approvals. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Process
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-process
    baseUri: https://login.salesforce.com
    description: Salesforce — Process business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-process-approvals
      path: /data/v64.0/process/approvals
      operations:
      - name: processapprovals
        method: GET
        description: Salesforce Process Approvals
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Content-Type
          in: header
          type: string
          required: true
      - name: processapprovalssubmit
        method: POST
        description: Salesforce Process Approvals Submit
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: data-v64.0-process-rules
      path: /data/v64.0/process/rules
      operations:
      - name: processrules
        method: GET
        description: Salesforce Process Rules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Content-Type
          in: header
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-process-rest
    port: 8080
    description: REST adapter for Salesforce — Process. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/process/approvals
      name: data-v64-0-process-approvals
      description: REST surface for data-v64.0-process-approvals.
      operations:
      - method: GET
        name: processapprovals
        description: Salesforce Process Approvals
        call: salesforce-process.processapprovals
        with:
          Content-Type: rest.Content-Type
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: processapprovalssubmit
        description: Salesforce Process Approvals Submit
        call: salesforce-process.processapprovalssubmit
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data/v64-0/process/rules
      name: data-v64-0-process-rules
      description: REST surface for data-v64.0-process-rules.
      operations:
      - method: GET
        name: processrules
        description: Salesforce Process Rules
        call: salesforce-process.processrules
        with:
          Content-Type: rest.Content-Type
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-process-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Process. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-process-approvals
      description: Salesforce Process Approvals
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-process.processapprovals
      with:
        Content-Type: tools.Content-Type
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-process-approvals-submit
      description: Salesforce Process Approvals Submit
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-process.processapprovalssubmit
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-process-rules
      description: Salesforce Process Rules
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-process.processrules
      with:
        Content-Type: tools.Content-Type
      outputParameters:
      - type: object
        mapping: $.
