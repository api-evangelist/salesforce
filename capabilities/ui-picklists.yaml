naftiko: 1.0.0-alpha2
info:
  label: Salesforce UI API — Picklists
  description: 'Salesforce UI API — Picklists. 1 operations. Lead operation: Salesforce Get Picklist Values for a Record Type.
    Self-contained Naftiko capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Picklists
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: ui-picklists
    baseUri: https://{instanceName}.salesforce.com/services/data/v{version}/ui-api
    description: Salesforce UI API — Picklists business capability. Self-contained, no shared references.
    resources:
    - name: object-info-objectApiName-picklist-values-recordTypeId
      path: /object-info/{objectApiName}/picklist-values/{recordTypeId}
      operations:
      - name: getpicklistvalues
        method: GET
        description: Salesforce Get Picklist Values for a Record Type
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: recordTypeId
          in: path
          type: string
          description: The record type ID or the string '012000000000000AAA' for the master record type
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: ui-picklists-rest
    port: 8080
    description: REST adapter for Salesforce UI API — Picklists. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/object-info/{objectapiname}/picklist-values/{recordtypeid}
      name: object-info-objectapiname-picklist-values-recordtypeid
      description: REST surface for object-info-objectApiName-picklist-values-recordTypeId.
      operations:
      - method: GET
        name: getpicklistvalues
        description: Salesforce Get Picklist Values for a Record Type
        call: ui-picklists.getpicklistvalues
        with:
          recordTypeId: rest.recordTypeId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ui-picklists-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce UI API — Picklists. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: salesforce-get-picklist-values-record
      description: Salesforce Get Picklist Values for a Record Type
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ui-picklists.getpicklistvalues
      with:
        recordTypeId: tools.recordTypeId
      outputParameters:
      - type: object
        mapping: $.
