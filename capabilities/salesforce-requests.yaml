naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Requests
  description: 'Salesforce — Requests. 2 operations. Lead operation: Salesforce Request Openapi Schema. Self-contained Naftiko
    capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Requests
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-requests
    baseUri: https://login.salesforce.com
    description: Salesforce — Requests business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-async-specifications-oas3
      path: /data/v64.0/async/specifications/oas3
      operations:
      - name: requestopenapischema
        method: POST
        description: Salesforce Request Openapi Schema
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: data-v64.0-commerce-catalog-products-actions-get-products
      path: /data/v64.0/commerce/catalog-products/actions/get-products
      operations:
      - name: requestproductinformationnobundles
        method: POST
        description: Salesforce Request Product Information (no Bundles)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-requests-rest
    port: 8080
    description: REST adapter for Salesforce — Requests. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/data/v64-0/async/specifications/oas3
      name: data-v64-0-async-specifications-oas3
      description: REST surface for data-v64.0-async-specifications-oas3.
      operations:
      - method: POST
        name: requestopenapischema
        description: Salesforce Request Openapi Schema
        call: salesforce-requests.requestopenapischema
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data/v64-0/commerce/catalog-products/actions/get-products
      name: data-v64-0-commerce-catalog-products-actions-get-products
      description: REST surface for data-v64.0-commerce-catalog-products-actions-get-products.
      operations:
      - method: POST
        name: requestproductinformationnobundles
        description: Salesforce Request Product Information (no Bundles)
        call: salesforce-requests.requestproductinformationnobundles
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-requests-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Requests. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-request-openapi-schema
      description: Salesforce Request Openapi Schema
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-requests.requestopenapischema
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-request-product-information-no
      description: Salesforce Request Product Information (no Bundles)
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-requests.requestproductinformationnobundles
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
