naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Commitment
  description: 'Salesforce — Commitment. 1 operations. Lead operation: Salesforce Update Commitment Payments. Self-contained
    Naftiko capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Commitment
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-commitment
    baseUri: https://login.salesforce.com
    description: Salesforce — Commitment business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-connect-fundraising-commitments-payment-updates
      path: /data/v64.0/connect/fundraising/commitments/payment-updates
      operations:
      - name: updatecommitmentpayments
        method: POST
        description: Salesforce Update Commitment Payments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-commitment-rest
    port: 8080
    description: REST adapter for Salesforce — Commitment. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/data/v64-0/connect/fundraising/commitments/payment-updates
      name: data-v64-0-connect-fundraising-commitments-payment-updates
      description: REST surface for data-v64.0-connect-fundraising-commitments-payment-updates.
      operations:
      - method: POST
        name: updatecommitmentpayments
        description: Salesforce Update Commitment Payments
        call: salesforce-commitment.updatecommitmentpayments
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-commitment-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Commitment. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-update-commitment-payments
      description: Salesforce Update Commitment Payments
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-commitment.updatecommitmentpayments
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
