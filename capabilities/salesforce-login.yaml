naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Login
  description: 'Salesforce — Login. 1 operations. Lead operation: Salesforce Passwordless Login - Initialize. Self-contained
    Naftiko capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Login
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-login
    baseUri: https://login.salesforce.com
    description: Salesforce — Login business capability. Self-contained, no shared references.
    resources:
    - name: services-auth-headless-init-passwordless-login
      path: /services/auth/headless/init/passwordless/login
      operations:
      - name: passwordlesslogininitialize
        method: POST
        description: Salesforce Passwordless Login - Initialize
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-login-rest
    port: 8080
    description: REST adapter for Salesforce — Login. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/services/auth/headless/init/passwordless/login
      name: services-auth-headless-init-passwordless-login
      description: REST surface for services-auth-headless-init-passwordless-login.
      operations:
      - method: POST
        name: passwordlesslogininitialize
        description: Salesforce Passwordless Login - Initialize
        call: salesforce-login.passwordlesslogininitialize
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-login-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Login. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-passwordless-login-initialize
      description: Salesforce Passwordless Login - Initialize
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-login.passwordlesslogininitialize
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
