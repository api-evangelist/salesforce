naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Consent
  description: 'Salesforce — Consent. 1 operations. Lead operation: Salesforce Consent. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Consent
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-consent
    baseUri: https://login.salesforce.com
    description: Salesforce — Consent business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-consent-action-action
      path: /data/v64.0/consent/action/action
      operations:
      - name: consent
        method: GET
        description: Salesforce Consent
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: actions
          in: query
          type: string
          required: true
        - name: ids
          in: query
          type: string
          required: true
        - name: Content-Type
          in: header
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-consent-rest
    port: 8080
    description: REST adapter for Salesforce — Consent. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/consent/action/action
      name: data-v64-0-consent-action-action
      description: REST surface for data-v64.0-consent-action-action.
      operations:
      - method: GET
        name: consent
        description: Salesforce Consent
        call: salesforce-consent.consent
        with:
          actions: rest.actions
          ids: rest.ids
          Content-Type: rest.Content-Type
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-consent-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Consent. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-consent
      description: Salesforce Consent
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-consent.consent
      with:
        actions: tools.actions
        ids: tools.ids
        Content-Type: tools.Content-Type
      outputParameters:
      - type: object
        mapping: $.
