naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Scheduling
  description: 'Salesforce — Scheduling. 1 operations. Lead operation: Salesforce Scheduling. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Scheduling
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-scheduling
    baseUri: https://login.salesforce.com
    description: Salesforce — Scheduling business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-scheduling
      path: /data/v64.0/scheduling
      operations:
      - name: scheduling
        method: GET
        description: Salesforce Scheduling
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Content-Type
          in: header
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-scheduling-rest
    port: 8080
    description: REST adapter for Salesforce — Scheduling. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/data/v64-0/scheduling
      name: data-v64-0-scheduling
      description: REST surface for data-v64.0-scheduling.
      operations:
      - method: GET
        name: scheduling
        description: Salesforce Scheduling
        call: salesforce-scheduling.scheduling
        with:
          Content-Type: rest.Content-Type
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-scheduling-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Scheduling. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-scheduling
      description: Salesforce Scheduling
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-scheduling.scheduling
      with:
        Content-Type: tools.Content-Type
      outputParameters:
      - type: object
        mapping: $.
