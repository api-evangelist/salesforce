naftiko: 1.0.0-alpha2
info:
  label: Salesforce REST API — Limits
  description: 'Salesforce REST API — Limits. 1 operations. Lead operation: Salesforce Get Org Api Limits. Self-contained
    Naftiko capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Limits
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-limits
    baseUri: https://{instance}.salesforce.com/services/data/v{version}
    description: Salesforce REST API — Limits business capability. Self-contained, no shared references.
    resources:
    - name: limits
      path: /limits
      operations:
      - name: getorglimits
        method: GET
        description: Salesforce Get Org Api Limits
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-limits-rest
    port: 8080
    description: REST adapter for Salesforce REST API — Limits. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/limits
      name: limits
      description: REST surface for limits.
      operations:
      - method: GET
        name: getorglimits
        description: Salesforce Get Org Api Limits
        call: rest-limits.getorglimits
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-limits-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce REST API — Limits. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: salesforce-get-org-api-limits
      description: Salesforce Get Org Api Limits
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-limits.getorglimits
      outputParameters:
      - type: object
        mapping: $.
