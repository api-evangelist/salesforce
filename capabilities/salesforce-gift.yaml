naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Gift
  description: 'Salesforce — Gift. 1 operations. Lead operation: Salesforce Update Gift Transaction Payments. Self-contained
    Naftiko capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Gift
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-gift
    baseUri: https://login.salesforce.com
    description: Salesforce — Gift business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-connect-fundraising-transactions-payment-updates
      path: /data/v64.0/connect/fundraising/transactions/payment-updates
      operations:
      - name: updategifttransactionpayments
        method: POST
        description: Salesforce Update Gift Transaction Payments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-gift-rest
    port: 8080
    description: REST adapter for Salesforce — Gift. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/connect/fundraising/transactions/payment-updates
      name: data-v64-0-connect-fundraising-transactions-payment-updates
      description: REST surface for data-v64.0-connect-fundraising-transactions-payment-updates.
      operations:
      - method: POST
        name: updategifttransactionpayments
        description: Salesforce Update Gift Transaction Payments
        call: salesforce-gift.updategifttransactionpayments
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-gift-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Gift. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-update-gift-transaction-payments
      description: Salesforce Update Gift Transaction Payments
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-gift.updategifttransactionpayments
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
