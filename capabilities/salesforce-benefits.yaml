naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Benefits
  description: 'Salesforce — Benefits. 1 operations. Lead operation: Salesforce Member Benefits. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Benefits
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-benefits
    baseUri: https://login.salesforce.com
    description: Salesforce — Benefits business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-connect-loyalty-member-memberId-memberbenefits
      path: /data/v64.0/connect/loyalty/member/{memberId}/memberbenefits
      operations:
      - name: memberbenefits
        method: GET
        description: Salesforce Member Benefits
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: memberId
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-benefits-rest
    port: 8080
    description: REST adapter for Salesforce — Benefits. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/data/v64-0/connect/loyalty/member/{memberid}/memberbenefits
      name: data-v64-0-connect-loyalty-member-memberid-memberbenefits
      description: REST surface for data-v64.0-connect-loyalty-member-memberId-memberbenefits.
      operations:
      - method: GET
        name: memberbenefits
        description: Salesforce Member Benefits
        call: salesforce-benefits.memberbenefits
        with:
          memberId: rest.memberId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-benefits-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Benefits. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-member-benefits
      description: Salesforce Member Benefits
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-benefits.memberbenefits
      with:
        memberId: tools.memberId
      outputParameters:
      - type: object
        mapping: $.
