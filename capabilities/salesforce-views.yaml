naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Views
  description: 'Salesforce — Views. 2 operations. Lead operation: Salesforce List Views. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Views
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-views
    baseUri: https://login.salesforce.com
    description: Salesforce — Views business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-sobjects-SOBJECT_API_NAME-listviews
      path: /data/v64.0/sobjects/{SOBJECT_API_NAME}/listviews
      operations:
      - name: listviews
        method: GET
        description: Salesforce List Views
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: SOBJECT_API_NAME
          in: path
          type: string
          required: true
        - name: Content-Type
          in: header
          type: string
          required: true
    - name: data-v64.0-ui-api-list-info-SOBJECT_API_NAME
      path: /data/v64.0/ui-api/list-info/{SOBJECT_API_NAME}
      operations:
      - name: getlistviewsforanobject
        method: GET
        description: Salesforce Get List Views for an Object
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: SOBJECT_API_NAME
          in: path
          type: string
          description: API name of a UI API supported object.
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-views-rest
    port: 8080
    description: REST adapter for Salesforce — Views. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/sobjects/{sobject-api-name}/listviews
      name: data-v64-0-sobjects-sobject-api-name-listviews
      description: REST surface for data-v64.0-sobjects-SOBJECT_API_NAME-listviews.
      operations:
      - method: GET
        name: listviews
        description: Salesforce List Views
        call: salesforce-views.listviews
        with:
          SOBJECT_API_NAME: rest.SOBJECT_API_NAME
          Content-Type: rest.Content-Type
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data/v64-0/ui-api/list-info/{sobject-api-name}
      name: data-v64-0-ui-api-list-info-sobject-api-name
      description: REST surface for data-v64.0-ui-api-list-info-SOBJECT_API_NAME.
      operations:
      - method: GET
        name: getlistviewsforanobject
        description: Salesforce Get List Views for an Object
        call: salesforce-views.getlistviewsforanobject
        with:
          SOBJECT_API_NAME: rest.SOBJECT_API_NAME
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-views-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Views. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-list-views
      description: Salesforce List Views
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-views.listviews
      with:
        SOBJECT_API_NAME: tools.SOBJECT_API_NAME
        Content-Type: tools.Content-Type
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-get-list-views-object
      description: Salesforce Get List Views for an Object
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-views.getlistviewsforanobject
      with:
        SOBJECT_API_NAME: tools.SOBJECT_API_NAME
      outputParameters:
      - type: object
        mapping: $.
