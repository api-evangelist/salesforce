naftiko: 1.0.0-alpha2
info:
  label: Salesforce — History
  description: 'Salesforce — History. 1 operations. Lead operation: Salesforce Transaction History. Self-contained Naftiko
    capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - History
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-history
    baseUri: https://login.salesforce.com
    description: Salesforce — History business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-connect-loyalty-programs-loyaltyProgramName-transaction-history
      path: /data/v64.0/connect/loyalty/programs/{loyaltyProgramName}/transaction-history
      operations:
      - name: transactionhistory
        method: POST
        description: Salesforce Transaction History
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: string
          required: true
        - name: loyaltyProgramName
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-history-rest
    port: 8080
    description: REST adapter for Salesforce — History. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/connect/loyalty/programs/{loyaltyprogramname}/transaction-history
      name: data-v64-0-connect-loyalty-programs-loyaltyprogramname-transaction-history
      description: REST surface for data-v64.0-connect-loyalty-programs-loyaltyProgramName-transaction-history.
      operations:
      - method: POST
        name: transactionhistory
        description: Salesforce Transaction History
        call: salesforce-history.transactionhistory
        with:
          page: rest.page
          loyaltyProgramName: rest.loyaltyProgramName
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-history-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — History. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-transaction-history
      description: Salesforce Transaction History
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-history.transactionhistory
      with:
        page: tools.page
        loyaltyProgramName: tools.loyaltyProgramName
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
