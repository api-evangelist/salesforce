naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Cancel
  description: 'Salesforce — Cancel. 1 operations. Lead operation: Salesforce Cancel a Voucher. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Cancel
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-cancel
    baseUri: https://login.salesforce.com
    description: Salesforce — Cancel business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-connect-loyalty-programs-loyaltyProgramName-program-processes-process
      path: /data/v64.0/connect/loyalty/programs/{loyaltyProgramName}/program-processes/{processName}
      operations:
      - name: cancelavoucher
        method: POST
        description: Salesforce Cancel a Voucher
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: loyaltyProgramName
          in: path
          type: string
          required: true
        - name: processName
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-cancel-rest
    port: 8080
    description: REST adapter for Salesforce — Cancel. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/connect/loyalty/programs/{loyaltyprogramname}/program-processes/{processname}
      name: data-v64-0-connect-loyalty-programs-loyaltyprogramname-program-processes-process
      description: REST surface for data-v64.0-connect-loyalty-programs-loyaltyProgramName-program-processes-process.
      operations:
      - method: POST
        name: cancelavoucher
        description: Salesforce Cancel a Voucher
        call: salesforce-cancel.cancelavoucher
        with:
          loyaltyProgramName: rest.loyaltyProgramName
          processName: rest.processName
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-cancel-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Cancel. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-cancel-voucher
      description: Salesforce Cancel a Voucher
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-cancel.cancelavoucher
      with:
        loyaltyProgramName: tools.loyaltyProgramName
        processName: tools.processName
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
