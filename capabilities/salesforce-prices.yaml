naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Prices
  description: 'Salesforce — Prices. 1 operations. Lead operation: Salesforce Calculate Price (new Sale). Self-contained Naftiko
    capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Prices
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-prices
    baseUri: https://login.salesforce.com
    description: Salesforce — Prices business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-commerce-pricing-salestransaction-actions-calculate-price
      path: /data/v64.0/commerce/pricing/salestransaction/actions/calculate-price
      operations:
      - name: calculatepricenewsale
        method: POST
        description: Salesforce Calculate Price (new Sale)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-prices-rest
    port: 8080
    description: REST adapter for Salesforce — Prices. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/commerce/pricing/salestransaction/actions/calculate-price
      name: data-v64-0-commerce-pricing-salestransaction-actions-calculate-price
      description: REST surface for data-v64.0-commerce-pricing-salestransaction-actions-calculate-price.
      operations:
      - method: POST
        name: calculatepricenewsale
        description: Salesforce Calculate Price (new Sale)
        call: salesforce-prices.calculatepricenewsale
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-prices-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Prices. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-calculate-price-new-sale
      description: Salesforce Calculate Price (new Sale)
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-prices.calculatepricenewsale
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
