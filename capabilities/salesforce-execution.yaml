naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Execution
  description: 'Salesforce — Execution. 1 operations. Lead operation: Salesforce Transaction Journals Execution. Self-contained
    Naftiko capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Execution
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-execution
    baseUri: https://login.salesforce.com
    description: Salesforce — Execution business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-connect-realtime-loyalty-programs-loyaltyProgramName
      path: /data/v64.0/connect/realtime/loyalty/programs/{loyaltyProgramName}
      operations:
      - name: transactionjournalsexecution
        method: POST
        description: Salesforce Transaction Journals Execution
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: loyaltyProgramName
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-execution-rest
    port: 8080
    description: REST adapter for Salesforce — Execution. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/data/v64-0/connect/realtime/loyalty/programs/{loyaltyprogramname}
      name: data-v64-0-connect-realtime-loyalty-programs-loyaltyprogramname
      description: REST surface for data-v64.0-connect-realtime-loyalty-programs-loyaltyProgramName.
      operations:
      - method: POST
        name: transactionjournalsexecution
        description: Salesforce Transaction Journals Execution
        call: salesforce-execution.transactionjournalsexecution
        with:
          loyaltyProgramName: rest.loyaltyProgramName
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-execution-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Execution. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-transaction-journals-execution
      description: Salesforce Transaction Journals Execution
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-execution.transactionjournalsexecution
      with:
        loyaltyProgramName: tools.loyaltyProgramName
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
