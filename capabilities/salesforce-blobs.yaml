naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Blobs
  description: 'Salesforce — Blobs. 1 operations. Lead operation: Salesforce Sobject Blob Retrieve. Self-contained Naftiko
    capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Blobs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-blobs
    baseUri: https://login.salesforce.com
    description: Salesforce — Blobs business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-sobjects-SOBJECT_API_NAME-RECORD_ID-BLOB_FIELD
      path: /data/v64.0/sobjects/{SOBJECT_API_NAME}/{RECORD_ID}/{BLOB_FIELD}
      operations:
      - name: sobjectblobretrieve
        method: GET
        description: Salesforce Sobject Blob Retrieve
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: SOBJECT_API_NAME
          in: path
          type: string
          required: true
        - name: RECORD_ID
          in: path
          type: string
          required: true
        - name: BLOB_FIELD
          in: path
          type: string
          required: true
        - name: Content-Type
          in: header
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-blobs-rest
    port: 8080
    description: REST adapter for Salesforce — Blobs. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/sobjects/{sobject-api-name}/{record-id}/{blob-field}
      name: data-v64-0-sobjects-sobject-api-name-record-id-blob-field
      description: REST surface for data-v64.0-sobjects-SOBJECT_API_NAME-RECORD_ID-BLOB_FIELD.
      operations:
      - method: GET
        name: sobjectblobretrieve
        description: Salesforce Sobject Blob Retrieve
        call: salesforce-blobs.sobjectblobretrieve
        with:
          SOBJECT_API_NAME: rest.SOBJECT_API_NAME
          RECORD_ID: rest.RECORD_ID
          BLOB_FIELD: rest.BLOB_FIELD
          Content-Type: rest.Content-Type
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-blobs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Blobs. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-sobject-blob-retrieve
      description: Salesforce Sobject Blob Retrieve
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-blobs.sobjectblobretrieve
      with:
        SOBJECT_API_NAME: tools.SOBJECT_API_NAME
        RECORD_ID: tools.RECORD_ID
        BLOB_FIELD: tools.BLOB_FIELD
        Content-Type: tools.Content-Type
      outputParameters:
      - type: object
        mapping: $.
