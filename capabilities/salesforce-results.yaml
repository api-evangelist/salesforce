      operations:
      - name: gettestresults
        method: GET
        description: Salesforce Get Test Results
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: runId
          in: path
          type: string
          description: Evaluation ID
          required: true
    - name: data-v64.0-jobs-ingest-failedResults
      path: /data/v64.0/jobs/ingest//failedResults
