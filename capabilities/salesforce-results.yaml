        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Content-Type
          in: header
          type: string
          required: true
        - name: Accept
          in: header
          type: string
          required: true
    - name: data-v64.0-search-suggestions
