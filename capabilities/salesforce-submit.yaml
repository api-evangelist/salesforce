naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Submit
  description: 'Salesforce — Submit. 1 operations. Lead operation: Salesforce Process Approvals Submit. Self-contained Naftiko
    capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Submit
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-submit
    baseUri: https://login.salesforce.com
    description: Salesforce — Submit business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-process-approvals
      path: /data/v64.0/process/approvals
      operations:
      - name: processapprovalssubmit
        method: POST
        description: Salesforce Process Approvals Submit
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-submit-rest
    port: 8080
    description: REST adapter for Salesforce — Submit. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/process/approvals
      name: data-v64-0-process-approvals
      description: REST surface for data-v64.0-process-approvals.
      operations:
      - method: POST
        name: processapprovalssubmit
        description: Salesforce Process Approvals Submit
        call: salesforce-submit.processapprovalssubmit
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-submit-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Submit. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-process-approvals-submit
      description: Salesforce Process Approvals Submit
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-submit.processapprovalssubmit
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
