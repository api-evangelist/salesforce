naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Parallel
  description: 'Salesforce — Parallel. 1 operations. Lead operation: Salesforce Get Parallel Results for a Query Job. Self-contained
    Naftiko capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Parallel
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-parallel
    baseUri: https://login.salesforce.com
    description: Salesforce — Parallel business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-jobs-query-resultPages
      path: /data/v64.0/jobs/query//resultPages
      operations:
      - name: getparallelresultsforaqueryjob
        method: GET
        description: Salesforce Get Parallel Results for a Query Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Content-Type
          in: header
          type: string
          required: true
        - name: Accept
          in: header
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-parallel-rest
    port: 8080
    description: REST adapter for Salesforce — Parallel. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/data/v64-0/jobs/query/resultpages
      name: data-v64-0-jobs-query-resultpages
      description: REST surface for data-v64.0-jobs-query-resultPages.
      operations:
      - method: GET
        name: getparallelresultsforaqueryjob
        description: Salesforce Get Parallel Results for a Query Job
        call: salesforce-parallel.getparallelresultsforaqueryjob
        with:
          Content-Type: rest.Content-Type
          Accept: rest.Accept
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-parallel-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Parallel. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-get-parallel-results-query
      description: Salesforce Get Parallel Results for a Query Job
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-parallel.getparallelresultsforaqueryjob
      with:
        Content-Type: tools.Content-Type
        Accept: tools.Accept
      outputParameters:
      - type: object
        mapping: $.
