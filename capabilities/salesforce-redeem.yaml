naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Redeem
  description: 'Salesforce — Redeem. 1 operations. Lead operation: Salesforce Redeem Voucher. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Redeem
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-redeem
    baseUri: https://login.salesforce.com
    description: Salesforce — Redeem business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-loyalty-programs-loyaltyProgramName-members-membershipNumber-vouchers
      path: /data/v64.0/loyalty/programs/{loyaltyProgramName}/members/{membershipNumber}/vouchers/{voucherCode}/redeem
      operations:
      - name: redeemvoucher
        method: POST
        description: Salesforce Redeem Voucher
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: voucherNumber
          in: query
          type: string
          required: true
        - name: loyaltyProgramName
          in: path
          type: string
          description: The loyalty program name.
          required: true
        - name: membershipNumber
          in: path
          type: string
          description: The loyalty program membership number.
          required: true
        - name: voucherCode
          in: path
          type: string
          description: The voucher code to be redeemed.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-redeem-rest
    port: 8080
    description: REST adapter for Salesforce — Redeem. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/loyalty/programs/{loyaltyprogramname}/members/{membershipnumber}/vouchers/{vouchercode}/redeem
      name: data-v64-0-loyalty-programs-loyaltyprogramname-members-membershipnumber-vouchers
      description: REST surface for data-v64.0-loyalty-programs-loyaltyProgramName-members-membershipNumber-vouchers.
      operations:
      - method: POST
        name: redeemvoucher
        description: Salesforce Redeem Voucher
        call: salesforce-redeem.redeemvoucher
        with:
          voucherNumber: rest.voucherNumber
          loyaltyProgramName: rest.loyaltyProgramName
          membershipNumber: rest.membershipNumber
          voucherCode: rest.voucherCode
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-redeem-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Redeem. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-redeem-voucher
      description: Salesforce Redeem Voucher
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-redeem.redeemvoucher
      with:
        voucherNumber: tools.voucherNumber
        loyaltyProgramName: tools.loyaltyProgramName
        membershipNumber: tools.membershipNumber
        voucherCode: tools.voucherCode
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
