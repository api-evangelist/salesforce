naftiko: 1.0.0-alpha2
info:
  label: Salesforce REST API — QueryAll
  description: 'Salesforce REST API — QueryAll. 1 operations. Lead operation: Salesforce Execute a Queryall (includes Deleted
    Records). Self-contained Naftiko capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - QueryAll
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-queryall
    baseUri: https://{instance}.salesforce.com/services/data/v{version}
    description: Salesforce REST API — QueryAll business capability. Self-contained, no shared references.
    resources:
    - name: queryAll
      path: /queryAll
      operations:
      - name: executequeryall
        method: POST
        description: Salesforce Execute a Queryall (includes Deleted Records)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-queryall-rest
    port: 8080
    description: REST adapter for Salesforce REST API — QueryAll. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/queryall
      name: queryall
      description: REST surface for queryAll.
      operations:
      - method: POST
        name: executequeryall
        description: Salesforce Execute a Queryall (includes Deleted Records)
        call: rest-queryall.executequeryall
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-queryall-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce REST API — QueryAll. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: salesforce-execute-queryall-includes-deleted
      description: Salesforce Execute a Queryall (includes Deleted Records)
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: rest-queryall.executequeryall
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
