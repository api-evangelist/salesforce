        destructive: false
        idempotent: false
      call: salesforce-composite.compositebatch
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-composite-graph
      description: Salesforce Composite Graph
      hints:
        readOnly: false
