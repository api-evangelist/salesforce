naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Count
  description: 'Salesforce — Count. 1 operations. Lead operation: Salesforce Record Count. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Count
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-count
    baseUri: https://login.salesforce.com
    description: Salesforce — Count business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-limits-recordCount
      path: /data/v64.0/limits/recordCount
      operations:
      - name: recordcount
        method: GET
        description: Salesforce Record Count
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sObjects
          in: query
          type: string
          description: A comma-delimited list of object names. If a listed object is not found in the org, it is ignored and
            not returned in the response.
          required: true
        - name: Content-Type
          in: header
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-count-rest
    port: 8080
    description: REST adapter for Salesforce — Count. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/limits/recordcount
      name: data-v64-0-limits-recordcount
      description: REST surface for data-v64.0-limits-recordCount.
      operations:
      - method: GET
        name: recordcount
        description: Salesforce Record Count
        call: salesforce-count.recordcount
        with:
          sObjects: rest.sObjects
          Content-Type: rest.Content-Type
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-count-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Count. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-record-count
      description: Salesforce Record Count
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-count.recordcount
      with:
        sObjects: tools.sObjects
        Content-Type: tools.Content-Type
      outputParameters:
      - type: object
        mapping: $.
