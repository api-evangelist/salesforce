naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Edit
  description: 'Salesforce — Edit. 2 operations. Lead operation: Salesforce Comment - Edit. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Edit
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-edit
    baseUri: https://login.salesforce.com
    description: Salesforce — Edit business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-chatter-comments-COMMENT_ID
      path: /data/v64.0/chatter/comments/{COMMENT_ID}
      operations:
      - name: commentedit
        method: PATCH
        description: Salesforce Comment - Edit
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: COMMENT_ID
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: data-v64.0-ui-api-actions-record-RECORD_ID-record-edit
      path: /data/v64.0/ui-api/actions/record/{RECORD_ID}/record-edit
      operations:
      - name: getrecordeditpageactions
        method: GET
        description: Salesforce Get Record Edit Page Actions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: RECORD_ID
          in: path
          type: string
          description: Record ID
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-edit-rest
    port: 8080
    description: REST adapter for Salesforce — Edit. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/chatter/comments/{comment-id}
      name: data-v64-0-chatter-comments-comment-id
      description: REST surface for data-v64.0-chatter-comments-COMMENT_ID.
      operations:
      - method: PATCH
        name: commentedit
        description: Salesforce Comment - Edit
        call: salesforce-edit.commentedit
        with:
          COMMENT_ID: rest.COMMENT_ID
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data/v64-0/ui-api/actions/record/{record-id}/record-edit
      name: data-v64-0-ui-api-actions-record-record-id-record-edit
      description: REST surface for data-v64.0-ui-api-actions-record-RECORD_ID-record-edit.
      operations:
      - method: GET
        name: getrecordeditpageactions
        description: Salesforce Get Record Edit Page Actions
        call: salesforce-edit.getrecordeditpageactions
        with:
          RECORD_ID: rest.RECORD_ID
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-edit-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Edit. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-comment-edit
      description: Salesforce Comment - Edit
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: salesforce-edit.commentedit
      with:
        COMMENT_ID: tools.COMMENT_ID
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-get-record-edit-page
      description: Salesforce Get Record Edit Page Actions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-edit.getrecordeditpageactions
      with:
        RECORD_ID: tools.RECORD_ID
      outputParameters:
      - type: object
        mapping: $.
