naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Chart
  description: 'Salesforce — Chart. 1 operations. Lead operation: Salesforce Get List View Chart Actions. Self-contained Naftiko
    capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Chart
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-chart
    baseUri: https://login.salesforce.com
    description: Salesforce — Chart business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-ui-api-actions-list-view-chart-SOBJECT_API_NAME
      path: /data/v64.0/ui-api/actions/list-view-chart/{SOBJECT_API_NAME}
      operations:
      - name: getlistviewchartactions
        method: GET
        description: Salesforce Get List View Chart Actions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: SOBJECT_API_NAME
          in: path
          type: string
          description: Currently, only `ListViewChartInstance` is valid.
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-chart-rest
    port: 8080
    description: REST adapter for Salesforce — Chart. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/ui-api/actions/list-view-chart/{sobject-api-name}
      name: data-v64-0-ui-api-actions-list-view-chart-sobject-api-name
      description: REST surface for data-v64.0-ui-api-actions-list-view-chart-SOBJECT_API_NAME.
      operations:
      - method: GET
        name: getlistviewchartactions
        description: Salesforce Get List View Chart Actions
        call: salesforce-chart.getlistviewchartactions
        with:
          SOBJECT_API_NAME: rest.SOBJECT_API_NAME
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-chart-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Chart. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-get-list-view-chart
      description: Salesforce Get List View Chart Actions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-chart.getlistviewchartactions
      with:
        SOBJECT_API_NAME: tools.SOBJECT_API_NAME
      outputParameters:
      - type: object
        mapping: $.
