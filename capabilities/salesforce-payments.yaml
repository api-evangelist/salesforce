naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Payments
  description: 'Salesforce — Payments. 3 operations. Lead operation: Salesforce Create Payment Method. Self-contained Naftiko
    capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Payments
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-payments
    baseUri: https://login.salesforce.com
    description: Salesforce — Payments business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-commerce-payments-payment-methods
      path: /data/v64.0/commerce/payments/payment-methods
      operations:
      - name: createpaymentmethod
        method: POST
        description: Salesforce Create Payment Method
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: data-v64.0-connect-fundraising-commitments-payment-updates
      path: /data/v64.0/connect/fundraising/commitments/payment-updates
      operations:
      - name: updatecommitmentpayments
        method: POST
        description: Salesforce Update Commitment Payments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: data-v64.0-connect-fundraising-transactions-payment-updates
      path: /data/v64.0/connect/fundraising/transactions/payment-updates
      operations:
      - name: updategifttransactionpayments
        method: POST
        description: Salesforce Update Gift Transaction Payments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-payments-rest
    port: 8080
    description: REST adapter for Salesforce — Payments. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/data/v64-0/commerce/payments/payment-methods
      name: data-v64-0-commerce-payments-payment-methods
      description: REST surface for data-v64.0-commerce-payments-payment-methods.
      operations:
      - method: POST
        name: createpaymentmethod
        description: Salesforce Create Payment Method
        call: salesforce-payments.createpaymentmethod
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data/v64-0/connect/fundraising/commitments/payment-updates
      name: data-v64-0-connect-fundraising-commitments-payment-updates
      description: REST surface for data-v64.0-connect-fundraising-commitments-payment-updates.
      operations:
      - method: POST
        name: updatecommitmentpayments
        description: Salesforce Update Commitment Payments
        call: salesforce-payments.updatecommitmentpayments
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data/v64-0/connect/fundraising/transactions/payment-updates
      name: data-v64-0-connect-fundraising-transactions-payment-updates
      description: REST surface for data-v64.0-connect-fundraising-transactions-payment-updates.
      operations:
      - method: POST
        name: updategifttransactionpayments
        description: Salesforce Update Gift Transaction Payments
        call: salesforce-payments.updategifttransactionpayments
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-payments-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Payments. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-create-payment-method
      description: Salesforce Create Payment Method
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-payments.createpaymentmethod
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-update-commitment-payments
      description: Salesforce Update Commitment Payments
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-payments.updatecommitmentpayments
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-update-gift-transaction-payments
      description: Salesforce Update Gift Transaction Payments
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-payments.updategifttransactionpayments
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
