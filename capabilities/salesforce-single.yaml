naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Single
  description: 'Salesforce — Single. 1 operations. Lead operation: Salesforce Publish Single Event. Self-contained Naftiko
    capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Single
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-single
    baseUri: https://login.salesforce.com
    description: Salesforce — Single business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-sobjects-EventApiName
      path: /data/v64.0/sobjects/{EventApiName}
      operations:
      - name: publishsingleevent
        method: POST
        description: Salesforce Publish Single Event
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: EventApiName
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-single-rest
    port: 8080
    description: REST adapter for Salesforce — Single. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/sobjects/{eventapiname}
      name: data-v64-0-sobjects-eventapiname
      description: REST surface for data-v64.0-sobjects-EventApiName.
      operations:
      - method: POST
        name: publishsingleevent
        description: Salesforce Publish Single Event
        call: salesforce-single.publishsingleevent
        with:
          EventApiName: rest.EventApiName
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-single-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Single. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-publish-single-event
      description: Salesforce Publish Single Event
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-single.publishsingleevent
      with:
        EventApiName: tools.EventApiName
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
