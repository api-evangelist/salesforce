naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Invoke
  description: 'Salesforce — Invoke. 1 operations. Lead operation: Salesforce Invoke. Self-contained Naftiko capability covering
    one Salesforce business surface.'
  tags:
  - Salesforce
  - Invoke
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-invoke
    baseUri: https://login.salesforce.com
    description: Salesforce — Invoke business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-connect-business-rules-decision-table-lookup-decisionTableId
      path: /data/v64.0/connect/business-rules/decision-table/lookup/{decisionTableId}
      operations:
      - name: invoke
        method: POST
        description: Salesforce Invoke
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: decisionTableId
          in: path
          type: string
          description: Decision Table Id
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-invoke-rest
    port: 8080
    description: REST adapter for Salesforce — Invoke. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/connect/business-rules/decision-table/lookup/{decisiontableid}
      name: data-v64-0-connect-business-rules-decision-table-lookup-decisiontableid
      description: REST surface for data-v64.0-connect-business-rules-decision-table-lookup-decisionTableId.
      operations:
      - method: POST
        name: invoke
        description: Salesforce Invoke
        call: salesforce-invoke.invoke
        with:
          decisionTableId: rest.decisionTableId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-invoke-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Invoke. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-invoke
      description: Salesforce Invoke
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-invoke.invoke
      with:
        decisionTableId: tools.decisionTableId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
