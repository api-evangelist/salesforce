naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Messages
  description: 'Salesforce — Messages. 1 operations. Lead operation: Salesforce User Messages, General. Self-contained Naftiko
    capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Messages
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-messages
    baseUri: https://login.salesforce.com
    description: Salesforce — Messages business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-chatter-users-me-messages
      path: /data/v64.0/chatter/users/me/messages
      operations:
      - name: usermessagesgeneral
        method: POST
        description: Salesforce User Messages, General
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: text
          in: query
          type: string
          required: true
        - name: recipients
          in: query
          type: string
          description: Comma-separated list of User IDs
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-messages-rest
    port: 8080
    description: REST adapter for Salesforce — Messages. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/data/v64-0/chatter/users/me/messages
      name: data-v64-0-chatter-users-me-messages
      description: REST surface for data-v64.0-chatter-users-me-messages.
      operations:
      - method: POST
        name: usermessagesgeneral
        description: Salesforce User Messages, General
        call: salesforce-messages.usermessagesgeneral
        with:
          text: rest.text
          recipients: rest.recipients
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-messages-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Messages. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-user-messages-general
      description: Salesforce User Messages, General
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-messages.usermessagesgeneral
      with:
        text: tools.text
        recipients: tools.recipients
      outputParameters:
      - type: object
        mapping: $.
