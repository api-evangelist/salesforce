naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Relationships
  description: 'Salesforce — Relationships. 1 operations. Lead operation: Salesforce Sobject Relationships. Self-contained
    Naftiko capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Relationships
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-relationships
    baseUri: https://login.salesforce.com
    description: Salesforce — Relationships business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-sobjects-SOBJECT_API_NAME-RECORD_ID-RELATIONSHIP_FIELD_NAME
      path: /data/v64.0/sobjects/{SOBJECT_API_NAME}/{RECORD_ID}/{RELATIONSHIP_FIELD_NAME}
      operations:
      - name: sobjectrelationships
        method: GET
        description: Salesforce Sobject Relationships
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: SOBJECT_API_NAME
          in: path
          type: string
          required: true
        - name: RECORD_ID
          in: path
          type: string
          required: true
        - name: RELATIONSHIP_FIELD_NAME
          in: path
          type: string
          required: true
        - name: Content-Type
          in: header
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-relationships-rest
    port: 8080
    description: REST adapter for Salesforce — Relationships. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/data/v64-0/sobjects/{sobject-api-name}/{record-id}/{relationship-field-name}
      name: data-v64-0-sobjects-sobject-api-name-record-id-relationship-field-name
      description: REST surface for data-v64.0-sobjects-SOBJECT_API_NAME-RECORD_ID-RELATIONSHIP_FIELD_NAME.
      operations:
      - method: GET
        name: sobjectrelationships
        description: Salesforce Sobject Relationships
        call: salesforce-relationships.sobjectrelationships
        with:
          SOBJECT_API_NAME: rest.SOBJECT_API_NAME
          RECORD_ID: rest.RECORD_ID
          RELATIONSHIP_FIELD_NAME: rest.RELATIONSHIP_FIELD_NAME
          Content-Type: rest.Content-Type
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-relationships-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Relationships. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-sobject-relationships
      description: Salesforce Sobject Relationships
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-relationships.sobjectrelationships
      with:
        SOBJECT_API_NAME: tools.SOBJECT_API_NAME
        RECORD_ID: tools.RECORD_ID
        RELATIONSHIP_FIELD_NAME: tools.RELATIONSHIP_FIELD_NAME
        Content-Type: tools.Content-Type
      outputParameters:
      - type: object
        mapping: $.
