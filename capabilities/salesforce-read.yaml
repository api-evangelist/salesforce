naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Read
  description: 'Salesforce — Read. 1 operations. Lead operation: Salesforce Read Quote Api. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Read
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-read
    baseUri: https://login.salesforce.com
    description: Salesforce — Read business capability. Self-contained, no shared references.
    resources:
    - name: apexrest-SBQQ-ServiceRouter
      path: /apexrest/SBQQ/ServiceRouter
      operations:
      - name: readquoteapi
        method: GET
        description: Salesforce Read Quote Api
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: reader
          in: query
          type: string
          required: true
        - name: uid
          in: query
          type: string
          required: true
        - name: Content-Type
          in: header
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-read-rest
    port: 8080
    description: REST adapter for Salesforce — Read. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/apexrest/sbqq/servicerouter
      name: apexrest-sbqq-servicerouter
      description: REST surface for apexrest-SBQQ-ServiceRouter.
      operations:
      - method: GET
        name: readquoteapi
        description: Salesforce Read Quote Api
        call: salesforce-read.readquoteapi
        with:
          reader: rest.reader
          uid: rest.uid
          Content-Type: rest.Content-Type
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-read-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Read. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-read-quote-api
      description: Salesforce Read Quote Api
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-read.readquoteapi
      with:
        reader: tools.reader
        uid: tools.uid
        Content-Type: tools.Content-Type
      outputParameters:
      - type: object
        mapping: $.
