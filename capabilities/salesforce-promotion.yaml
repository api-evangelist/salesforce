naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Promotion
  description: 'Salesforce — Promotion. 1 operations. Lead operation: Salesforce Promotion Details. Self-contained Naftiko
    capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Promotion
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-promotion
    baseUri: https://login.salesforce.com
    description: Salesforce — Promotion business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-global-promotions-management-promotions-promotionId
      path: /data/v64.0/global-promotions-management/promotions/{promotionId}
      operations:
      - name: promotiondetails
        method: GET
        description: Salesforce Promotion Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: promotionId
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-promotion-rest
    port: 8080
    description: REST adapter for Salesforce — Promotion. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/data/v64-0/global-promotions-management/promotions/{promotionid}
      name: data-v64-0-global-promotions-management-promotions-promotionid
      description: REST surface for data-v64.0-global-promotions-management-promotions-promotionId.
      operations:
      - method: GET
        name: promotiondetails
        description: Salesforce Promotion Details
        call: salesforce-promotion.promotiondetails
        with:
          promotionId: rest.promotionId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-promotion-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Promotion. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-promotion-details
      description: Salesforce Promotion Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-promotion.promotiondetails
      with:
        promotionId: tools.promotionId
      outputParameters:
      - type: object
        mapping: $.
