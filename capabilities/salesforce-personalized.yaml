naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Personalized
  description: 'Salesforce — Personalized. 2 operations. Lead operation: Salesforce Get Personalized Navigation Items. Self-contained
    Naftiko capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Personalized
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-personalized
    baseUri: https://login.salesforce.com
    description: Salesforce — Personalized business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-ui-api-apps-APP_ID-user-nav-items
      path: /data/v64.0/ui-api/apps/{APP_ID}/user-nav-items
      operations:
      - name: getpersonalizednavigationitems
        method: GET
        description: Salesforce Get Personalized Navigation Items
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: APP_ID
          in: path
          type: string
          description: Application ID
          required: true
      - name: updatepersonalizednavigationitems
        method: PUT
        description: Salesforce Update Personalized Navigation Items
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: APP_ID
          in: path
          type: string
          description: Application ID
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-personalized-rest
    port: 8080
    description: REST adapter for Salesforce — Personalized. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/data/v64-0/ui-api/apps/{app-id}/user-nav-items
      name: data-v64-0-ui-api-apps-app-id-user-nav-items
      description: REST surface for data-v64.0-ui-api-apps-APP_ID-user-nav-items.
      operations:
      - method: GET
        name: getpersonalizednavigationitems
        description: Salesforce Get Personalized Navigation Items
        call: salesforce-personalized.getpersonalizednavigationitems
        with:
          APP_ID: rest.APP_ID
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatepersonalizednavigationitems
        description: Salesforce Update Personalized Navigation Items
        call: salesforce-personalized.updatepersonalizednavigationitems
        with:
          APP_ID: rest.APP_ID
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-personalized-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Personalized. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-get-personalized-navigation-items
      description: Salesforce Get Personalized Navigation Items
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-personalized.getpersonalizednavigationitems
      with:
        APP_ID: tools.APP_ID
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-update-personalized-navigation-items
      description: Salesforce Update Personalized Navigation Items
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: salesforce-personalized.updatepersonalizednavigationitems
      with:
        APP_ID: tools.APP_ID
      outputParameters:
      - type: object
        mapping: $.
