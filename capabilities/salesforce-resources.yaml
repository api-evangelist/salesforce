naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Resources
  description: 'Salesforce — Resources. 2 operations. Lead operation: Salesforce Resources by Version. Self-contained Naftiko
    capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Resources
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-resources
    baseUri: https://login.salesforce.com
    description: Salesforce — Resources business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0
      path: /data/v64.0
      operations:
      - name: resourcesbyversion
        method: GET
        description: Salesforce Resources by Version
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Content-Type
          in: header
          type: string
          required: true
    - name: services-data-v64.0-apps-oauth-credentials
      path: /services/data/v64.0/apps/oauth/credentials//
      operations:
      - name: resources
        method: GET
        description: Salesforce Resources
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: part
          in: query
          type: string
          description: Key, Secret, or KeyAndSecret
          required: true
        - name: Authorization
          in: header
          type: string
          description: Replace <token> with your access token
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-resources-rest
    port: 8080
    description: REST adapter for Salesforce — Resources. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/data/v64-0
      name: data-v64-0
      description: REST surface for data-v64.0.
      operations:
      - method: GET
        name: resourcesbyversion
        description: Salesforce Resources by Version
        call: salesforce-resources.resourcesbyversion
        with:
          Content-Type: rest.Content-Type
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/services/data/v64-0/apps/oauth/credentials
      name: services-data-v64-0-apps-oauth-credentials
      description: REST surface for services-data-v64.0-apps-oauth-credentials.
      operations:
      - method: GET
        name: resources
        description: Salesforce Resources
        call: salesforce-resources.resources
        with:
          part: rest.part
          Authorization: rest.Authorization
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-resources-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Resources. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-resources-version
      description: Salesforce Resources by Version
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-resources.resourcesbyversion
      with:
        Content-Type: tools.Content-Type
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-resources
      description: Salesforce Resources
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-resources.resources
      with:
        part: tools.part
        Authorization: tools.Authorization
      outputParameters:
      - type: object
        mapping: $.
