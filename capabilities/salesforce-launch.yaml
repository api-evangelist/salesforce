naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Launch
  description: 'Salesforce — Launch. 1 operations. Lead operation: Salesforce Launch Flow. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Launch
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-launch
    baseUri: https://login.salesforce.com
    description: Salesforce — Launch business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-actions-custom-flow-flowApiName
      path: /data/v64.0/actions/custom/flow/{flowApiName}
      operations:
      - name: launchflow
        method: POST
        description: Salesforce Launch Flow
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: flowApiName
          in: path
          type: string
          description: Flow API Name
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-launch-rest
    port: 8080
    description: REST adapter for Salesforce — Launch. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/actions/custom/flow/{flowapiname}
      name: data-v64-0-actions-custom-flow-flowapiname
      description: REST surface for data-v64.0-actions-custom-flow-flowApiName.
      operations:
      - method: POST
        name: launchflow
        description: Salesforce Launch Flow
        call: salesforce-launch.launchflow
        with:
          flowApiName: rest.flowApiName
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-launch-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Launch. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-launch-flow
      description: Salesforce Launch Flow
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-launch.launchflow
      with:
        flowApiName: tools.flowApiName
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
