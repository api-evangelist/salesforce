naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Keys
  description: 'Salesforce — Keys. 1 operations. Lead operation: Salesforce Keys. Self-contained Naftiko capability covering
    one Salesforce business surface.'
  tags:
  - Salesforce
  - Keys
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-keys
    baseUri: https://login.salesforce.com
    description: Salesforce — Keys business capability. Self-contained, no shared references.
    resources:
    - name: id-keys
      path: /id/keys
      operations:
      - name: salesforcekeys
        method: GET
        description: Salesforce Keys
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-keys-rest
    port: 8080
    description: REST adapter for Salesforce — Keys. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/id/keys
      name: id-keys
      description: REST surface for id-keys.
      operations:
      - method: GET
        name: salesforcekeys
        description: Salesforce Keys
        call: salesforce-keys.salesforcekeys
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-keys-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Keys. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-keys
      description: Salesforce Keys
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-keys.salesforcekeys
      outputParameters:
      - type: object
        mapping: $.
