naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Procedure
  description: 'Salesforce — Procedure. 2 operations. Lead operation: Salesforce Integration Procedure Invocation Using Get.
    Self-contained Naftiko capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Procedure
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-procedure
    baseUri: https://login.salesforce.com
    description: Salesforce — Procedure business capability. Self-contained, no shared references.
    resources:
    - name: apexrest-NAMESPACE-v1-integrationprocedure-TYPE_SUBTYPE
      path: /apexrest/{NAMESPACE}/v1/integrationprocedure/{TYPE_SUBTYPE}
      operations:
      - name: integrationprocedureinvocationusingget
        method: GET
        description: Salesforce Integration Procedure Invocation Using Get
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: NAMESPACE
          in: path
          type: string
          description: 'The namespace: `omnistudio`, `vlocity_ins`, `vlocity_cmt`, or `vlocity_ps`'
          required: true
        - name: TYPE_SUBTYPE
          in: path
          type: string
          description: Type and SubType of the Integration Procedure separated by an underscore.
          required: true
      - name: integrationprocedureinvocationusingpost
        method: POST
        description: Salesforce Integration Procedure Invocation Using Post
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: NAMESPACE
          in: path
          type: string
          description: The namespace is `omnistudio`, `vlocity_ins`, `vlocity_cmt`, or `vlocity_ps`
          required: true
        - name: TYPE_SUBTYPE
          in: path
          type: string
          description: Type and SubType of the Integration Procedure separated by an underscore.
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-procedure-rest
    port: 8080
    description: REST adapter for Salesforce — Procedure. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/apexrest/{namespace}/v1/integrationprocedure/{type-subtype}
      name: apexrest-namespace-v1-integrationprocedure-type-subtype
      description: REST surface for apexrest-NAMESPACE-v1-integrationprocedure-TYPE_SUBTYPE.
      operations:
      - method: GET
        name: integrationprocedureinvocationusingget
        description: Salesforce Integration Procedure Invocation Using Get
        call: salesforce-procedure.integrationprocedureinvocationusingget
        with:
          NAMESPACE: rest.NAMESPACE
          TYPE_SUBTYPE: rest.TYPE_SUBTYPE
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: integrationprocedureinvocationusingpost
        description: Salesforce Integration Procedure Invocation Using Post
        call: salesforce-procedure.integrationprocedureinvocationusingpost
        with:
          NAMESPACE: rest.NAMESPACE
          TYPE_SUBTYPE: rest.TYPE_SUBTYPE
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-procedure-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Procedure. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-integration-procedure-invocation-using
      description: Salesforce Integration Procedure Invocation Using Get
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-procedure.integrationprocedureinvocationusingget
      with:
        NAMESPACE: tools.NAMESPACE
        TYPE_SUBTYPE: tools.TYPE_SUBTYPE
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-integration-procedure-invocation-using-2
      description: Salesforce Integration Procedure Invocation Using Post
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-procedure.integrationprocedureinvocationusingpost
      with:
        NAMESPACE: tools.NAMESPACE
        TYPE_SUBTYPE: tools.TYPE_SUBTYPE
      outputParameters:
      - type: object
        mapping: $.
