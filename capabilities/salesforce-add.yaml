naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Add
  description: 'Salesforce — Add. 2 operations. Lead operation: Salesforce Add an Item to a Cart. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Add
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-add
    baseUri: https://login.salesforce.com
    description: Salesforce — Add business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-commerce-webstores-carts-webCartId-cart-items
      path: /data/v64.0/commerce/webstores//carts/{webCartId}/cart-items
      operations:
      - name: addanitemtoacart
        method: POST
        description: Salesforce Add an Item to a Cart
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: effectiveAccountId
          in: query
          type: string
          required: true
        - name: webCartId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: data-v64.0-tooling-sobjects-PlatformEventChannelMember-PLATFORM_EVENT_CHANNEL_ME
      path: /data/v64.0/tooling/sobjects/PlatformEventChannelMember/{PLATFORM_EVENT_CHANNEL_MEMBER_ID}
      operations:
      - name: addenrichedfieldstochannelmember
        method: PATCH
        description: Salesforce Add Enriched Fields to Channel Member
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: PLATFORM_EVENT_CHANNEL_MEMBER_ID
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-add-rest
    port: 8080
    description: REST adapter for Salesforce — Add. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/commerce/webstores/carts/{webcartid}/cart-items
      name: data-v64-0-commerce-webstores-carts-webcartid-cart-items
      description: REST surface for data-v64.0-commerce-webstores-carts-webCartId-cart-items.
      operations:
      - method: POST
        name: addanitemtoacart
        description: Salesforce Add an Item to a Cart
        call: salesforce-add.addanitemtoacart
        with:
          effectiveAccountId: rest.effectiveAccountId
          webCartId: rest.webCartId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data/v64-0/tooling/sobjects/platformeventchannelmember/{platform-event-channel-member-id}
      name: data-v64-0-tooling-sobjects-platformeventchannelmember-platform-event-channel-me
      description: REST surface for data-v64.0-tooling-sobjects-PlatformEventChannelMember-PLATFORM_EVENT_CHANNEL_ME.
      operations:
      - method: PATCH
        name: addenrichedfieldstochannelmember
        description: Salesforce Add Enriched Fields to Channel Member
        call: salesforce-add.addenrichedfieldstochannelmember
        with:
          PLATFORM_EVENT_CHANNEL_MEMBER_ID: rest.PLATFORM_EVENT_CHANNEL_MEMBER_ID
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-add-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Add. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-add-item-cart
      description: Salesforce Add an Item to a Cart
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-add.addanitemtoacart
      with:
        effectiveAccountId: tools.effectiveAccountId
        webCartId: tools.webCartId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-add-enriched-fields-channel
      description: Salesforce Add Enriched Fields to Channel Member
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: salesforce-add.addenrichedfieldstochannelmember
      with:
        PLATFORM_EVENT_CHANNEL_MEMBER_ID: tools.PLATFORM_EVENT_CHANNEL_MEMBER_ID
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
