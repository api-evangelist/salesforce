naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Gifts
  description: 'Salesforce — Gifts. 1 operations. Lead operation: Salesforce Create Gifts. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Gifts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-gifts
    baseUri: https://login.salesforce.com
    description: Salesforce — Gifts business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-connect-fundraising-gifts
      path: /data/v64.0/connect/fundraising/gifts
      operations:
      - name: creategifts
        method: POST
        description: Salesforce Create Gifts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-gifts-rest
    port: 8080
    description: REST adapter for Salesforce — Gifts. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/connect/fundraising/gifts
      name: data-v64-0-connect-fundraising-gifts
      description: REST surface for data-v64.0-connect-fundraising-gifts.
      operations:
      - method: POST
        name: creategifts
        description: Salesforce Create Gifts
        call: salesforce-gifts.creategifts
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-gifts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Gifts. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-create-gifts
      description: Salesforce Create Gifts
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-gifts.creategifts
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
