naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Checks
  description: 'Salesforce — Checks. 1 operations. Lead operation: Salesforce Bulk Check Batch Status. Self-contained Naftiko
    capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Checks
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-checks
    baseUri: https://login.salesforce.com
    description: Salesforce — Checks business capability. Self-contained, no shared references.
    resources:
    - name: async-64.0-job-batch
      path: /async/64.0/job//batch
      operations:
      - name: bulkcheckbatchstatus
        method: GET
        description: Salesforce Bulk Check Batch Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: X-SFDC-Session
          in: header
          type: string
          required: true
        - name: Accept-Encoding
          in: header
          type: string
          required: true
        - name: Content-Encoding
          in: header
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-checks-rest
    port: 8080
    description: REST adapter for Salesforce — Checks. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/async/64-0/job/batch
      name: async-64-0-job-batch
      description: REST surface for async-64.0-job-batch.
      operations:
      - method: GET
        name: bulkcheckbatchstatus
        description: Salesforce Bulk Check Batch Status
        call: salesforce-checks.bulkcheckbatchstatus
        with:
          X-SFDC-Session: rest.X-SFDC-Session
          Accept-Encoding: rest.Accept-Encoding
          Content-Encoding: rest.Content-Encoding
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-checks-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Checks. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-bulk-check-batch-status
      description: Salesforce Bulk Check Batch Status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-checks.bulkcheckbatchstatus
      with:
        X-SFDC-Session: tools.X-SFDC-Session
        Accept-Encoding: tools.Accept-Encoding
        Content-Encoding: tools.Content-Encoding
      outputParameters:
      - type: object
        mapping: $.
