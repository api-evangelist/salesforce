naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Tokens
  description: 'Salesforce — Tokens. 8 operations. Lead operation: Salesforce Id Token. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Tokens
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-tokens
    baseUri: https://login.salesforce.com
    description: Salesforce — Tokens business capability. Self-contained, no shared references.
    resources:
    - name: root
      path: //
      operations:
      - name: idtoken
        method: GET
        description: Salesforce Id Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Content-Type
          in: header
          type: string
          required: true
    - name: services-data-v64.0-apps-oauth-usage-tokens
      path: /services/data/v64.0/apps/oauth/usage///tokens
      operations:
      - name: oauthappuserstokens
        method: GET
        description: Salesforce Oauth App Users Tokens
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Authorization
          in: header
          type: string
          description: Replace <token> with your access token
          required: true
      - name: oauthusertokensrevoke
        method: DELETE
        description: Salesforce Oauth User Tokens Revoke
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Authorization
          in: header
          type: string
          description: Replace <token> with your access token
          required: true
    - name: services-data-v64.0-apps-oauth-usage-tokens
      path: /services/data/v64.0/apps/oauth/usage//tokens
      operations:
      - name: oauthtokensrevoke
        method: DELETE
        description: Salesforce Oauth Tokens Revoke
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Authorization
          in: header
          type: string
          description: Replace <token> with your access token
          required: true
    - name: services-data-v64.0-apps-oauth-usage-tokens
      path: /services/data/v64.0/apps/oauth/usage/tokens/
      operations:
      - name: oauthtokenrevoke
        method: DELETE
        description: Salesforce Oauth Token Revoke
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Authorization
          in: header
          type: string
          description: Replace <token> with your access token
          required: true
    - name: services-oauth2-introspect
      path: /services/oauth2/introspect
      operations:
      - name: openidconnecttokenintrospectionendpoint
        method: POST
        description: Salesforce Openid Connect Token Introspection Endpoint
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Content-Type
          in: header
          type: string
          required: true
        - name: Accept
          in: header
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: services-oauth2-revoke
      path: /services/oauth2/revoke
      operations:
      - name: revoketoken
        method: POST
        description: Salesforce Revoke Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: services-oauth2-token
      path: /services/oauth2/token
      operations:
      - name: registrationtokenexchange
        method: POST
        description: Salesforce Registration - Token Exchange
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-tokens-rest
    port: 8080
    description: REST adapter for Salesforce — Tokens. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1
      name: root
      description: REST surface for root.
      operations:
      - method: GET
        name: idtoken
        description: Salesforce Id Token
        call: salesforce-tokens.idtoken
        with:
          Content-Type: rest.Content-Type
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/services/data/v64-0/apps/oauth/usage/tokens
      name: services-data-v64-0-apps-oauth-usage-tokens
      description: REST surface for services-data-v64.0-apps-oauth-usage-tokens.
      operations:
