naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Relevant
  description: 'Salesforce — Relevant. 1 operations. Lead operation: Salesforce Relevant Items. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Relevant
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-relevant
    baseUri: https://login.salesforce.com
    description: Salesforce — Relevant business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-sobjects-relevantItems
      path: /data/v64.0/sobjects/relevantItems
      operations:
      - name: relevantitems
        method: GET
        description: Salesforce Relevant Items
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Content-Type
          in: header
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-relevant-rest
    port: 8080
    description: REST adapter for Salesforce — Relevant. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/data/v64-0/sobjects/relevantitems
      name: data-v64-0-sobjects-relevantitems
      description: REST surface for data-v64.0-sobjects-relevantItems.
      operations:
      - method: GET
        name: relevantitems
        description: Salesforce Relevant Items
        call: salesforce-relevant.relevantitems
        with:
          Content-Type: rest.Content-Type
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-relevant-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Relevant. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-relevant-items
      description: Salesforce Relevant Items
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-relevant.relevantitems
      with:
        Content-Type: tools.Content-Type
      outputParameters:
      - type: object
        mapping: $.
