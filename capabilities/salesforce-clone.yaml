naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Clone
  description: 'Salesforce — Clone. 1 operations. Lead operation: Salesforce Get Default Values to Clone a Record. Self-contained
    Naftiko capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Clone
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-clone
    baseUri: https://login.salesforce.com
    description: Salesforce — Clone business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-ui-api-record-defaults-clone-RECORD_ID
      path: /data/v64.0/ui-api/record-defaults/clone/{RECORD_ID}
      operations:
      - name: getdefaultvaluestoclonearecord
        method: GET
        description: Salesforce Get Default Values to Clone a Record
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: RECORD_ID
          in: path
          type: string
          description: Record ID
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-clone-rest
    port: 8080
    description: REST adapter for Salesforce — Clone. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/ui-api/record-defaults/clone/{record-id}
      name: data-v64-0-ui-api-record-defaults-clone-record-id
      description: REST surface for data-v64.0-ui-api-record-defaults-clone-RECORD_ID.
      operations:
      - method: GET
        name: getdefaultvaluestoclonearecord
        description: Salesforce Get Default Values to Clone a Record
        call: salesforce-clone.getdefaultvaluestoclonearecord
        with:
          RECORD_ID: rest.RECORD_ID
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-clone-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Clone. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-get-default-values-clone
      description: Salesforce Get Default Values to Clone a Record
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-clone.getdefaultvaluestoclonearecord
      with:
        RECORD_ID: tools.RECORD_ID
      outputParameters:
      - type: object
        mapping: $.
