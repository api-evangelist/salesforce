naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Prompts
  description: 'Salesforce — Prompts. 1 operations. Lead operation: Salesforce Generate Response Based on Prompt Template.
    Self-contained Naftiko capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Prompts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-prompts
    baseUri: https://login.salesforce.com
    description: Salesforce — Prompts business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-einstein-prompt-templates-PROMPT_TEMPLATE_API_NAME-generations
      path: /data/v64.0/einstein/prompt-templates/{PROMPT_TEMPLATE_API_NAME}/generations
      operations:
      - name: generateresponsebasedonprompttemplate
        method: POST
        description: Salesforce Generate Response Based on Prompt Template
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: PROMPT_TEMPLATE_API_NAME
          in: path
          type: string
          description: API name of the prompt template to invoke
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-prompts-rest
    port: 8080
    description: REST adapter for Salesforce — Prompts. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/einstein/prompt-templates/{prompt-template-api-name}/generations
      name: data-v64-0-einstein-prompt-templates-prompt-template-api-name-generations
      description: REST surface for data-v64.0-einstein-prompt-templates-PROMPT_TEMPLATE_API_NAME-generations.
      operations:
      - method: POST
        name: generateresponsebasedonprompttemplate
        description: Salesforce Generate Response Based on Prompt Template
        call: salesforce-prompts.generateresponsebasedonprompttemplate
        with:
          PROMPT_TEMPLATE_API_NAME: rest.PROMPT_TEMPLATE_API_NAME
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-prompts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Prompts. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-generate-response-based-prompt
      description: Salesforce Generate Response Based on Prompt Template
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-prompts.generateresponsebasedonprompttemplate
      with:
        PROMPT_TEMPLATE_API_NAME: tools.PROMPT_TEMPLATE_API_NAME
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
