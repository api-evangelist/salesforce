          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: data-v64.0-loyalty-programs-loyaltyProgramName-members
      path: /data/v64.0/loyalty-programs/{loyaltyProgramName}/members
      operations:
      - name: memberprofile
        method: GET
        description: Salesforce Member Profile
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: memberId
          in: query
          type: string
          description: The ID of the loyalty program member.
          required: true
        - name: membershipNumber
          in: query
          type: string
          description: The membership number of the loyalty program member.
          required: true
        - name: programCurrencyName
          in: query
          type: string
          description: The name of the loyalty program currency associated with the member.
          required: true
        - name: loyaltyProgramName
          in: path
          type: string
          required: true
