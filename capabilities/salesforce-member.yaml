      path: /data/v64.0/connect/loyalty/member/{memberId}/memberbenefits
      operations:
      - name: memberbenefits
        method: GET
        description: Salesforce Member Benefits
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: memberId
          in: path
          type: string
          required: true
    - name: data-v64.0-loyalty-programs-loyaltyProgramName-corporate-member-enrollments
      path: /data/v64.0/loyalty-programs/{loyaltyProgramName}/corporate-member-enrollments
      operations:
      - name: corporatememberenrollments
        method: POST
        description: Salesforce Corporate Member Enrollments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: loyaltyProgramName
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: data-v64.0-loyalty-programs-loyaltyProgramName-individual-member-enrollments
      path: /data/v64.0/loyalty-programs/{loyaltyProgramName}/individual-member-enrollments
      operations:
      - name: individualmemberenrollments
        method: POST
        description: Salesforce Individual Member Enrollments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
