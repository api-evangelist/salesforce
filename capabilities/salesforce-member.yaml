naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Member
  description: 'Salesforce — Member. 9 operations. Lead operation: Salesforce Member Benefits. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Member
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
