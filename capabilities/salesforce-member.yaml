        method: PATCH
        description: Salesforce Add Enriched Fields to Channel Member
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: PLATFORM_EVENT_CHANNEL_MEMBER_ID
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: getchannelmember
        method: GET
        description: Salesforce Get Channel Member
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: PLATFORM_EVENT_CHANNEL_MEMBER_ID
          in: path
          type: string
          required: true
      - name: deletechannelmember
