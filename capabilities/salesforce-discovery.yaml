naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Discovery
  description: 'Salesforce — Discovery. 1 operations. Lead operation: Salesforce Openid Connect Discovery Endpoint. Self-contained
    Naftiko capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Discovery
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-discovery
    baseUri: https://login.salesforce.com
    description: Salesforce — Discovery business capability. Self-contained, no shared references.
    resources:
    - name: .well-known-openid-configuration
      path: /.well-known/openid-configuration
      operations:
      - name: openidconnectdiscoveryendpoint
        method: GET
        description: Salesforce Openid Connect Discovery Endpoint
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-discovery-rest
    port: 8080
    description: REST adapter for Salesforce — Discovery. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/well-known/openid-configuration
      name: well-known-openid-configuration
      description: REST surface for .well-known-openid-configuration.
      operations:
      - method: GET
        name: openidconnectdiscoveryendpoint
        description: Salesforce Openid Connect Discovery Endpoint
        call: salesforce-discovery.openidconnectdiscoveryendpoint
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-discovery-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Discovery. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-openid-connect-discovery-endpoint
      description: Salesforce Openid Connect Discovery Endpoint
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-discovery.openidconnectdiscoveryendpoint
      outputParameters:
      - type: object
        mapping: $.
