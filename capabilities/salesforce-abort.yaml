naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Abort
  description: 'Salesforce — Abort. 2 operations. Lead operation: Salesforce Close or Abort a Job. Self-contained Naftiko
    capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Abort
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-abort
    baseUri: https://login.salesforce.com
    description: Salesforce — Abort business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-jobs-ingest
      path: /data/v64.0/jobs/ingest/
      operations:
      - name: closeorabortajob
        method: PATCH
        description: Salesforce Close or Abort a Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: data-v64.0-jobs-query
      path: /data/v64.0/jobs/query/
      operations:
      - name: abortajobquery
        method: PATCH
        description: Salesforce Abort a Job Query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-abort-rest
    port: 8080
    description: REST adapter for Salesforce — Abort. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/jobs/ingest
      name: data-v64-0-jobs-ingest
      description: REST surface for data-v64.0-jobs-ingest.
      operations:
      - method: PATCH
        name: closeorabortajob
        description: Salesforce Close or Abort a Job
        call: salesforce-abort.closeorabortajob
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data/v64-0/jobs/query
      name: data-v64-0-jobs-query
      description: REST surface for data-v64.0-jobs-query.
      operations:
      - method: PATCH
        name: abortajobquery
        description: Salesforce Abort a Job Query
        call: salesforce-abort.abortajobquery
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-abort-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Abort. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-close-abort-job
      description: Salesforce Close or Abort a Job
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: salesforce-abort.closeorabortajob
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-abort-job-query
      description: Salesforce Abort a Job Query
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: salesforce-abort.abortajobquery
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
