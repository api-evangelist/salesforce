naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Invites
  description: 'Salesforce — Invites. 1 operations. Lead operation: Salesforce Group Invites. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Invites
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-invites
    baseUri: https://login.salesforce.com
    description: Salesforce — Invites business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-chatter-groups-group-GROUP_ID-invite
      path: /data/v64.0/chatter/groups/group/{GROUP_ID}/invite
      operations:
      - name: groupinvites
        method: POST
        description: Salesforce Group Invites
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: GROUP_ID
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-invites-rest
    port: 8080
    description: REST adapter for Salesforce — Invites. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/chatter/groups/group/{group-id}/invite
      name: data-v64-0-chatter-groups-group-group-id-invite
      description: REST surface for data-v64.0-chatter-groups-group-GROUP_ID-invite.
      operations:
      - method: POST
        name: groupinvites
        description: Salesforce Group Invites
        call: salesforce-invites.groupinvites
        with:
          GROUP_ID: rest.GROUP_ID
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-invites-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Invites. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-group-invites
      description: Salesforce Group Invites
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-invites.groupinvites
      with:
        GROUP_ID: tools.GROUP_ID
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
