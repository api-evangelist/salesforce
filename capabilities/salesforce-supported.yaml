naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Supported
  description: 'Salesforce — Supported. 1 operations. Lead operation: Salesforce Get a Directory of Supported Objects. Self-contained
    Naftiko capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Supported
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-supported
    baseUri: https://login.salesforce.com
    description: Salesforce — Supported business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-ui-api-object-info
      path: /data/v64.0/ui-api/object-info
      operations:
      - name: getadirectoryofsupportedobjects
        method: GET
        description: Salesforce Get a Directory of Supported Objects
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-supported-rest
    port: 8080
    description: REST adapter for Salesforce — Supported. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/data/v64-0/ui-api/object-info
      name: data-v64-0-ui-api-object-info
      description: REST surface for data-v64.0-ui-api-object-info.
      operations:
      - method: GET
        name: getadirectoryofsupportedobjects
        description: Salesforce Get a Directory of Supported Objects
        call: salesforce-supported.getadirectoryofsupportedobjects
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-supported-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Supported. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-get-directory-supported-objects
      description: Salesforce Get a Directory of Supported Objects
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-supported.getadirectoryofsupportedobjects
      outputParameters:
      - type: object
        mapping: $.
