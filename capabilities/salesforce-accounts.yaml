naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Accounts
  description: 'Salesforce — Accounts. 1 operations. Lead operation: Salesforce Accounts. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Accounts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-accounts
    baseUri: https://login.salesforce.com
    description: Salesforce — Accounts business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-graphql
      path: /data/v64.0/graphql
      operations:
      - name: accounts
        method: POST
        description: Salesforce Accounts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: X-Chatter-Entity-Encoding
          in: header
          type: boolean
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-accounts-rest
    port: 8080
    description: REST adapter for Salesforce — Accounts. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/data/v64-0/graphql
      name: data-v64-0-graphql
      description: REST surface for data-v64.0-graphql.
      operations:
      - method: POST
        name: accounts
        description: Salesforce Accounts
        call: salesforce-accounts.accounts
        with:
          X-Chatter-Entity-Encoding: rest.X-Chatter-Entity-Encoding
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-accounts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Accounts. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-accounts
      description: Salesforce Accounts
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-accounts.accounts
      with:
        X-Chatter-Entity-Encoding: tools.X-Chatter-Entity-Encoding
      outputParameters:
      - type: object
        mapping: $.
