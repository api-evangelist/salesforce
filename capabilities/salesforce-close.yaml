naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Close
  description: 'Salesforce — Close. 2 operations. Lead operation: Salesforce Bulk Close Job. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Close
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-close
    baseUri: https://login.salesforce.com
    description: Salesforce — Close business capability. Self-contained, no shared references.
    resources:
    - name: async-64.0-job
      path: /async/64.0/job/
      operations:
      - name: bulkclosejob
        method: POST
        description: Salesforce Bulk Close Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: X-SFDC-Session
          in: header
          type: string
          required: true
        - name: charset
          in: header
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: data-v64.0-jobs-ingest
      path: /data/v64.0/jobs/ingest/
      operations:
      - name: closeorabortajob
        method: PATCH
        description: Salesforce Close or Abort a Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-close-rest
    port: 8080
    description: REST adapter for Salesforce — Close. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/async/64-0/job
      name: async-64-0-job
      description: REST surface for async-64.0-job.
      operations:
      - method: POST
        name: bulkclosejob
        description: Salesforce Bulk Close Job
        call: salesforce-close.bulkclosejob
        with:
          X-SFDC-Session: rest.X-SFDC-Session
          charset: rest.charset
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data/v64-0/jobs/ingest
      name: data-v64-0-jobs-ingest
      description: REST surface for data-v64.0-jobs-ingest.
      operations:
      - method: PATCH
        name: closeorabortajob
        description: Salesforce Close or Abort a Job
        call: salesforce-close.closeorabortajob
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-close-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Close. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-bulk-close-job
      description: Salesforce Bulk Close Job
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-close.bulkclosejob
      with:
        X-SFDC-Session: tools.X-SFDC-Session
        charset: tools.charset
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-close-abort-job
      description: Salesforce Close or Abort a Job
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: salesforce-close.closeorabortajob
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
