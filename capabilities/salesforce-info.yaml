naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Info
  description: 'Salesforce — Info. 4 operations. Lead operation: Salesforce Get Job Info. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Info
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-info
    baseUri: https://login.salesforce.com
    description: Salesforce — Info business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-jobs-ingest
      path: /data/v64.0/jobs/ingest/
      operations:
      - name: getjobinfo
        method: GET
        description: Salesforce Get Job Info
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: data-v64.0-jobs-query
      path: /data/v64.0/jobs/query/
      operations:
      - name: getjobinfoquery
        method: GET
        description: Salesforce Get Job Info Query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: oauth2-userinfo
      path: /oauth2/userinfo
      operations:
      - name: getuserinfo1
        method: GET
        description: Salesforce User Info
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Content-Type
          in: header
          type: string
          required: true
    - name: services-oauth2-userinfo
      path: /services/oauth2/userinfo
      operations:
      - name: getuserinfo
        method: GET
        description: Salesforce Get User Info
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Authorization
          in: header
          type: string
          description: Replace <token> with your access token
          required: true
        - name: Content-Type
          in: header
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-info-rest
    port: 8080
    description: REST adapter for Salesforce — Info. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/jobs/ingest
      name: data-v64-0-jobs-ingest
      description: REST surface for data-v64.0-jobs-ingest.
      operations:
      - method: GET
        name: getjobinfo
        description: Salesforce Get Job Info
        call: salesforce-info.getjobinfo
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data/v64-0/jobs/query
      name: data-v64-0-jobs-query
      description: REST surface for data-v64.0-jobs-query.
      operations:
      - method: GET
        name: getjobinfoquery
        description: Salesforce Get Job Info Query
        call: salesforce-info.getjobinfoquery
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/oauth2/userinfo
      name: oauth2-userinfo
      description: REST surface for oauth2-userinfo.
      operations:
      - method: GET
        name: getuserinfo1
        description: Salesforce User Info
        call: salesforce-info.getuserinfo1
        with:
          Content-Type: rest.Content-Type
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/services/oauth2/userinfo
      name: services-oauth2-userinfo
      description: REST surface for services-oauth2-userinfo.
      operations:
      - method: GET
        name: getuserinfo
        description: Salesforce Get User Info
        call: salesforce-info.getuserinfo
        with:
          Authorization: rest.Authorization
          Content-Type: rest.Content-Type
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-info-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Info. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-get-job-info
      description: Salesforce Get Job Info
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-info.getjobinfo
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-get-job-info-query
      description: Salesforce Get Job Info Query
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-info.getjobinfoquery
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-user-info
      description: Salesforce User Info
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-info.getuserinfo1
      with:
        Content-Type: tools.Content-Type
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-get-user-info
      description: Salesforce Get User Info
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-info.getuserinfo
      with:
        Authorization: tools.Authorization
        Content-Type: tools.Content-Type
      outputParameters:
      - type: object
        mapping: $.
