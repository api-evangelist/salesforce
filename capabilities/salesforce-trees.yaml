naftiko: 1.0.0-alpha2
info:
  label: Salesforce — Trees
  description: 'Salesforce — Trees. 1 operations. Lead operation: Salesforce Sobject Tree. Self-contained Naftiko capability
    covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Trees
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-trees
    baseUri: https://login.salesforce.com
    description: Salesforce — Trees business capability. Self-contained, no shared references.
    resources:
    - name: data-v64.0-composite-tree-SOBJECT_API_NAME
      path: /data/v64.0/composite/tree/{SOBJECT_API_NAME}
      operations:
      - name: sobjecttree
        method: POST
        description: Salesforce Sobject Tree
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: SOBJECT_API_NAME
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-trees-rest
    port: 8080
    description: REST adapter for Salesforce — Trees. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data/v64-0/composite/tree/{sobject-api-name}
      name: data-v64-0-composite-tree-sobject-api-name
      description: REST surface for data-v64.0-composite-tree-SOBJECT_API_NAME.
      operations:
      - method: POST
        name: sobjecttree
        description: Salesforce Sobject Tree
        call: salesforce-trees.sobjecttree
        with:
          SOBJECT_API_NAME: rest.SOBJECT_API_NAME
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-trees-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce — Trees. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesforce-sobject-tree
      description: Salesforce Sobject Tree
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-trees.sobjecttree
      with:
        SOBJECT_API_NAME: tools.SOBJECT_API_NAME
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
