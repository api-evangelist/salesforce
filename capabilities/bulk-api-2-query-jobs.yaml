naftiko: 1.0.0-alpha2
info:
  label: Salesforce Bulk API 2.0 — Query Jobs
  description: 'Salesforce Bulk API 2.0 — Query Jobs. 5 operations. Lead operation: Salesforce Create a Query Job. Self-contained
    Naftiko capability covering one Salesforce business surface.'
  tags:
  - Salesforce
  - Query Jobs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_API_KEY: SALESFORCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: bulk-api-2-query-jobs
    baseUri: https://{instance}.salesforce.com/services/data/v{version}/jobs
    description: Salesforce Bulk API 2.0 — Query Jobs business capability. Self-contained, no shared references.
    resources:
    - name: query
      path: /query
      operations:
      - name: createqueryjob
        method: POST
        description: Salesforce Create a Query Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listqueryjobs
        method: GET
        description: Salesforce List Query Jobs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: jobType
          in: query
          type: string
          description: Filter results by job type. Use V2Query for Bulk API 2.0 query jobs.
    - name: query-jobId
      path: /query/{jobId}
      operations:
      - name: getqueryjobinfo
        method: GET
        description: Salesforce Get Query Job Info
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatequeryjob
        method: PATCH
        description: Salesforce Abort or Close a Query Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletequeryjob
        method: DELETE
        description: Salesforce Delete a Query Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_API_KEY}}'
  exposes:
  - type: rest
    namespace: bulk-api-2-query-jobs-rest
    port: 8080
    description: REST adapter for Salesforce Bulk API 2.0 — Query Jobs. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/query
      name: query
      description: REST surface for query.
      operations:
      - method: POST
        name: createqueryjob
        description: Salesforce Create a Query Job
        call: bulk-api-2-query-jobs.createqueryjob
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listqueryjobs
        description: Salesforce List Query Jobs
        call: bulk-api-2-query-jobs.listqueryjobs
        with:
          jobType: rest.jobType
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/query/{jobid}
      name: query-jobid
      description: REST surface for query-jobId.
      operations:
      - method: GET
        name: getqueryjobinfo
        description: Salesforce Get Query Job Info
        call: bulk-api-2-query-jobs.getqueryjobinfo
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updatequeryjob
        description: Salesforce Abort or Close a Query Job
        call: bulk-api-2-query-jobs.updatequeryjob
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletequeryjob
        description: Salesforce Delete a Query Job
        call: bulk-api-2-query-jobs.deletequeryjob
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: bulk-api-2-query-jobs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Bulk API 2.0 — Query Jobs. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: salesforce-create-query-job
      description: Salesforce Create a Query Job
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: bulk-api-2-query-jobs.createqueryjob
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-list-query-jobs
      description: Salesforce List Query Jobs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bulk-api-2-query-jobs.listqueryjobs
      with:
        jobType: tools.jobType
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-get-query-job-info
      description: Salesforce Get Query Job Info
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bulk-api-2-query-jobs.getqueryjobinfo
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-abort-close-query-job
      description: Salesforce Abort or Close a Query Job
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: bulk-api-2-query-jobs.updatequeryjob
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-delete-query-job
      description: Salesforce Delete a Query Job
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: bulk-api-2-query-jobs.deletequeryjob
      outputParameters:
      - type: object
        mapping: $.
